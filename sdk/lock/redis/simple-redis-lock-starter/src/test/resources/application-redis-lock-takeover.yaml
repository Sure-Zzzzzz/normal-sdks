# redis-route 接管（enable=true）而 lock 自身 route 开关保持缺省 false：
# 验证 lock 自建模板按类型让位，不自建 simpleRedisLockRedisTemplate
io:
  github:
    surezzzzzz:
      sdk:
        redis:
          route:
            enable: true
            default-source: default
            sources:
              default:
                mode: standalone
                host: localhost
                port: 6379
                database: 0
                timeout-ms: 3000
                connect-timeout-ms: 3000

logging:
  level:
    io.github.surezzzzzz.sdk.lock.redis: DEBUG
    io.github.surezzzzzz.sdk.redis.route: DEBUG
