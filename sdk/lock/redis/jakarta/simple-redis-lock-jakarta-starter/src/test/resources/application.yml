io:
  github:
    surezzzzzz:
      sdk:
        lock:
          redis:
            route:
              enable: true
        redis:
          route:
            enable: true
            default-source: redis3Standalone
            sources:
              default:
                mode: standalone
                host: localhost
                port: 6379
                database: 0
                timeout-ms: 3000
                connect-timeout-ms: 3000
              lock:
                mode: standalone
                host: localhost
                port: 6379
                database: 1
                timeout-ms: 3000
                connect-timeout-ms: 3000
              redis3Standalone:
                mode: standalone
                host: localhost
                port: 16379
                timeout-ms: 3000
                connect-timeout-ms: 3000
              redis5Standalone:
                mode: standalone
                host: localhost
                port: 16380
                timeout-ms: 3000
                connect-timeout-ms: 3000
              redis7Standalone:
                mode: standalone
                host: localhost
                port: 16381
                timeout-ms: 3000
                connect-timeout-ms: 3000
              redis3Cluster:
                mode: cluster
                nodes:
                  - localhost:17000
                  - localhost:17001
                  - localhost:17002
                  - localhost:17003
                  - localhost:17004
                  - localhost:17005
                timeout-ms: 3000
                connect-timeout-ms: 3000
                lettuce:
                  cluster-adaptive-refresh: true
                  cluster-periodic-refresh: true
                  cluster-refresh-period-ms: 30000
              redis5Cluster:
                mode: cluster
                nodes:
                  - localhost:17010
                  - localhost:17011
                  - localhost:17012
                  - localhost:17013
                  - localhost:17014
                  - localhost:17015
                timeout-ms: 3000
                connect-timeout-ms: 3000
                lettuce:
                  cluster-adaptive-refresh: true
                  cluster-periodic-refresh: true
                  cluster-refresh-period-ms: 30000
              redis7Cluster:
                mode: cluster
                nodes:
                  - localhost:17020
                  - localhost:17021
                  - localhost:17022
                  - localhost:17023
                  - localhost:17024
                  - localhost:17025
                timeout-ms: 3000
                connect-timeout-ms: 3000
                lettuce:
                  cluster-adaptive-refresh: true
                  cluster-periodic-refresh: true
                  cluster-refresh-period-ms: 30000
            rules:
              - pattern: "lock:"
                type: prefix
                datasource: lock
                priority: 1
              - pattern: "lock5:"
                type: prefix
                datasource: redis5Standalone
                priority: 2
              - pattern: "lock7:"
                type: prefix
                datasource: redis7Standalone
                priority: 3
              - pattern: "cluster3:"
                type: prefix
                datasource: redis3Cluster
                priority: 4
              - pattern: "cluster5:"
                type: prefix
                datasource: redis5Cluster
                priority: 5
              - pattern: "cluster7:"
                type: prefix
                datasource: redis7Cluster
                priority: 6

redis-lock:
  route:
    matrix:
      expectation:
        known-datasources:
          - redis3Standalone
          - redis5Standalone
          - redis7Standalone
          - redis3Cluster
          - redis5Cluster
          - redis7Cluster
        unknown-datasources: [ ]
        compatibility-boundary: "Spring Boot 3.x 使用 Spring Data Redis 3.x，六个矩阵数据源均应完成探测。"

logging:
  level:
    io.github.surezzzzzz.sdk.lock.redis: DEBUG
    io.github.surezzzzzz.sdk.redis.route: DEBUG
