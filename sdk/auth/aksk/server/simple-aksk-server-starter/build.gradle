import org.springframework.boot.gradle.tasks.bundling.BootJar

sourceSets {
    e2eServer {
        compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    e2eServerImplementation.extendsFrom testImplementation
    e2eServerRuntimeOnly.extendsFrom testRuntimeOnly
    e2eServerAnnotationProcessor.extendsFrom testAnnotationProcessor
}

dependencies {
    api 'io.github.sure-zzzzzz:simple-aksk-core:3.0.0'
    api 'io.github.sure-zzzzzz:simple-aksk-server-core:3.0.1'
    api 'io.github.sure-zzzzzz:simple-application-authorization-core:1.0.0'
    api 'io.github.sure-zzzzzz:simple-data-permission-core:1.1.0'

    // SmartCache / SmartLimiter
    api 'io.github.sure-zzzzzz:smart-cache-starter:1.1.2'
    api 'io.github.sure-zzzzzz:smart-redis-limiter-starter:1.1.4'
    api 'com.github.ben-manes.caffeine:caffeine:2.9.3'

    // Spring Boot
    compileOnly 'org.springframework.boot:spring-boot-starter-web'
    compileOnly 'org.springframework.boot:spring-boot-starter-security'
    compileOnly 'org.springframework.boot:spring-boot-starter-data-jpa'
    api 'org.springframework.boot:spring-boot-starter-data-redis'
    api 'org.springframework.boot:spring-boot-starter-aop'
    compileOnly 'org.springframework.boot:spring-boot-starter-thymeleaf'
    compileOnly 'org.springframework.boot:spring-boot-configuration-processor'
    compileOnly "org.springframework.boot:spring-boot-starter-validation"

    // Spring Authorization Server
    api 'org.springframework.security:spring-security-oauth2-authorization-server:0.4.1'

    // 指数退避重试
    api 'io.github.sure-zzzzzz:task-retry-starter:1.0.0'

    // Database
    runtimeOnly 'mysql:mysql-connector-java:8.0.33'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-log4j2'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-redis'
    testImplementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework.boot:spring-boot-starter-security'
    testImplementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    testImplementation 'org.apache.httpcomponents:httpclient:4.5.14'
}

tasks.register('e2eServerBootJar', BootJar) {
    group = 'verification'
    description = '构建 AKSK 协作 E2E Server 可执行 jar'
    dependsOn(tasks.named('e2eServerClasses'))
    archiveFileName.set('simple-aksk-e2e-server.jar')
    destinationDirectory.set(rootProject.layout.buildDirectory.dir('iam-aksk-e2e'))
    mainClass.set('io.github.surezzzzzz.sdk.auth.aksk.server.e2eserver.AkskE2eServerApplication')
    classpath = sourceSets.e2eServer.runtimeClasspath
}
