<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' · AKSK Server'">AKSK Server</title>
    <link href="/admin/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/admin/css/console.css(v='3.0.0-responsive-3')}" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/admin/img/aksk-icon.svg">
    <meta name="admin-csrf-token" th:content="${_csrf.token}">
    <meta name="admin-csrf-header" th:content="${_csrf.headerName}">
</head>
<body>
<nav th:fragment="sidebar(active, client)" class="admin-sidebar" aria-label="管理导航">
    <a class="admin-brand" href="/admin">
        <img src="/admin/img/aksk-logo.svg" alt="AKSK Server">
        <span>AKSK Server</span>
    </a>
    <div class="admin-nav-label">管理控制台</div>
    <a href="/admin" class="admin-nav-link" th:classappend="${active == 'clients'} ? ' active'">
        <span class="admin-nav-icon" aria-hidden="true">⌘</span><span>Client 管理</span>
    </a>
    <a th:if="${client != null}" th:href="@{/admin/{id}/authorization(id=${client.clientId})}"
       class="admin-nav-link" th:classappend="${active == 'authorization'} ? ' active'">
        <span class="admin-nav-icon" aria-hidden="true">✓</span><span>应用授权</span>
    </a>
    <span th:if="${client == null}" class="admin-nav-link disabled" title="请先从 Client 详情进入应用授权">
        <span class="admin-nav-icon" aria-hidden="true">✓</span><span>应用授权</span>
    </span>
    <a href="/admin/token" class="admin-nav-link" th:classappend="${active == 'tokens'} ? ' active'">
        <span class="admin-nav-icon" aria-hidden="true">◆</span><span>Token 管理</span>
    </a>
    <a href="/admin/token/test" class="admin-nav-link" th:classappend="${active == 'token-test'} ? ' active'">
        <span class="admin-nav-icon" aria-hidden="true">⌕</span><span>Token 测试</span>
    </a>
    <a href="/admin/security-context-demo" class="admin-nav-link" th:classappend="${active == 'security-context'} ? ' active'">
        <span class="admin-nav-icon" aria-hidden="true">{ }</span><span>安全上下文</span>
    </a>
    <div class="admin-sidebar-footer">
        <form action="/admin/logout" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="admin-logout">退出登录</button>
        </form>
    </div>
</nav>

<header th:fragment="topbar(title, subtitle)" class="admin-topbar">
    <div>
        <h1 th:text="${title}">管理页面</h1>
        <p th:if="${subtitle != null}" th:text="${subtitle}"></p>
    </div>
</header>

<div th:fragment="flash" class="admin-flash">
    <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="关闭"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="关闭"></button>
    </div>
</div>

<th:block th:fragment="scripts">
    <script src="/admin/js/bootstrap.bundle.min.js"></script>
    <script src="/admin/js/console.js"></script>
</th:block>
</body>
</html>
