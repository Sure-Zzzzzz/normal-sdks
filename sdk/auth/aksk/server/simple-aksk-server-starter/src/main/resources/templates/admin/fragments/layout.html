<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title th:text="${title} + ' · AKSK Server'">AKSK Server</title>
    <link href="/admin/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/admin/css/console.css(v='3.0.0-responsive-3')}">
    <link href="/admin/img/aksk-icon.svg" rel="icon" type="image/svg+xml">
    <meta name="admin-csrf-token" th:content="${_csrf.token}">
    <meta name="admin-csrf-header" th:content="${_csrf.headerName}">
</head>
<body>
<nav aria-label="管理导航" class="admin-sidebar" th:fragment="sidebar(active)">
    <a class="admin-brand" href="/admin">
        <img alt="AKSK Server" src="/admin/img/aksk-logo.svg">
        <span>AKSK Server</span>
    </a>
    <div class="admin-nav-label">管理控制台</div>
    <a class="admin-nav-link" href="/admin" th:classappend="${active == 'clients'} ? ' active'">
        <span aria-hidden="true" class="admin-nav-icon">⌘</span><span>Client 管理</span>
    </a>
    <a class="admin-nav-link" href="/admin/token" th:classappend="${active == 'tokens'} ? ' active'">
        <span aria-hidden="true" class="admin-nav-icon">◆</span><span>Token 管理</span>
    </a>
    <a class="admin-nav-link" href="/admin/token/test" th:classappend="${active == 'token-test'} ? ' active'">
        <span aria-hidden="true" class="admin-nav-icon">⌕</span><span>Token 测试</span>
    </a>
    <a class="admin-nav-link" href="/admin/security-context-demo"
       th:classappend="${active == 'security-context'} ? ' active'">
        <span aria-hidden="true" class="admin-nav-icon">{ }</span><span>安全上下文</span>
    </a>
    <div class="admin-sidebar-footer">
        <form action="/admin/logout" method="post">
            <input th:name="${_csrf.parameterName}" th:value="${_csrf.token}" type="hidden">
            <button class="admin-logout" type="submit">退出登录</button>
        </form>
    </div>
</nav>

<header class="admin-topbar" th:fragment="topbar(title, subtitle)">
    <div>
        <h1 th:text="${title}">管理页面</h1>
        <p th:if="${subtitle != null}" th:text="${subtitle}"></p>
    </div>
</header>

<div class="admin-flash" th:fragment="flash">
    <div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${message}">
        <span th:text="${message}"></span>
        <button aria-label="关闭" class="btn-close" data-bs-dismiss="alert" type="button"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" role="alert" th:if="${error}">
        <span th:text="${error}"></span>
        <button aria-label="关闭" class="btn-close" data-bs-dismiss="alert" type="button"></button>
    </div>
</div>

<th:block th:fragment="scripts">
    <script src="/admin/js/bootstrap.bundle.min.js"></script>
    <script src="/admin/js/console.js"></script>
</th:block>
</body>
</html>
