<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="admin/fragments/layout :: head('创建用户级 Client')"></head>
<body class="admin-console">
<div th:replace="admin/fragments/layout :: sidebar('clients')"></div>
<main class="admin-main">
    <header th:replace="admin/fragments/layout :: topbar('创建用户级 Client', '用户级 AKU 由本人在统一应用门户自助创建')"></header>
    <section class="admin-content">
        <div th:replace="admin/fragments/layout :: flash"></div>
        <div class="admin-form-card">
            <div class="card">
                <div class="card-header">
                    <h4>创建用户级AKSK</h4>
                </div>
                <div class="card-body">
                    <!-- 错误提示（直接 POST 被拒时） -->
                    <div class="alert alert-danger" role="alert" th:if="${error}">
                        <span th:text="${error}"></span>
                    </div>

                    <div class="alert alert-info" role="alert">
                        用户级 AKU 已收敛为<b>本人自助创建</b>：请使用本人账号登录统一应用门户，
                        进入「AKSK访问凭证管理 → 我的 AKSK 访问凭证」页面创建。
                        AKU 的页面、接口与数据授权来自 IAM 权限投影，管理面不再代建。
                    </div>

                    <div class="mb-3">
                        <b>管理面仍可对既有用户级 Client 做什么？</b>
                        <ul class="mb-0 mt-2">
                            <li>查询：Client 列表与详情、按归属用户查询（授权范围内）</li>
                            <li>维护：启用/禁用、改名、调整 Scope、更新归属信息</li>
                            <li>令牌：查询与撤销名下 Token</li>
                        </ul>
                    </div>

                    <div class="d-grid gap-2">
                        <a class="btn btn-secondary" href="/admin">返回</a>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>
<th:block th:replace="admin/fragments/layout :: scripts"></th:block>
</body>
</html>
