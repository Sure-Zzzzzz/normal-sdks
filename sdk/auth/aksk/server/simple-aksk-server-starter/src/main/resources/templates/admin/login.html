<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · AKSK Server</title>
    <link href="/admin/css/bootstrap.min.css" rel="stylesheet">
    <link href="/admin/css/console.css?v=3.0.0-responsive-3" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/admin/img/aksk-icon.svg">
</head>
<body>
<main class="admin-login">
    <section class="admin-login-brand">
        <img src="/admin/img/aksk-logo.svg" alt="AKSK Server">
        <h1>AKSK Server</h1>
        <p>统一管理 Client、应用授权与 Token 生命周期。此入口仅面向内网管理员。</p>
    </section>
    <section class="admin-login-panel">
        <div class="admin-login-card">
            <h2>管理员登录</h2>
            <p>使用管理员账号进入 AKSK 管理控制台。</p>
            <div class="alert alert-danger" th:if="${param.error}">用户名或密码错误</div>
            <div class="alert alert-success" th:if="${param.logout}">您已成功登出</div>
            <form th:action="@{/admin/login}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="mb-3">
                    <label for="username" class="form-label">用户名</label>
                    <input type="text" class="form-control" id="username" name="username" required autofocus>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">密码</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">登录</button>
                </div>
            </form>
        </div>
    </section>
</main>
<script src="/admin/js/bootstrap.bundle.min.js"></script>
</body>
</html>
