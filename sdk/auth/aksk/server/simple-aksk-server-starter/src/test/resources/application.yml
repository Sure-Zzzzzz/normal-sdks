spring:
  profiles:
    active: local
  # MySQL 连接已由 simple-mysql-route-starter 接管（@Primary routing DataSource 先于
  # DataSourceAutoConfiguration 装配，Boot 数据源自动配置让位）——连接契约在下方 mysql.route 配置
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
  # Redis 连接已由 simple-redis-route-starter 接管（smart-cache 2.x L2/PubSub 与
  # smart-redis-limiter 2.0.0 均走 RedisRouteTemplate），连接契约在下方 redis.route 配置
io:
  github:
    surezzzzzz:
      sdk:
        mysql:
          route:
            enable: true
            primary-datasource: default
            datasources:
              default:
                url: jdbc:mysql://localhost:3306/sure_auth_aksk?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
                username: root
                password: # 请在 application-local.yml 中配置真实密码
                driver-class-name: com.mysql.cj.jdbc.Driver
                hikari:
                  maximum-pool-size: 8
                  minimum-idle: 2
                  connection-timeout: 3000
                  validation-timeout: 3000
        redis:
          route:
            enable: true
            sources:
              default:
                host: localhost
                port: 6379
                database: 1
                timeout-ms: 3000
                pool:
                  enabled: true
                  max-active: 8
                  max-idle: 8
                  min-idle: 2
        # lock 1.2.2 起模板让位：容器存在 route 接管的标准 stringRedisTemplate 时不再自建
        # simpleRedisLockRedisTemplate，无需显式 lock.redis.route 开关
        auth:
          aksk:
            server:
              jwt:
                key-id: test-key-2026
                public-key: classpath:keys/public.pem
                private-key: classpath:keys/private.pem
                expires-in: 3600
              redis:
                token:
                  me: "test-app"
              admin:
                enabled: true
                username: admin
                password: # 请在 application-local.yml 中配置真实密码
              limiter:
                oauth2:
                  token:
                    limits:
                      - count: 1000000
                        window: 1
                        unit: MINUTES
                  introspect:
                    limits:
                      - count: 1000000
                        window: 1
                        unit: MINUTES
                  revoke:
                    limits:
                      - count: 1000000
                        window: 1
                        unit: MINUTES
        limiter:
          redis:
            smart:
              enable: true
              me: ${io.github.surezzzzzz.sdk.auth.aksk.server.redis.token.me:test-app}
              mode: annotation
        cache:
          key-prefix: sure-auth-aksk
          me: ${io.github.surezzzzzz.sdk.auth.aksk.server.redis.token.me:test-app}
          l1:
            enabled: true
            expire-seconds: 10
            max-size: 10000
          l2:
            enabled: true
            expire-seconds: ${io.github.surezzzzzz.sdk.auth.aksk.server.jwt.expires-in:3600}
            key-format: "{keyPrefix}:{me}:{cacheName}::{key}"
          consistency:
            mode: strong
logging:
  level:
    io.github.surezzzzzz.sdk.auth.aksk.server: DEBUG
    org.springframework.security: DEBUG
    io.github.surezzzzzz.sdk.cache.pubsub.CacheInvalidationListener: TRACE
