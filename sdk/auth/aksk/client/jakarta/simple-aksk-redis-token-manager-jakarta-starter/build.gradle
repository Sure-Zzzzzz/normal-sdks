dependencies {
    api 'io.github.sure-zzzzzz:simple-aksk-client-core-jakarta:1.0.0'

    implementation 'io.github.sure-zzzzzz:smart-cache-jakarta-starter:1.0.0'
    implementation 'io.github.sure-zzzzzz:simple-redis-lock-jakarta-starter:1.0.0'
    implementation 'io.github.sure-zzzzzz:task-retry-jakarta-starter:1.0.0'

    compileOnly 'org.springframework.boot:spring-boot-configuration-processor'
    compileOnly 'org.springframework.boot:spring-boot-autoconfigure'
    compileOnly 'org.springframework.boot:spring-boot-starter-data-redis'
    compileOnly 'org.springframework:spring-web'

    testImplementation 'io.github.sure-zzzzzz:simple-redis-route-jakarta-starter:1.0.0'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework.boot:spring-boot-starter-log4j2'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-redis'
    testImplementation 'org.springframework.boot:spring-boot-starter-aop'
    testImplementation 'com.github.ben-manes.caffeine:caffeine'
    testRuntimeOnly 'org.apache.commons:commons-pool2'
}
