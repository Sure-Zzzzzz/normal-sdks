dependencies {
    // simple-aksk-redis-token-manager 提供 TokenManager Bean；本模块 main 源码仅 import
    // client-core 的 TokenManager 接口（经其 api 传递编译期可见），无 token-manager 特有类型，
    // 按自闭环原则收 implementation：使用方直接使用 TokenManager API 需自行引入
    implementation 'io.github.sure-zzzzzz:simple-aksk-redis-token-manager:3.0.1'

    // Spring Boot Web（compileOnly，用户自行引入）
    compileOnly 'org.springframework.boot:spring-boot-starter-web'

    // Apache HttpClient（compileOnly，用户自行引入）
    compileOnly 'org.apache.httpcomponents:httpclient'

    // Spring Boot
    compileOnly 'org.springframework.boot:spring-boot-configuration-processor'
    compileOnly "org.springframework.boot:spring-boot-autoconfigure"
    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'

    // 测试依赖
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-redis'
    testImplementation 'org.apache.httpcomponents:httpclient:4.5.13'
    testImplementation 'org.springframework.boot:spring-boot-starter-log4j2'
    testImplementation 'org.springframework.boot:spring-boot-starter-aop'
    testImplementation 'com.github.ben-manes.caffeine:caffeine:2.9.3'

}
