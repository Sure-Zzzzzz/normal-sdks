// IAM 协作适配器只实现中性 owner-authorization SPI。
// 它不是 simple-aksk-server-starter 的传递依赖，由部署 AKSK 的业务应用按需引入。

dependencies {
    // 两个依赖均已发版且工作树零改动（owner core 1.0.0 / server core 3.0.4），按规矩用正式坐标
    api 'io.github.sure-zzzzzz:simple-owner-authorization-collaboration-core:1.0.0'
    api 'io.github.sure-zzzzzz:simple-aksk-server-core:3.0.4'

    compileOnly 'org.springframework.boot:spring-boot-starter-web'
    compileOnly 'org.springframework.boot:spring-boot-autoconfigure'
    compileOnly 'org.springframework.boot:spring-boot-configuration-processor'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}
