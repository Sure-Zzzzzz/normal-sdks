dependencies {
    implementation 'io.github.sure-zzzzzz:simple-iam-core:1.0.0'
    implementation 'io.github.sure-zzzzzz:simple-captcha-starter:1.0.0'

    compileOnly 'org.springframework.boot:spring-boot-autoconfigure'
    compileOnly 'org.springframework.boot:spring-boot-configuration-processor'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-redis'
    testImplementation 'org.apache.commons:commons-pool2'
    // 验证用例经 route 门面读回挑战答案（route 对 captcha 是 implementation 不传编译口径，测试自带）
    testImplementation 'io.github.sure-zzzzzz:simple-redis-route-starter:1.2.2'
}
