openapi: 3.0.3
info:
  title: Simple IAM Open API
  version: 1.3.8
  description: >-
    IAM 对外开放 API（`/iam/api/**`），供外部系统持 AKSK 凭证（平台级 AKP
    或用户级 AKU）调用，做组织与人员同步及受委托角色治理。浏览器、Portal、Admin 和普通
    OAuth Client 不得调用。

    ## 鉴权与权限

    每个请求携带 `Authorization: Bearer <AKSK token>`（client_credentials 换发）。
    IAM 侧由公共资源层链验证（introspect 回源 AKSK Server 取授权快照），端点执行
    码 + DATA 双闸：先精确 API 码，再数据范围评估；任一不过返回 403。

    ## 接入检查清单（六步，两侧各管一半）

    配置点分布在 AKSK Server 管理侧（准入与三权）和 IAM 宿主侧（接管与回源），
    逐项核对后再开始联调：

    | # | 配置点 | 归属侧 | 做什么 | 漏配症状 |
    |---|---|---|---|---|
    | 1 | 创建 AKSK 客户端 | AKSK | 平台级 AKP 或用户级 AKU，凭据为 AccessKey / Secret | 换不出 token |
    | 2 | 应用授权 admitted | AKSK | applicationCode=iam 的授权 admitted=true | 换不出 token |
    | 3 | API 码 | AKSK | 同一授权勾 `iam:user:api`、`iam:department:api`（按需） | 403（未勾的族整族拒绝） |
    | 4 | DATA grants | AKSK | 同一授权勾 `iam:user` 资源：`all=true` 全量或 `departmentId IN [...]` 受限 | 403（有码无范围，失败关闭） |
    | 5 | protected-paths | IAM 宿主 | 资源层安全配置（protected-paths）覆盖 `/iam/api/**` | 403（请求落会话链被拒） |
    | 6 | introspect 回源 | IAM 宿主 | 资源层 introspect 指向 AKSK Server 验证端点并配客户端凭据 | 401 |

    凭据换 token：AccessKey / Secret 在 AKSK Server 的 token 端点以
    client_credentials 换发，后续请求携带 `Authorization: Bearer <token>`。

    上表第三、四步的旧权限只用于组织与人员同步，不包含受委托角色治理权。
    治理端点另要求可信 AKSK SERVICE、IAM 准入、八个精确 API 码及五个 DATA 资源，
    按需逐项批准；IAM 宿主关闭 introspect 本地缓存及旧结果回退。
    `iam:user:api` 包含普通用户角色关系管理，但不能绕过受委托角色禁止个人直授的约束；
    只需同步无需绑角色的场景，用 DATA 写动作收窄。

    可信应用目录（1.3.7）：`GET /iam/api/applications` 要求勾 `iam:application:api` API 码与
    `iam:application` DATA 资源 read all=true（全局目录无部门归属，IN 范围不适用）——限流目录
    adaptor 等外部同步方按此最小组合授权。

    Portal 可信应用路由投影（1.3.8）：`GET /iam/api/portal/applications` 要求
    已验证的 AKP `SERVICE` 主体、`iam:portal-application:read:api` API 码与
    `iam:portal-application` DATA 资源 read；`HUMAN` 主体即使拥有同名 API/DATA 也返回 403。
    目录按全局 `catalogRevision` 做一致性快照，Gateway 必须校验所有分页使用同一 revision。
    该端点只返回启用 Portal 且可信应用状态为启用的路由投影，不返回凭据、Token 或 Cookie 值。

    页面准入查询（1.3.5）单列最小授权：`GET /iam/api/users/{subjectId}/page-admitted-applications`
    只要求勾 `iam:portal:api` 单码，无 DATA 面（返回为应用码聚合，非用户档案）——供反馈服务
    等按主体拉取交集过滤清单，勿为此授 `iam:user:api`。

    ## DATA 执行语义（用户族，resource=iam:user）

    - 读列表：授权部门范围与请求过滤条件求交，越权数据不出库；
    - 读详情 / 全部写操作：目标用户（或建用户的目标部门）须完整落在授权范围内，
      越界 403；
    - 有 API 码但无 DATA 授权（或计划不可执行）一律 403（失败关闭）；
    - 部门族第一版纯码控，不评估 DATA。

    ## 受委托角色（1.3.2）

    新角色接口只接收可信 AKSK SERVICE 身份，检查 IAM 准入及独立 API/DATA，
    不依赖角色编码前缀或客户端提交 owner。创建后应用、根和主体不可更换。
    规则写是批准范围内的治理权，不是调用方自己运行权限的子集。
    PUT/DELETE 使用强 If-Match，例如
    `"open-role:20000000-0000-4000-8000-000000000001:2"`；
    缺失 428、版本过旧 412，拒绝通配符、弱标记和标记列表。
    清理角色贡献不保证关闭用户 admitted，商业有效性仍由消费方实时判断。
    角色归属、revision、目录及成员资格不使用缓存；新 JSON 请求体最大 1 MiB。
    完整目录包含根，最多 4096 节点、64 层；子树节点或深度超限、关系及成员读取的
    祖先链深度超限返回 422，不返回截断成功。环、根的悬空父链等结构冲突返回 409。
    所有端点不支持的方法返回 405，不支持的媒体类型返回 415。
    清库或恢复环境后，消费方暂停自动联动，重新核对主体、应用、根及三权。
servers:
  - url: /
security:
  - akskBearer: []
paths:
  /iam/api/users:
    get:
      summary: 分页查询用户
      operationId: listUsers
      description: DATA 部门范围与请求条件求交；授权范围内无可见部门时返回空页。
      parameters:
        - {name: status, in: query, schema: {type: integer}, description: "状态过滤（1=启用）"}
        - {name: departmentId, in: query, schema: {type: integer, format: int64}, description: 部门过滤（与 DATA 范围求交）}
        - {name: keyword, in: query, schema: {type: string}, description: "用户名 / 显示名 / 邮箱模糊匹配"}
        - {name: page, in: query, schema: {type: integer, default: 1}, description: 页码（从 1 起）}
        - {name: size, in: query, schema: {type: integer, default: 20}, description: 每页大小}
      responses:
        '200':
          description: 用户分页。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      summary: 创建用户
      operationId: createUser
      description: 目标部门须在 DATA 授权范围内（未配部门=越界 403）。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateUserRequest'}
      responses:
        '201':
          description: 已创建。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserRestResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /iam/api/users/{subjectId}:
    parameters:
      - {name: subjectId, in: path, required: true, schema: {type: string, maxLength: 64}, description: 公开主体 ID}
    get:
      summary: 用户详情
      operationId: getUser
      responses:
        '200':
          description: 用户详情（含角色编码列表）。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserRestResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      summary: 更新用户
      operationId: updateUser
      description: 现有部门与变更后部门均须在 DATA 授权范围内。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateUserRequest'}
      responses:
        '200':
          description: 已更新。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserRestResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      summary: 删除用户
      operationId: deleteUser
      description: 物理删除，级联清理角色绑定、组成员与应用授权投影；最后管理员保护 409。
      responses:
        '204': {description: 已删除。}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /iam/api/users/{subjectId}/page-admitted-applications:
    parameters:
      - {name: subjectId, in: path, required: true, schema: {type: string, maxLength: 64}, description: 公开主体 ID}
    get:
      summary: 页面准入应用编码清单
      operationId: listPageAdmittedApplications
      description: 返回该用户有页面准入（PAGE 投影非空）的启用应用编码；准入门放行（授权行 admitted 有效，
        或平台管理员对内置应用特权直通）∧ 投影非空 ∧ 应用启用。不含 Portal 集成启用维度——未挂门户壳
        但已注册且有页面准入的应用同样在列（与门户侧边栏口径的差异见 server DESIGN.1.3.5 §10.1）。
        仅供服务间按 subjectId 拉取（如反馈服务 hint 交集过滤）；无 DATA 面，清单顺序未定义。
      responses:
        '200':
          description: 应用编码裸数组。
          content:
            application/json:
              schema: {type: array, items: {type: string}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /iam/api/users/{subjectId}/page-admitted-application-details:
    parameters:
      - {name: subjectId, in: path, required: true, schema: {type: string, maxLength: 64}, description: 公开主体 ID}
    get:
      summary: 页面准入应用详情列表
      operationId: listPageAdmittedApplicationDetails
      description: 与裸数组端点（page-admitted-applications）同判定同口径（共用唯一实现），差异仅携带
        displayName / description（应用注册申报的公开元数据，与门户侧边栏同源）。同码 iam:portal:api、
        无 DATA 面；列表顺序未定义。1.3.7 起。
      responses:
        '200':
          description: 应用详情数组。
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/PageAdmittedApplicationDetail'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /iam/api/users/{subjectId}/roles:
    parameters:
      - {name: subjectId, in: path, required: true, schema: {type: string, maxLength: 64}, description: 公开主体 ID}
    get:
      summary: 用户角色列表
      operationId: getUserRoles
      responses:
        '200':
          description: 角色编码列表。
          content:
            application/json:
              schema: {type: array, items: {type: string}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /iam/api/users/{subjectId}/enable:
    parameters:
      - {name: subjectId, in: path, required: true, schema: {type: string, maxLength: 64}, description: 公开主体 ID}
    put:
      summary: 启用用户
      operationId: enableUser
      responses:
        '200': {description: 已启用。}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /iam/api/users/{subjectId}/disable:
    parameters:
      - {name: subjectId, in: path, required: true, schema: {type: string, maxLength: 64}, description: 公开主体 ID}
    put:
      summary: 禁用用户
      operationId: disableUser
      description: 禁用即全端吊销会话。
      responses:
        '200': {description: 已禁用。}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /iam/api/users/{subjectId}/reset-password:
    parameters:
      - {name: subjectId, in: path, required: true, schema: {type: string, maxLength: 64}, description: 公开主体 ID}
    put:
      summary: 重置用户密码
      operationId: resetUserPassword
      description: 重置即全端吊销；审计 operator 记AKSK 主体标识。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResetPasswordRequest'}
      responses:
        '200': {description: 已重置。}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /iam/api/users/{subjectId}/roles/{roleId}:
    parameters:
      - {name: subjectId, in: path, required: true, schema: {type: string, maxLength: 64}, description: 公开主体 ID}
      - {name: roleId, in: path, required: true, schema: {type: integer, format: int64}}
    post:
      summary: 绑定角色
      operationId: assignUserRole
      responses:
        '200': {description: 已绑定。}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      summary: 解绑角色
      operationId: revokeUserRole
      responses:
        '204': {description: 已解绑。}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /iam/api/messages:
    post:
      summary: 发送站内信
      operationId: sendMessage
      description: 外部系统给 IAM 用户发通知（1.3.7 起）；收件人形态与管理台同构。码 iam:message:api，无 DATA 面。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MessageSendRequest'}
      responses:
        '201':
          description: 已发送。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageSendResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    get:
      summary: 按收件人查信
      operationId: listMessagesBySubject
      description: subjectId 必填（防全库遍历）；页码 1 起（1.3.7 起）。
      parameters:
        - {name: subjectId, in: query, required: true, schema: {type: string}}
        - {name: page, in: query, schema: {type: integer, default: 1}}
        - {name: size, in: query, schema: {type: integer, default: 20}}
      responses:
        '200':
          description: 信件数组。
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/OpenApiMessage'}}
        '404': {$ref: '#/components/responses/NotFound'}
  /iam/api/messages/{sendBatchId}:
    parameters:
      - {name: sendBatchId, in: path, required: true, schema: {type: string}}
    get:
      summary: 发送批次详情
      operationId: getMessageBatch
      description: 对账（1.3.7 起）。
      responses:
        '200':
          description: 批次详情。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageBatch'}
        '404': {$ref: '#/components/responses/NotFound'}
  /iam/api/sessions:
    get:
      summary: 按用户列在线会话
      operationId: listSessionsBySubject
      description: 风控审计视角（1.3.7 起）；subjectId 必填；码 iam:session:api，无 DATA 面。
      parameters:
        - {name: subjectId, in: query, required: true, schema: {type: string}}
        - {name: page, in: query, schema: {type: integer, default: 1}}
        - {name: size, in: query, schema: {type: integer, default: 20}}
      responses:
        '200':
          description: 会话数组。
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/OpenApiSession'}}
        '404': {$ref: '#/components/responses/NotFound'}
  /iam/api/sessions/{sessionId}:
    parameters:
      - {name: sessionId, in: path, required: true, schema: {type: string}}
    delete:
      summary: 踢指定会话
      operationId: revokeSession
      description: 风控强制下线（1.3.7 起）。
      responses:
        '204': {description: 已踢除。}
        '404': {$ref: '#/components/responses/NotFound'}
  /iam/api/permissions:
    get:
      summary: 分页列权限（只读目录）
      operationId: listPermissions
      description: 对账/下拉（1.3.7 起）；码 iam:permission:api，无 DATA 面；页码 1 起。
      parameters:
        - {name: keyword, in: query, schema: {type: string}}
        - {name: page, in: query, schema: {type: integer, default: 1}}
        - {name: size, in: query, schema: {type: integer, default: 20}}
      responses:
        '200':
          description: 权限数组。
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/OpenApiPermission'}}
  /iam/api/role-catalog:
    get:
      summary: 分页列角色（只读目录）
      operationId: listRoleCatalog
      description: 内置+自定义全量（1.3.7 起）；/iam/api/roles 为受委托角色族在册路径，普通角色以 role-catalog 区隔；写管理保留管理台。码 iam:role:api，无 DATA 面。
      parameters:
        - {name: keyword, in: query, schema: {type: string}}
        - {name: page, in: query, schema: {type: integer, default: 1}}
        - {name: size, in: query, schema: {type: integer, default: 20}}
      responses:
        '200':
          description: 角色数组。
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/OpenApiRoleEntry'}}
  /iam/api/statistics:
    get:
      summary: 统计聚合（只读）
      operationId: getStatistics
      description: 外部监控/大屏（1.3.7 起）；与管理台同源；登录明细不开放。码 iam:dashboard:api，无 DATA 面。
      responses:
        '200':
          description: 统计快照。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpenApiStatistics'}
  /iam/api/user-groups:
    get:
      summary: 分页列协作组
      operationId: listUserGroups
      description: 组织同步（1.3.7 起）；码 iam:user-group:api，无 DATA 面；页码 1 起。
      parameters:
        - {name: status, in: query, schema: {type: integer}}
        - {name: keyword, in: query, schema: {type: string}}
        - {name: page, in: query, schema: {type: integer, default: 1}}
        - {name: size, in: query, schema: {type: integer, default: 20}}
      responses:
        '200':
          description: 协作组数组。
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/OpenApiUserGroup'}}
    post:
      summary: 建协作组
      operationId: createUserGroup
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserGroupCreateRequest'}
      responses:
        '201':
          description: 已创建。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpenApiUserGroup'}
        '409': {$ref: '#/components/responses/Conflict'}
  /iam/api/user-groups/{groupId}:
    parameters:
      - {name: groupId, in: path, required: true, schema: {type: integer, format: int64}}
    get:
      summary: 协作组详情
      operationId: getUserGroup
      responses:
        '200':
          description: 协作组。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpenApiUserGroup'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      summary: 改协作组
      operationId: updateUserGroup
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserGroupUpdateRequest'}
      responses:
        '200':
          description: 已更新。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpenApiUserGroup'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      summary: 删协作组
      operationId: deleteUserGroup
      responses:
        '204': {description: 已删除。}
        '404': {$ref: '#/components/responses/NotFound'}
  /iam/api/user-groups/{groupId}/users:
    parameters:
      - {name: groupId, in: path, required: true, schema: {type: integer, format: int64}}
    get:
      summary: 组成员分页
      operationId: listUserGroupUsers
      parameters:
        - {name: page, in: query, schema: {type: integer, default: 1}}
        - {name: size, in: query, schema: {type: integer, default: 20}}
      responses:
        '200':
          description: 成员数组。
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/OpenApiGroupUser'}}
        '404': {$ref: '#/components/responses/NotFound'}
  /iam/api/user-groups/{groupId}/users/{subjectId}:
    parameters:
      - {name: groupId, in: path, required: true, schema: {type: integer, format: int64}}
