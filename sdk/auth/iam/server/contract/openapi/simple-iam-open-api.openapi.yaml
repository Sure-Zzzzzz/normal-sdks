    get:
      summary: 读取指定成员最小组织事实
      operationId: getOpenOrganizationMember
      description: '要求可信 AKSK SERVICE 主体、IAM 准入、iam:open-directory:read:api 及 iam:open-directory/read 完整 DATA；all=true 不绕过角色归属或固定范围。'
