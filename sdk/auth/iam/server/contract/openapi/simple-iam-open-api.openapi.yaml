openapi: 3.0.3
info:
  title: Simple IAM Open API
  version: 1.3.2
  description: >-
    IAM 对外开放 API（`/iam/api/**`），供外部系统持 AKSK 凭证（平台级 AKP
    或用户级 AKU）调用，做组织与人员同步及受委托角色治理。浏览器、Portal、Admin 和普通
    OAuth Client 不得调用。

    ## 鉴权与权限

    每个请求携带 `Authorization: Bearer <AKSK token>`（client_credentials 换发）。
    IAM 侧由公共资源层链验证（introspect 回源 AKSK Server 取授权快照），端点执行
    码 + DATA 双闸：先精确 API 码，再数据范围评估；任一不过返回 403。

    ## 接入检查清单（六步，两侧各管一半）

    配置点分布在 AKSK Server 管理侧（准入与三权）和 IAM 宿主侧（接管与回源），
    逐项核对后再开始联调：

    | # | 配置点 | 归属侧 | 做什么 | 漏配症状 |
    |---|---|---|---|---|
    | 1 | 创建 AKSK 客户端 | AKSK | 平台级 AKP 或用户级 AKU，凭据为 AccessKey / Secret | 换不出 token |
    | 2 | 应用授权 admitted | AKSK | applicationCode=iam 的授权 admitted=true | 换不出 token |
    | 3 | API 码 | AKSK | 同一授权勾 `iam:user:api`、`iam:department:api`（按需） | 403（未勾的族整族拒绝） |
    | 4 | DATA grants | AKSK | 同一授权勾 `iam:user` 资源：`all=true` 全量或 `departmentId IN [...]` 受限 | 403（有码无范围，失败关闭） |
    | 5 | protected-paths | IAM 宿主 | 资源层安全配置（protected-paths）覆盖 `/iam/api/**` | 403（请求落会话链被拒） |
    | 6 | introspect 回源 | IAM 宿主 | 资源层 introspect 指向 AKSK Server 验证端点并配客户端凭据 | 401 |

    凭据换 token：AccessKey / Secret 在 AKSK Server 的 token 端点以
    client_credentials 换发，后续请求携带 `Authorization: Bearer <token>`。

    上表第三、四步的旧权限只用于组织与人员同步，不包含受委托角色治理权。
    治理端点另要求可信 AKSK SERVICE、IAM 准入、八个精确 API 码及五个 DATA 资源，
    按需逐项批准；IAM 宿主关闭 introspect 本地缓存及旧结果回退。
    `iam:user:api` 包含普通用户角色关系管理，但不能绕过受委托角色禁止个人直授的约束；
    只需同步无需绑角色的场景，用 DATA 写动作收窄。

    ## DATA 执行语义（用户族，resource=iam:user）

    - 读列表：授权部门范围与请求过滤条件求交，越权数据不出库；
    - 读详情 / 全部写操作：目标用户（或建用户的目标部门）须完整落在授权范围内，
      越界 403；
    - 有 API 码但无 DATA 授权（或计划不可执行）一律 403（失败关闭）；
    - 部门族第一版纯码控，不评估 DATA。

    ## 受委托角色（1.3.2）

    新角色接口只接收可信 AKSK SERVICE 身份，检查 IAM 准入及独立 API/DATA，
    不依赖角色编码前缀或客户端提交 owner。创建后应用、根和主体不可更换。
    规则写是批准范围内的治理权，不是调用方自己运行权限的子集。
    PUT/DELETE 使用强 If-Match，例如
    `"open-role:20000000-0000-4000-8000-000000000001:2"`；
    缺失 428、版本过旧 412，拒绝通配符、弱标记和标记列表。
    清理角色贡献不保证关闭用户 admitted，商业有效性仍由消费方实时判断。
    角色归属、revision、目录及成员资格不使用缓存；新 JSON 请求体最大 1 MiB。
    完整目录包含根，最多 4096 节点、64 层；子树节点或深度超限、关系及成员读取的
    祖先链深度超限返回 422，不返回截断成功。环、根的悬空父链等结构冲突返回 409。
    所有端点不支持的方法返回 405，不支持的媒体类型返回 415。
    清库或恢复环境后，消费方暂停自动联动，重新核对主体、应用、根及三权。
servers:
  - url: /
security:
  - akskBearer: []
paths:
  /iam/api/users:
    get:
      summary: 分页查询用户
      operationId: listUsers
      description: DATA 部门范围与请求条件求交；授权范围内无可见部门时返回空页。
      parameters:
        - {name: status, in: query, schema: {type: integer}, description: "状态过滤（1=启用）"}
        - {name: departmentId, in: query, schema: {type: integer, format: int64}, description: 部门过滤（与 DATA 范围求交）}
        - {name: keyword, in: query, schema: {type: string}, description: "用户名 / 显示名 / 邮箱模糊匹配"}
        - {name: page, in: query, schema: {type: integer, default: 1}, description: 页码（从 1 起）}
        - {name: size, in: query, schema: {type: integer, default: 20}, description: 每页大小}
      responses:
        '200':
          description: 用户分页。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      summary: 创建用户
      operationId: createUser
      description: 目标部门须在 DATA 授权范围内（未配部门=越界 403）。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateUserRequest'}
      responses:
        '201':
          description: 已创建。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserRestResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /iam/api/users/{subjectId}:
    parameters:
      - {name: subjectId, in: path, required: true, schema: {type: string, maxLength: 64}, description: 公开主体 ID}
    get:
      summary: 用户详情
      operationId: getUser
      responses:
        '200':
          description: 用户详情（含角色编码列表）。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserRestResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      summary: 更新用户
      operationId: updateUser
      description: 现有部门与变更后部门均须在 DATA 授权范围内。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateUserRequest'}
      responses:
        '200':
          description: 已更新。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserRestResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      summary: 删除用户
      operationId: deleteUser
      description: 物理删除，级联清理角色绑定、组成员与应用授权投影；最后管理员保护 409。
      responses:
        '204': {description: 已删除。}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /iam/api/users/{subjectId}/roles:
    parameters:
      - {name: subjectId, in: path, required: true, schema: {type: string, maxLength: 64}, description: 公开主体 ID}
    get:
      summary: 用户角色列表
      operationId: getUserRoles
      responses:
        '200':
          description: 角色编码列表。
          content:
            application/json:
              schema: {type: array, items: {type: string}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /iam/api/users/{subjectId}/enable:
    parameters:
      - {name: subjectId, in: path, required: true, schema: {type: string, maxLength: 64}, description: 公开主体 ID}
    put:
      summary: 启用用户
      operationId: enableUser
      responses:
        '200': {description: 已启用。}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /iam/api/users/{subjectId}/disable:
    parameters:
      - {name: subjectId, in: path, required: true, schema: {type: string, maxLength: 64}, description: 公开主体 ID}
    put:
      summary: 禁用用户
      operationId: disableUser
      description: 禁用即全端吊销会话。
      responses:
        '200': {description: 已禁用。}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /iam/api/users/{subjectId}/reset-password:
    parameters:
      - {name: subjectId, in: path, required: true, schema: {type: string, maxLength: 64}, description: 公开主体 ID}
    put:
      summary: 重置用户密码
      operationId: resetUserPassword
      description: 重置即全端吊销；审计 operator 记AKSK 主体标识。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResetPasswordRequest'}
      responses:
        '200': {description: 已重置。}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /iam/api/users/{subjectId}/roles/{roleId}:
    parameters:
      - {name: subjectId, in: path, required: true, schema: {type: string, maxLength: 64}, description: 公开主体 ID}
      - {name: roleId, in: path, required: true, schema: {type: integer, format: int64}}
    post:
      summary: 绑定角色
      operationId: assignUserRole
      responses:
        '200': {description: 已绑定。}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      summary: 解绑角色
      operationId: revokeUserRole
      responses:
        '204': {description: 已解绑。}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /iam/api/departments:
    get:
      summary: 全量部门平铺列表
      operationId: listDepartments
      description: 含 fullPath（如 /root/研发/后端），外部按 parentId / fullPath 自行重建树；纯码控不评估 DATA。
      responses:
        '200':
          description: 部门平铺列表。
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/DepartmentRestResponse'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      summary: 创建部门
      operationId: createDepartment
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateDepartmentRequest'}
      responses:
        '201':
          description: 已创建。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DepartmentRestResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /iam/api/departments/{departmentId}:
    parameters:
      - {name: departmentId, in: path, required: true, schema: {type: integer, format: int64}}
    get:
      summary: 部门详情
      operationId: getDepartment
      responses:
        '200':
          description: 部门详情。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DepartmentRestResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      summary: 更新部门
      operationId: updateDepartment
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateDepartmentRequest'}
      responses:
        '200':
          description: 已更新。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DepartmentRestResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      summary: 删除部门
      operationId: deleteDepartment
      description: 走既有级联规则（存在子部门 / 成员时按管理面同一约束拒绝）。
      responses:
        '204': {description: 已删除。}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /iam/api/roles:
    post:
      summary: 创建受委托角色
      operationId: createOpenRole
      description: '要求可信 AKSK SERVICE 主体、IAM 准入、iam:open-role:create:api 及 iam:open-role/create 完整 DATA；all=true 不绕过角色归属或固定范围。'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateOpenRoleRequest'}
      responses:
        '201':
          description: 首次创建；同幂等键同摘要回读为 200。
          headers:
            ETag: {description: '同事务强角色版本标记', schema: {type: string}}
            Location: {description: 新角色资源地址, schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpenRoleResponse'}
        '200':
          description: 同主体同创建摘要的当前角色回读，不重置规则或版本。
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpenRoleResponse'}
        '400': {$ref: '#/components/responses/OpenRole400'}
        '401': {$ref: '#/components/responses/OpenRole401'}
        '403': {$ref: '#/components/responses/OpenRole403'}
        '404': {$ref: '#/components/responses/OpenRole404'}
        '409': {$ref: '#/components/responses/OpenRole409'}
        '503': {$ref: '#/components/responses/OpenRole503'}
        '413': {$ref: '#/components/responses/OpenRole413'}
        '415': {$ref: '#/components/responses/OpenRole415'}
    get:
      summary: 查询自己的受委托角色
      operationId: listOpenRoles
      description: '要求可信 AKSK SERVICE 主体、IAM 准入、iam:open-role:read:api 及 iam:open-role/read 完整 DATA；all=true 不绕过角色归属或固定范围。'
      parameters:
        - {name: applicationId, in: query, schema: {type: integer, format: int64, minimum: 1}}
        - {name: rootDepartmentId, in: query, schema: {type: integer, format: int64, minimum: 1}}
        - {name: externalId, in: query, schema: {type: string, format: uuid}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpenRolePage'}
        '400': {$ref: '#/components/responses/OpenRole400'}
        '401': {$ref: '#/components/responses/OpenRole401'}
        '403': {$ref: '#/components/responses/OpenRole403'}
        '404': {$ref: '#/components/responses/OpenRole404'}
        '409': {$ref: '#/components/responses/OpenRole409'}
        '503': {$ref: '#/components/responses/OpenRole503'}
  /iam/api/roles/{openRoleId}:
    parameters:
      - {name: openRoleId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      summary: 读取角色及同版本标记
      operationId: getOpenRole
      description: '要求可信 AKSK SERVICE 主体、IAM 准入、iam:open-role:read:api 及 iam:open-role/read 完整 DATA；all=true 不绕过角色归属或固定范围。'
      responses:
        '200':
          description: 成功。
          headers:
            ETag: {description: '同事务强角色版本标记', schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpenRoleResponse'}
        '400': {$ref: '#/components/responses/OpenRole400'}
        '401': {$ref: '#/components/responses/OpenRole401'}
        '403': {$ref: '#/components/responses/OpenRole403'}
        '404': {$ref: '#/components/responses/OpenRole404'}
        '409': {$ref: '#/components/responses/OpenRole409'}
        '503': {$ref: '#/components/responses/OpenRole503'}
  /iam/api/roles/{openRoleId}/authorization-rules/{applicationId}:
    parameters:
      - {name: openRoleId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: applicationId, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    get:
      summary: 读取固定应用规则
      operationId: getOpenRoleRule
      description: '要求可信 AKSK SERVICE 主体、IAM 准入、iam:open-role-rule:read:api 及 iam:open-role-rule/read 完整 DATA；all=true 不绕过角色归属或固定范围。'
      responses:
        '200':
          description: 成功。
          headers:
            ETag: {description: '同事务强角色版本标记', schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpenRoleRuleResponse'}
        '400': {$ref: '#/components/responses/OpenRole400'}
        '401': {$ref: '#/components/responses/OpenRole401'}
        '403': {$ref: '#/components/responses/OpenRole403'}
        '404': {$ref: '#/components/responses/OpenRole404'}
        '409': {$ref: '#/components/responses/OpenRole409'}
        '503': {$ref: '#/components/responses/OpenRole503'}
    put:
      summary: 条件整体替换固定应用规则
      operationId: putOpenRoleRule
      description: '要求可信 AKSK SERVICE 主体、IAM 准入、iam:open-role-rule:write:api 及 iam:open-role-rule/write 完整 DATA；all=true 不绕过角色归属或固定范围。'
      parameters:
        - {$ref: '#/components/parameters/OpenRoleIfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PutOpenRoleRuleRequest'}
      responses:
        '200':
          description: 成功。
          headers:
            ETag: {description: '同事务强角色版本标记', schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpenRoleRuleResponse'}
        '400': {$ref: '#/components/responses/OpenRole400'}
        '401': {$ref: '#/components/responses/OpenRole401'}
        '403': {$ref: '#/components/responses/OpenRole403'}
        '404': {$ref: '#/components/responses/OpenRole404'}
        '409': {$ref: '#/components/responses/OpenRole409'}
        '503': {$ref: '#/components/responses/OpenRole503'}
        '412': {$ref: '#/components/responses/OpenRole412'}
        '428': {$ref: '#/components/responses/OpenRole428'}
        '413': {$ref: '#/components/responses/OpenRole413'}
        '415': {$ref: '#/components/responses/OpenRole415'}
    delete:
      summary: 条件清除规则
      operationId: deleteOpenRoleRule
      description: '要求可信 AKSK SERVICE 主体、IAM 准入、iam:open-role-rule:write:api 及 iam:open-role-rule/write 完整 DATA；all=true 不绕过角色归属或固定范围。'
      parameters:
        - {$ref: '#/components/parameters/OpenRoleIfMatch'}
      responses:
        '204':
          description: 已完成；无变化不递增版本。
          headers:
            ETag: {description: '同事务强角色版本标记', schema: {type: string}}
        '400': {$ref: '#/components/responses/OpenRole400'}
        '401': {$ref: '#/components/responses/OpenRole401'}
        '403': {$ref: '#/components/responses/OpenRole403'}
        '404': {$ref: '#/components/responses/OpenRole404'}
        '409': {$ref: '#/components/responses/OpenRole409'}
        '503': {$ref: '#/components/responses/OpenRole503'}
        '412': {$ref: '#/components/responses/OpenRole412'}
        '428': {$ref: '#/components/responses/OpenRole428'}
  /iam/api/roles/{openRoleId}/departments:
    parameters:
      - {name: openRoleId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      summary: 读取受授权部门关系
      operationId: listOpenRoleDepartments
      description: '要求可信 AKSK SERVICE 主体、IAM 准入、iam:open-department-role:read:api 及 iam:open-department-role/read 完整 DATA；all=true 不绕过角色归属或固定范围。组织归属及 DATA 可独立变化，本响应不提供 ETag，不按 If-None-Match 返回 304；每次返回当前完整分页与角色 revision，写入版本标记从角色详情读取。'
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: 成功。
          headers:
            Cache-Control: {description: '禁止存储关系查询结果。', schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpenDepartmentRolePage'}
        '400': {$ref: '#/components/responses/OpenRole400'}
        '401': {$ref: '#/components/responses/OpenRole401'}
        '403': {$ref: '#/components/responses/OpenRole403'}
        '404': {$ref: '#/components/responses/OpenRole404'}
