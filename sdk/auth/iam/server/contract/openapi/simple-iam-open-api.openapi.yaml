        '400': {$ref: '#/components/responses/OpenRole400'}
        '401': {$ref: '#/components/responses/OpenRole401'}
        '403': {$ref: '#/components/responses/OpenRole403'}
        '404': {$ref: '#/components/responses/OpenRole404'}
        '409': {$ref: '#/components/responses/OpenRole409'}
        '503': {$ref: '#/components/responses/OpenRole503'}
