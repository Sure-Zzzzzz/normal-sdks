      - {name: applicationId, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    get:
      summary: 读取批准应用清单
      operationId: getOpenTargetManifest
      description: '要求可信 AKSK SERVICE 主体、IAM 准入、iam:open-application:read:api 及 iam:open-application/read 完整 DATA；all=true 不绕过角色归属或固定范围。'
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpenTargetManifest'}
        '400': {$ref: '#/components/responses/OpenRole400'}
        '401': {$ref: '#/components/responses/OpenRole401'}
        '403': {$ref: '#/components/responses/OpenRole403'}
        '404': {$ref: '#/components/responses/OpenRole404'}
        '409': {$ref: '#/components/responses/OpenRole409'}
        '503': {$ref: '#/components/responses/OpenRole503'}
components:
  parameters:
    OpenRoleIfMatch:
      name: If-Match
      in: header
      required: true
      description: '同一角色当前强版本标记；必须先回读事实，不能取得新版本后盲重发旧内容。'
      schema: {type: string}
  securitySchemes:
    akskBearer:
      type: http
      scheme: bearer
      description: >-
        AKSK 客户端凭据（AccessKey / Secret）换发的 Access Token
        （client_credentials）。凭据不得写入日志、代码仓库或响应缓存。
  responses:
    OpenRole400:
      description: 请求格式、编号或版本标记语法非法。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/OpenRoleError'}
    OpenRole401:
      description: 缺少可信服务身份，或机器凭据无效。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/OpenRoleError'}
    OpenRole403:
      description: 准入、精确 API、DATA 或固定委托范围不足。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/OpenRoleError'}
    OpenRole404:
      description: 对象不存在或不属于当前主体；成员不在批准根内。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/OpenRoleError'}
    OpenRole409:
      description: 幂等摘要、状态、清单版本或结构冲突。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/OpenRoleError'}
    OpenRole412:
      description: 角色修改版本已变化，须重读并重新计算差异。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/OpenRoleError'}
    OpenRole413:
      description: JSON 请求体超过 1 MiB。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/OpenRoleError'}
    OpenRole415:
      description: 请求媒体类型不支持。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/OpenRoleError'}
    OpenRole422:
      description: 完整子树超过 4096 节点或 64 层预算，或关系 / 成员祖先链超过 64 层预算；不返回截断成功。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/OpenRoleError'}
    OpenRole428:
      description: 缺少必需 If-Match。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/OpenRoleError'}
    OpenRole503:
      description: 安全执行所需验证或数据库服务暂时不可用。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/OpenRoleError'}
    BadRequest:
      description: 请求体非法（参数校验失败）。
    Unauthorized:
      description: >-
        未携带或无效 Bearer 凭据、携带会话 Cookie（开放 API 链排斥）、introspect 拒绝。
        响应不区分拒绝原因。
    Forbidden:
      description: >-
        已认证但未勾 API 码，或 DATA 范围不足 / 计划不可执行（失败关闭）。
    NotFound:
      description: 目标资源不存在。
    Conflict:
      description: 唯一性冲突或受保护约束（如最后管理员保护、部门删除阻断）。
  schemas:
    OpenRoleError:
      type: object
      required: [message, timestamp, requestId]
      additionalProperties: false
      properties:
        message: {type: string}
        timestamp: {type: string, format: date-time}
        requestId: {type: string}
    CreateOpenRoleRequest:
      type: object
      description: 'applicationId/rootDepartmentId 只接受正数 JSON 整数，范围为 int64；小数、指数形式、字符串、布尔值、null 和溢出均返回 400，不做类型转换或截断。'
      required: [externalId, applicationId, rootDepartmentId, name]
      properties:
        externalId: {type: string, format: uuid}
        applicationId: {type: integer, format: int64, minimum: 1}
        rootDepartmentId: {type: integer, format: int64, minimum: 1}
        name: {type: string, minLength: 1, maxLength: 128}
        description: {type: string, maxLength: 255, nullable: true}
    OpenRoleResponse:
      type: object
      required: [openRoleId, externalId, applicationId, rootDepartmentId, revision, state]
      description: DELETED 只返回上述六个字段，不读取已删除角色编号。
      properties:
        openRoleId: {type: string, format: uuid}
        externalId: {type: string, format: uuid}
        applicationId: {type: integer, format: int64}
        rootDepartmentId: {type: integer, format: int64}
        revision: {type: integer, format: int64, minimum: 1}
        state: {type: string, enum: [ACTIVE, DELETED]}
        code: {type: string}
        name: {type: string}
        description: {type: string}
        rulePresent: {type: boolean}
        departmentBindingCount: {type: integer, format: int64}
    OpenRolePage:
      type: object
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/OpenRoleResponse'}}
        total: {type: integer, format: int64}
        page: {type: integer}
        size: {type: integer}
    PortalMachineApplicationPage:
      type: object
      required: [catalogRevision, totalElements, page, size, items]
      properties:
        catalogRevision: {type: integer, format: int64, minimum: 1, description: Portal 可信应用路由投影全局版本}
        totalElements: {type: integer, format: int64, minimum: 0}
        page: {type: integer, minimum: 0, description: 当前页码（从 0 起）}
        size: {type: integer, minimum: 1}
        items: {type: array, items: {$ref: '#/components/schemas/PortalMachineApplication'}}
    PortalMachineApplication:
      type: object
      required: [applicationCode, applicationName, status, portalEnabled, routePrefix, entry, apiBase, targetOrigin, configVersion, forwardAuthorization, forwardCookieNames]
      properties:
        applicationCode: {type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$'}
        applicationName: {type: string, minLength: 1, maxLength: 128, description: 可信应用展示名，不得为空}
        status: {type: integer, enum: [1], description: "可信应用状态，1=启用"}
        portalEnabled: {type: boolean, enum: [true]}
        routePrefix: {type: string, minLength: 2, maxLength: 128, description: 页面和静态资源的公共路由前缀，以单个 / 开头；不得为 /、// 开头、含 query/fragment/userinfo、点段、反斜杠、控制字符、编码斜杠或非法百分号编码}
        entry: {type: string, minLength: 1, description: Portal 初始文档的公共页面路径，必须等于 routePrefix 或位于其下；不得填写绝对 URL、query、fragment、userinfo、控制字符、空白、反斜杠、点段或编码斜杠}
        apiBase: {type: string, minLength: 1, description: API 的公共路由前缀；Envoy 按此识别 API 请求，但仍转发到本应用唯一的 targetOrigin，不代表独立 API origin}
        targetOrigin: {type: string, minLength: 1, description: 页面和 API 共用的业务自有 Nginx HTTP origin；无路径、query、fragment 或 userinfo。IAM/Envoy 不记录此 Nginx 后方的业务内部拓扑}
        configVersion: {type: integer, format: int64, minimum: 1, description: 单应用 Portal 配置版本}
        forwardAuthorization: {type: string, enum: [REQUEST], description: 原样转发调用方 Authorization 请求头；不创建、验证或记录凭据}
        forwardCookieNames: {type: array, maxItems: 0, items: {type: string}}
    PutOpenRoleRuleRequest:
      type: object
      description: 'manifestVersion 只接受正数 JSON 整数，范围为 int64；小数、指数形式、字符串、布尔值、null 和溢出均返回 400，不做类型转换或截断。'
      required: [manifestVersion, manifestDigest, pagePermissions, apiPermissions]
      properties:
        manifestVersion: {type: integer, format: int64, minimum: 1}
        manifestDigest: {type: string, pattern: '^[0-9a-fA-F]{64}$'}
        pagePermissions: {type: array, maxItems: 4096, items: {type: string, maxLength: 256}}
        apiPermissions: {type: array, maxItems: 4096, items: {type: string, maxLength: 256}}
        dataGrantTemplate: {$ref: '#/components/schemas/OpenDataGrantDocument'}
    OpenDataGrantDocument:
      type: object
      nullable: true
      required: [protocol, version, grants]
      properties:
        protocol: {type: string, enum: [simple-data-permission]}
        version: {type: string, enum: ['1.0']}
        grants:
          type: array
          items:
            type: object
            required: [resource, actions, all, constraints]
            properties:
              resource: {type: string}
              actions: {type: array, items: {type: string}}
              all: {type: boolean}
              constraints:
                type: array
                items:
                  type: object
                  required: [dimension, operator, values]
                  properties:
                    dimension: {type: string}
                    operator: {type: string, enum: [IN]}
                    values: {type: array, items: {type: string}}
    OpenRoleRuleResponse:
      type: object
      properties:
        openRoleId: {type: string, format: uuid}
        applicationId: {type: integer, format: int64}
        revision: {type: integer, format: int64}
        pagePermissions: {type: array, items: {type: string}}
        apiPermissions: {type: array, items: {type: string}}
        dataGrantTemplate: {$ref: '#/components/schemas/OpenDataGrantDocument'}
    OpenDepartmentRolePage:
      type: object
      properties:
        revision: {type: integer, format: int64}
        total: {type: integer, format: int64}
        page: {type: integer}
        size: {type: integer}
        items:
          type: array
          items:
            type: object
            properties:
              departmentId: {type: integer, format: int64}
              inCurrentRoot: {type: boolean}
              createdAt: {type: string, format: date-time}
    OpenOrganizationDirectory:
      type: object
      properties:
        rootDepartmentId: {type: integer, format: int64}
        complete: {type: boolean, enum: [true]}
        directoryDigest: {type: string}
        departments:
          type: array
          items:
            type: object
            properties:
              departmentId: {type: integer, format: int64}
              code: {type: string}
              parentId: {type: integer, format: int64, nullable: true}
              name: {type: string}
              status: {type: integer}
    OpenOrganizationMember:
      type: object
      properties:
        subjectId: {type: string}
        status: {type: integer}
        departmentId: {type: integer, format: int64}
        inCurrentRoot: {type: boolean}
    OpenTargetApplication:
      type: object
      properties:
        applicationId: {type: integer, format: int64}
        applicationCode: {type: string}
        name: {type: string}
        status: {type: integer}
        builtIn: {type: boolean, enum: [false]}
    OpenTargetManifest:
      type: object
      properties:
        applicationId: {type: integer, format: int64}
        roles: {type: array, items: {type: string}}
        pagePermissions: {type: array, items: {type: string}}
        apiPermissions: {type: array, items: {type: string}}
        dataResources:
          type: array
          items:
            type: object
            properties:
              resource: {type: string}
              actions: {type: array, items: {type: string}}
              dimensions: {type: array, items: {type: string}}
        manifestVersion: {type: integer, format: int64}
        manifestDigest: {type: string}
        updatedAt: {type: string, format: date-time}
    MessageSendRequest:
      type: object
      required: [title, content]
      properties:
        recipientSubjectIds: {type: array, items: {type: string}}
        departmentIds: {type: array, items: {type: integer, format: int64}}
        userGroupIds: {type: array, items: {type: integer, format: int64}}
        includeChildDepartments: {type: boolean}
        title: {type: string}
        content: {type: string}
    MessageSendResult:
      type: object
      properties:
        sendBatchId: {type: string}
        recipientCount: {type: integer}
    OpenApiMessage:
      type: object
      properties:
        title: {type: string}
        content: {type: string}
        createdAt: {type: string, format: date-time}
        read: {type: boolean}
    MessageBatch:
      type: object
      properties:
        sendBatchId: {type: string}
        title: {type: string}
        content: {type: string}
        senderUsername: {type: string}
        targetUserCount: {type: integer}
        targetDepartmentCount: {type: integer}
    OpenApiSession:
      type: object
      properties:
        sessionId: {type: string}
        subjectId: {type: string}
        username: {type: string}
        clientId: {type: string, nullable: true}
        remoteIp: {type: string, nullable: true}
        userAgent: {type: string, nullable: true}
        authTime: {type: string, format: date-time}
        lastActiveAt: {type: string, format: date-time}
    OpenApiPermission:
      type: object
      properties:
        code: {type: string}
        name: {type: string}
        description: {type: string, nullable: true}
        type: {type: string, enum: [page, api, data]}
        builtIn: {type: integer}
    OpenApiRoleEntry:
      type: object
      properties:
        id: {type: integer, format: int64}
        code: {type: string}
        name: {type: string}
        description: {type: string, nullable: true}
        builtIn: {type: integer}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    OpenApiStatistics:
      type: object
      properties:
        user: {type: integer, format: int64}
        department: {type: integer, format: int64}
        userGroup: {type: integer, format: int64}
        role: {type: integer, format: int64}
        permission: {type: integer, format: int64}
        trustedApplication: {type: integer, format: int64}
        activeSessions: {type: integer, format: int64}
        todayLoggedInUsers: {type: integer, format: int64}
        lockedUsers: {type: integer, format: int64}
        disabledUsers: {type: integer, format: int64}
        usersWithoutDepartment: {type: integer, format: int64}
    UserGroupCreateRequest:
      type: object
      required: [code, name]
      properties:
        code: {type: string}
        name: {type: string}
        description: {type: string, nullable: true}
    UserGroupUpdateRequest:
      type: object
      properties:
        name: {type: string}
        description: {type: string}
        status: {type: integer}
    OpenApiUserGroup:
      type: object
      properties:
        id: {type: integer, format: int64}
        code: {type: string}
        name: {type: string}
        description: {type: string, nullable: true}
        status: {type: integer}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    OpenApiGroupUser:
      type: object
      properties:
        subjectId: {type: string}
        username: {type: string}
        displayName: {type: string, nullable: true}
        status: {type: integer}
    PageAdmittedApplicationDetail:
      type: object
      properties:
        code: {type: string, description: 应用编码}
        displayName: {type: string, description: 应用显示名（与门户侧边栏同源）}
        description: {type: string, nullable: true, description: 应用描述（可空）}
    ApplicationOpenApi:
      type: object
      properties:
        applicationCode: {type: string, description: 应用编码}
        applicationName: {type: string, description: 应用名称}
        status: {type: integer, description: "1=启用"}
    ApplicationPage:
      type: object
      properties:
        content: {type: array, items: {$ref: '#/components/schemas/ApplicationOpenApi'}}
        totalElements: {type: integer, format: int64}
        totalPages: {type: integer}
        number: {type: integer, description: 页码（0 起）}
        size: {type: integer}
    UserRestResponse:
      type: object
      properties:
        id: {type: integer, format: int64}
        subjectId: {type: string, description: 对外公开主体标识（1.3.5 起回传）}
        username: {type: string}
        displayName: {type: string, nullable: true}
        departmentId: {type: integer, format: int64, nullable: true}
        departmentName: {type: string, nullable: true}
        status: {type: integer, description: "1=启用"}
        email: {type: string, nullable: true}
        phone: {type: string, nullable: true}
        roles: {type: array, items: {type: string}}
    UserPage:
      type: object
      properties:
        content: {type: array, items: {$ref: '#/components/schemas/UserRestResponse'}}
        totalElements: {type: integer}
        totalPages: {type: integer}
        number: {type: integer, description: 当前页码（从 0 起）}
        size: {type: integer}
    CreateUserRequest:
      type: object
      required: [username, password]
      properties:
        username: {type: string}
        password: {type: string}
        displayName: {type: string}
        email: {type: string}
        phone: {type: string}
        departmentId: {type: integer, format: int64, description: 目标部门（DATA 校验对象）}
    UpdateUserRequest:
      type: object
      properties:
        displayName: {type: string}
        email: {type: string}
        phone: {type: string}
        departmentId: {type: integer, format: int64, description: 变更后部门（变更时 DATA 校验新部门）}
        clearDepartment: {type: boolean, description: 置 true 清空部门归属}
    ResetPasswordRequest:
      type: object
      required: [newPassword]
      properties:
        newPassword: {type: string}
    DepartmentRestResponse:
      type: object
      properties:
        id: {type: integer, format: int64}
        code: {type: string}
        name: {type: string}
        parentId: {type: integer, format: int64, nullable: true}
        fullPath: {type: string, description: 自根起全路径（如 /root/研发/后端）}
        sortOrder: {type: integer, nullable: true}
        status: {type: integer}
    CreateDepartmentRequest:
      type: object
      required: [code, name]
      properties:
        code: {type: string}
        name: {type: string}
        parentId: {type: integer, format: int64, nullable: true}
        sortOrder: {type: integer}
        status: {type: integer}
    UpdateDepartmentRequest:
      type: object
      properties:
        name: {type: string}
        parentId: {type: integer, format: int64, nullable: true}
        sortOrder: {type: integer}
        status: {type: integer}
