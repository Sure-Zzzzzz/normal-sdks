  /iam/api/applications:
    get:
      summary: 分页列出全部可信应用（全局目录）
      operationId: listApplications
      description: |
        IAM 权威注册的可信应用目录（1.3.7 起）：全局事实、无用户维度，供外部系统
        （如限流管理目录 adaptor）同步应用清单。API 码 iam:application:api；
        DATA 资源 iam:application read——注册表无部门归属，授权恒为 all=true（IN 范围不适用）。
        排序 createdAt 倒序（新注册在前）；分页 Spring Page wire 形态（页码 0 起）。
      parameters:
        - {name: page, in: query, schema: {type: integer, default: 0}, description: 页码（从 0 起）}
        - {name: size, in: query, schema: {type: integer, default: 20}, description: 每页大小}
      responses:
        '200':
          description: 可信应用分页（目录三字段，不含 client 明细）。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApplicationPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /iam/api/portal/applications:
    get:
      summary: 分页读取 Portal 机器路由目录
      operationId: listPortalMachineApplications
      description: |
        供已授权 AKP SERVICE 主体读取启用 Portal 的可信应用路由投影。HUMAN 主体不得调用，
        即使拥有同名 API/DATA 权限也返回 403。首次请求可省略 catalogRevision；
        后续分页必须携带上一页返回的 revision。目录发生变化时返回 409，调用方必须从第一页
        重新建立快照；服务不会返回跨 revision 的部分结果。该接口不接受浏览器 Cookie 或用户会话。
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}, description: 页码（从 0 起）}
        - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}, description: 页大小，超出 1..100 返回 400}
        - {name: catalogRevision, in: query, required: false, schema: {type: integer, format: int64, minimum: 1}, description: 调用方已持有的目录版本}
      responses:
        '200':
          description: 同一 catalogRevision 的完整分页。
          headers:
            Cache-Control: {description: 机器目录不得缓存。固定为 no-store。, schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PortalMachineApplicationPage'}
        '401':
          description: 缺少或无效 AKP，或未建立机器身份。
          headers:
            Cache-Control: {description: 机器目录错误响应不得缓存。固定为 no-store。, schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpenRoleError'}
        '403':
          description: 非 SERVICE 主体、应用准入、API 或 DATA 范围不足。
          headers:
            Cache-Control: {description: 机器目录错误响应不得缓存。固定为 no-store。, schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpenRoleError'}
        '400':
          description: 分页参数非法。
          headers:
            Cache-Control: {description: 机器目录错误响应不得缓存。固定为 no-store。, schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpenRoleError'}
        '404':
          description: 服务端未提供 Portal 机器目录契约。
          headers:
            Cache-Control: {description: 机器目录错误响应不得缓存。固定为 no-store。, schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpenRoleError'}
        '409':
          description: 目录版本在读取期间发生变化，响应不包含可复用的部分目录。
          headers:
            Cache-Control: {description: 机器目录错误响应不得缓存。固定为 no-store。, schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpenRoleError'}
        '500':
          description: 已存目录数据违反契约或发生未预期内部错误。
          headers:
            Cache-Control: {description: 机器目录错误响应不得缓存。固定为 no-store。, schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpenRoleError'}
        '503':
          description: IAM 目录依赖或事务暂不可用；调用方不得把失败解释为空目录。
          headers:
            Cache-Control: {description: 机器目录错误响应不得缓存。固定为 no-store。, schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpenRoleError'}
