    ResourceVerificationClient: { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceVerificationClient' } } } }
    ResourceVerificationClientList: { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ResourceVerificationClient' } } } } }
    ResourceVerificationClientSecret: { description: 创建 / 轮换成功，明文密钥仅本次响应返回, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceVerificationClientSecret' } } } }
    ApplicationAuthorizationDetail: { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ApplicationAuthorizationDetail' } } } }
    ApplicationAuthorizationList: { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ApplicationAuthorization' } } } } }
    AdminDashboard: { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdminDashboardResponse' } } } }
    AdminRecentLoginPage: { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdminRecentLoginPage' } } } }
    ActiveSessionPage: { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ActiveSessionPage' } } } }
    SessionRevokeResult: { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SessionRevokeResult' } } } }
  schemas:
    CreateUserRequest:
      type: object
      properties: { username: { type: string }, password: { type: string, format: password }, displayName: { type: string }, email: { type: string }, phone: { type: string }, departmentId: { type: integer, format: int64, nullable: true } }
    UpdateUserRequest:
      type: object
      properties: { displayName: { type: string }, email: { type: string }, phone: { type: string }, departmentId: { type: integer, format: int64, nullable: true }, clearDepartment: { type: boolean, nullable: true } }
    ResetPasswordRequest:
      type: object
      properties: { newPassword: { type: string, format: password } }
    BindExternalIdentityRequest:
      type: object
      required: [providerCode, externalId]
      properties: { providerCode: { type: string, example: ldap-password, description: 登录方式编码（须为已装配的外部登录方式） }, externalId: { type: string, description: 外部体系稳定唯一标识（LDAP DN/uid、OIDC sub） } }
    AdminUserResponse:
      type: object
      properties: { id: { type: integer, format: int64 }, username: { type: string }, displayName: { type: string, nullable: true }, email: { type: string, nullable: true }, phone: { type: string, nullable: true }, departmentId: { type: integer, format: int64, nullable: true }, departmentName: { type: string, nullable: true }, status: { type: integer }, lockedUntil: { type: string, format: date-time, nullable: true }, lastLoginAt: { type: string, format: date-time, nullable: true }, identitySource: { type: string, nullable: true, description: 绑定的外部登录方式编码（本地账号为 null） }, externalId: { type: string, nullable: true, description: 外部体系稳定唯一标识（本地账号为 null） }, createdAt: { type: string, format: date-time }, updatedAt: { type: string, format: date-time } }
    CreateDepartmentRequest:
      type: object
      properties: { code: { type: string }, name: { type: string }, parentId: { type: integer, format: int64, nullable: true }, sortOrder: { type: integer }, status: { type: integer } }
    UpdateDepartmentRequest:
      type: object
      properties: { name: { type: string }, parentId: { type: integer, format: int64, nullable: true }, sortOrder: { type: integer }, status: { type: integer } }
    DepartmentResponse:
      type: object
      properties: { id: { type: integer, format: int64 }, code: { type: string }, name: { type: string }, parentId: { type: integer, format: int64, nullable: true }, parentName: { type: string, nullable: true }, sortOrder: { type: integer }, status: { type: integer }, createdAt: { type: string, format: date-time }, updatedAt: { type: string, format: date-time } }
    CreateUserGroupRequest:
      type: object
      properties: { code: { type: string }, name: { type: string }, description: { type: string, nullable: true }, status: { type: integer } }
    UpdateUserGroupRequest:
      type: object
      properties: { name: { type: string }, description: { type: string, nullable: true }, status: { type: integer } }
    UserGroupResponse:
      type: object
      properties: { id: { type: integer, format: int64 }, code: { type: string }, name: { type: string }, description: { type: string, nullable: true }, status: { type: integer }, createdAt: { type: string, format: date-time }, updatedAt: { type: string, format: date-time } }
    CreateRoleRequest:
      type: object
      properties: { code: { type: string }, name: { type: string }, description: { type: string, nullable: true } }
    UpdateRoleRequest:
      type: object
      properties: { name: { type: string }, description: { type: string, nullable: true } }
    RoleResponse:
      type: object
      properties: { id: { type: integer, format: int64 }, code: { type: string }, name: { type: string }, description: { type: string, nullable: true }, builtIn: { type: integer }, createdAt: { type: string, format: date-time }, updatedAt: { type: string, format: date-time } }
    RoleSummaryResponse:
      type: object
      properties: { id: { type: integer, format: int64 }, code: { type: string }, name: { type: string }, description: { type: string, nullable: true }, builtIn: { type: integer }, source: { type: string, enum: [direct, department_inherited], description: '角色来源：direct 个人直接 / department_inherited 部门继承' } }
    PermissionResponse:
      type: object
      properties: { id: { type: integer, format: int64 }, code: { type: string }, name: { type: string }, description: { type: string, nullable: true }, type: { type: string }, builtIn: { type: integer }, createdAt: { type: string, format: date-time }, updatedAt: { type: string, format: date-time } }
    PermissionSummaryResponse:
      type: object
      properties: { id: { type: integer, format: int64 }, code: { type: string }, name: { type: string }, type: { type: string }, source: { type: string, enum: [direct, department_inherited], description: '权限来源：direct 个人直接角色授予 / department_inherited 部门继承角色授予' } }
    CreateMessageRequest:
      type: object
      properties:
        recipientUserId: { type: integer, format: int64, nullable: true }
        recipientUserIds: { type: array, items: { type: integer, format: int64 } }
        departmentIds: { type: array, items: { type: integer, format: int64 } }
        userGroupIds: { type: array, items: { type: integer, format: int64 } }
        includeChildDepartments: { type: boolean, nullable: true }
        title: { type: string }
        content: { type: string }
    MessageSendResponse:
      type: object
      properties: { sendBatchId: { type: string }, recipientCount: { type: integer, format: int64 } }
    MessageBatchSummary:
      type: object
      properties: { sendBatchId: { type: string }, title: { type: string }, senderUsername: { type: string }, targetUserCount: { type: integer, description: 请求指定的用户目标数（active 过滤前，非实际收件人数） }, targetDepartmentCount: { type: integer }, targetUserGroupCount: { type: integer }, targetIncludeChildDepartments: { type: boolean }, recipientCount: { type: integer, format: int64, description: 实际收件人数（展开并过滤后） }, readCount: { type: integer, format: int64 }, createdAt: { type: string, format: date-time } }
    MessageBatchDetail:
      type: object
      properties: { sendBatchId: { type: string }, title: { type: string }, content: { type: string }, senderUsername: { type: string }, targetUserCount: { type: integer }, targetDepartmentCount: { type: integer }, targetUserGroupCount: { type: integer }, targetIncludeChildDepartments: { type: boolean }, recipientCount: { type: integer, format: int64 }, readCount: { type: integer, format: int64 }, createdAt: { type: string, format: date-time } }
    MessageBatchRecipient:
      type: object
      properties: { userId: { type: integer, format: int64 }, username: { type: string }, displayName: { type: string, description: 用户已注销时为兜底文案 }, readAt: { type: string, format: date-time, nullable: true } }
    MessageBatchPage:
      type: object
      properties: { content: { type: array, items: { $ref: '#/components/schemas/MessageBatchSummary' } }, totalElements: { type: integer, format: int64 }, totalPages: { type: integer }, page: { type: integer, minimum: 1 }, size: { type: integer }, numberOfElements: { type: integer }, first: { type: boolean }, last: { type: boolean }, empty: { type: boolean } }
    MessageBatchRecipientPage:
      type: object
      properties: { content: { type: array, items: { $ref: '#/components/schemas/MessageBatchRecipient' } }, totalElements: { type: integer, format: int64 }, totalPages: { type: integer }, page: { type: integer, minimum: 1 }, size: { type: integer }, numberOfElements: { type: integer }, first: { type: boolean }, last: { type: boolean }, empty: { type: boolean } }
    OrganizationTreeNodeResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        parentId: { type: integer, format: int64, nullable: true }
        status: { type: integer }
        sortOrder: { type: integer }
        directMemberCount: { type: integer, format: int64 }
        children: { type: array, items: { $ref: '#/components/schemas/OrganizationTreeNodeResponse' } }
    OrganizationDepartmentWorkspaceResponse:
      type: object
      properties:
        department: { $ref: '#/components/schemas/DepartmentResponse' }
        directChildren: { type: array, items: { $ref: '#/components/schemas/DepartmentResponse' } }
        members: { $ref: '#/components/schemas/AdminUserPage' }
    OrganizationUserProfileResponse:
      type: object
      properties:
        user: { $ref: '#/components/schemas/AdminUserResponse' }
        department: { $ref: '#/components/schemas/DepartmentResponse', nullable: true }
        userGroups: { type: array, items: { $ref: '#/components/schemas/UserGroupResponse' } }
        roles: { type: array, items: { $ref: '#/components/schemas/RoleSummaryResponse' } }
        effectivePermissions: { type: array, items: { $ref: '#/components/schemas/PermissionSummaryResponse' } }
    AdminUserPage:
      type: object
      properties: { content: { type: array, items: { $ref: '#/components/schemas/AdminUserResponse' } }, totalElements: { type: integer, format: int64 }, totalPages: { type: integer }, page: { type: integer, minimum: 1 }, size: { type: integer }, numberOfElements: { type: integer }, first: { type: boolean }, last: { type: boolean }, empty: { type: boolean } }
    DepartmentPage:
      type: object
      properties: { content: { type: array, items: { $ref: '#/components/schemas/DepartmentResponse' } }, totalElements: { type: integer, format: int64 }, totalPages: { type: integer }, page: { type: integer, minimum: 1 }, size: { type: integer }, numberOfElements: { type: integer }, first: { type: boolean }, last: { type: boolean }, empty: { type: boolean } }
    UserGroupPage:
      type: object
      properties: { content: { type: array, items: { $ref: '#/components/schemas/UserGroupResponse' } }, totalElements: { type: integer, format: int64 }, totalPages: { type: integer }, page: { type: integer, minimum: 1 }, size: { type: integer }, numberOfElements: { type: integer }, first: { type: boolean }, last: { type: boolean }, empty: { type: boolean } }
    RolePage:
      type: object
      properties: { content: { type: array, items: { $ref: '#/components/schemas/RoleResponse' } }, totalElements: { type: integer, format: int64 }, totalPages: { type: integer }, page: { type: integer, minimum: 1 }, size: { type: integer }, numberOfElements: { type: integer }, first: { type: boolean }, last: { type: boolean }, empty: { type: boolean } }
    PermissionPage:
      type: object
      properties: { content: { type: array, items: { $ref: '#/components/schemas/PermissionResponse' } }, totalElements: { type: integer, format: int64 }, totalPages: { type: integer }, page: { type: integer, minimum: 1 }, size: { type: integer }, numberOfElements: { type: integer }, first: { type: boolean }, last: { type: boolean }, empty: { type: boolean } }
    PortalMenuItem:
      type: object
      properties: { code: { type: string }, name: { type: string }, route: { type: string }, sortOrder: { type: integer } }
    PortalIntegrationRequest:
      type: object
      properties: { enabled: { type: boolean }, entry: { type: string, nullable: true }, apiBase: { type: string, nullable: true }, menus: { type: array, items: { $ref: '#/components/schemas/PortalMenuItem' } } }
    PortalIntegration:
      type: object
      properties: { enabled: { type: boolean }, entry: { type: string, nullable: true }, apiBase: { type: string, nullable: true }, routePrefix: { type: string }, menus: { type: array, items: { $ref: '#/components/schemas/PortalMenuItem' } } }
    TrustedApplicationSummary:
      type: object
      properties: { id: { type: integer, format: int64 }, applicationCode: { type: string }, applicationName: { type: string }, description: { type: string, nullable: true }, icon: { type: string, nullable: true, description: 内置图标编码，未知编码将被拒绝或以默认图标显示, enum: [access-control, users, key, settings, lock, dashboard, project, message, calendar, workflow, data-service, database, analytics, document, search, cloud, network, developer, application, default] }, clientCount: { type: integer }, portalEnabled: { type: boolean }, builtIn: { type: boolean, description: 内置应用（引导注册，如 IAM 管理台），禁止删除 } }
    TrustedApplicationDetail:
      type: object
      properties: { id: { type: integer, format: int64 }, applicationCode: { type: string }, applicationName: { type: string }, description: { type: string, nullable: true }, icon: { type: string, nullable: true, description: 内置图标编码，未知编码将被拒绝或以默认图标显示, enum: [access-control, users, key, settings, lock, dashboard, project, message, calendar, workflow, data-service, database, analytics, document, search, cloud, network, developer, application, default] }, builtIn: { type: boolean, description: 内置应用（引导注册，如 IAM 管理台），禁止删除 }, portal: { $ref: '#/components/schemas/PortalIntegration', nullable: true }, clients: { type: array, items: { $ref: '#/components/schemas/TrustedApplicationClient' } } }
    TrustedApplicationSummaryPage:
      type: object
      properties: { content: { type: array, items: { $ref: '#/components/schemas/TrustedApplicationSummary' } }, totalElements: { type: integer, format: int64 }, totalPages: { type: integer }, page: { type: integer, minimum: 1 }, size: { type: integer }, numberOfElements: { type: integer }, first: { type: boolean }, last: { type: boolean }, empty: { type: boolean } }
    TrustedApplicationClient:
      type: object
      properties: { id: { type: string }, clientId: { type: string }, clientName: { type: string }, clientType: { type: string, enum: [PUBLIC, CONFIDENTIAL] }, requireConsent: { type: boolean }, requireProofKey: { type: boolean }, redirectUris: { type: array, items: { type: string, format: uri } }, scopes: { type: array, items: { type: string } }, grantTypes: { type: array, items: { type: string } }, authenticationMethods: { type: array, items: { type: string } }, clientIdIssuedAt: { type: string, format: date-time, nullable: true }, secretPresent: { type: boolean } }
    CreateTrustedApplicationClientRequest:
      type: object
      properties: { clientId: { type: string }, clientName: { type: string }, clientType: { type: string, enum: [PUBLIC, CONFIDENTIAL] }, clientSecret: { type: string, format: password, nullable: true }, requireConsent: { type: boolean }, redirectUris: { type: array, items: { type: string, format: uri } }, scopes: { type: array, items: { type: string } }, grantTypes: { type: array, items: { type: string } }, authenticationMethods: { type: array, items: { type: string } } }
    UpdateTrustedApplicationClientRequest:
      type: object
      properties: { clientName: { type: string }, requireConsent: { type: boolean }, redirectUris: { type: array, items: { type: string, format: uri } }, scopes: { type: array, items: { type: string } } }
    CreateTrustedApplicationRequest:
      type: object
      properties: { applicationCode: { type: string }, applicationName: { type: string }, description: { type: string, nullable: true }, icon: { type: string, nullable: true, description: 内置图标编码，未知编码将被拒绝或以默认图标显示, enum: [access-control, users, key, settings, lock, dashboard, project, message, calendar, workflow, data-service, database, analytics, document, search, cloud, network, developer, application, default] }, portal: { $ref: '#/components/schemas/PortalIntegrationRequest', nullable: true }, initialClient: { $ref: '#/components/schemas/CreateTrustedApplicationClientRequest' }, roles: { type: array, items: { type: string }, nullable: true, description: 应用角色编码列表（权限清单），创建时同步登记 }, pagePermissions: { type: array, items: { type: string }, nullable: true, description: 页面权限编码列表 }, apiPermissions: { type: array, items: { type: string }, nullable: true, description: API权限编码列表 } }
    UpdateTrustedApplicationRequest:
      type: object
      properties: { applicationName: { type: string }, description: { type: string, nullable: true }, icon: { type: string, nullable: true, description: 内置图标编码，未知编码将被拒绝或以默认图标显示, enum: [access-control, users, key, settings, lock, dashboard, project, message, calendar, workflow, data-service, database, analytics, document, search, cloud, network, developer, application, default] }, portal: { $ref: '#/components/schemas/PortalIntegrationRequest', nullable: true } }
    TrustedApplicationClientSecret:
      type: object
      properties: { id: { type: string }, clientId: { type: string }, clientSecret: { type: string, description: 仅本次响应返回 } }
    ResourceVerificationClient:
      type: object
      properties: { clientId: { type: string }, applicationId: { type: integer, format: int64 }, status: { type: integer, description: 1=活跃，0=已撤销 }, createdAt: { type: string, format: date-time }, updatedAt: { type: string, format: date-time, description: 最近一次轮换 / 撤销 }, revokedAt: { type: string, format: date-time, nullable: true } }
    CreateResourceVerificationClientRequest:
      type: object
      required: [ clientId ]
      properties: { clientId: { type: string, maxLength: 100, description: 不能包含冒号（Basic 凭据按冒号分隔） } }
    ResourceVerificationClientSecret:
      type: object
      properties: { clientId: { type: string }, clientSecret: { type: string, description: 仅本次响应返回 } }
    ApplicationAuthorization:
      type: object
      properties: { applicationId: { type: integer, format: int64 }, admitted: { type: boolean, description: 是否通过应用准入 }, authorizationVersion: { type: integer, format: int64, description: 服务端单调递增 }, manifestVersion: { type: string }, status: { type: integer, description: 1=有效，0=已撤销 }, createdAt: { type: string, format: date-time }, updatedAt: { type: string, format: date-time, description: 最近一次替换 / 撤销 / 重激活 }, revokedAt: { type: string, format: date-time, nullable: true } }
    ApplicationAuthorizationDetail:
      type: object
      properties: { applicationId: { type: integer, format: int64 }, admitted: { type: boolean }, authorizationVersion: { type: integer, format: int64 }, manifestVersion: { type: string }, status: { type: integer, description: 1=有效，0=已撤销 }, roles: { type: array, items: { type: string } }, pagePermissions: { type: array, items: { type: string } }, apiPermissions: { type: array, items: { type: string } }, dataGrantDocument: { type: object, nullable: true, description: 数据授权文档，null 表示无数据授权 }, createdAt: { type: string, format: date-time }, updatedAt: { type: string, format: date-time }, revokedAt: { type: string, format: date-time, nullable: true } }
    PutApplicationAuthorizationRequest:
      type: object
      required: [ admitted, roles, pagePermissions, apiPermissions ]
      properties: { admitted: { type: boolean }, roles: { type: array, items: { type: string }, description: 可为空数组，须在应用权限清单内 }, pagePermissions: { type: array, items: { type: string }, description: 可为空数组，须在应用权限清单内 }, apiPermissions: { type: array, items: { type: string }, description: 可为空数组，须在应用权限清单内 }, dataGrantDocument: { allOf: [ { $ref: '#/components/schemas/DataGrantDocument' } ], nullable: true, description: null 表示清除数据授权；会被下一次投影重算覆盖（DATA 权威通道为角色规则并集） } }
    ApplicationPermissionManifest:
      type: object
      properties: { applicationId: { type: integer, format: int64 }, roles: { type: array, items: { type: string } }, pagePermissions: { type: array, items: { type: string } }, apiPermissions: { type: array, items: { type: string } }, dataResources: { type: array, items: { $ref: '#/components/schemas/DataResourceDeclaration' } }, manifestVersion: { type: integer, format: int64, description: 服务端单调递增 }, manifestDigest: { type: string, description: SHA-256 内容摘要 }, createdAt: { type: string, format: date-time }, updatedAt: { type: string, format: date-time } }
    PutApplicationPermissionManifestRequest:
      type: object
      required: [ roles, pagePermissions, apiPermissions, dataResources ]
      properties: { roles: { type: array, items: { type: string, maxLength: 256 }, description: 可为空数组，重复编码折叠 }, pagePermissions: { type: array, items: { type: string, maxLength: 256 }, description: 可为空数组 }, apiPermissions: { type: array, items: { type: string, maxLength: 256 }, description: 可为空数组 }, dataResources: { type: array, items: { $ref: '#/components/schemas/DataResourceDeclaration' }, description: 必传可为空数组；申报的 DATA 资源是角色规则模板的码空间事实源 } }
    RoleAuthorizationRule:
      type: object
      properties: { roleId: { type: integer, format: int64 }, applicationId: { type: integer, format: int64 }, pagePermissions: { type: array, items: { type: string } }, apiPermissions: { type: array, items: { type: string } }, dataGrantTemplate: { type: object, nullable: true, description: DATA 授权模板（grants 并集进投影），null 表示该角色无数据授权 }, createdAt: { type: string, format: date-time }, updatedAt: { type: string, format: date-time } }
    PutRoleAuthorizationRuleRequest:
      type: object
      required: [ pagePermissions, apiPermissions ]
      properties: { pagePermissions: { type: array, items: { type: string }, description: 可为空数组，须在应用权限清单内 }, apiPermissions: { type: array, items: { type: string }, description: 可为空数组，须在应用权限清单内 }, dataGrantTemplate: { allOf: [ { $ref: '#/components/schemas/DataGrantDocument' } ], nullable: true, description: null 表示清除数据授权；每条 grant 的 resource / action / dimension 须落在清单 DATA 资源申报内（越界 400） } }
    DataResourceDeclaration:
      type: object
      required: [ resource, actions, dimensions ]
      properties: { resource: { type: string, description: 资源标识（应用内唯一，如 iam:user） }, actions: { type: array, items: { type: string }, description: 该资源可授权的动作集（如 read / write） }, dimensions: { type: array, items: { type: string }, description: 该资源约束可用的维度集（如 departmentId） } }
    DataGrantDocument:
      type: object
      required: [ protocol, version, grants ]
      properties: { protocol: { type: string, description: 固定 simple-data-permission }, version: { type: string, description: 固定 1.0 }, grants: { type: array, items: { $ref: '#/components/schemas/DataGrant' } } }
      description: 字段精确校验（不多不少）；grants 间 OR、grant 内约束 AND。
    DataGrant:
      type: object
      required: [ resource, actions, all, constraints ]
      properties: { resource: { type: string }, actions: { type: array, items: { type: string } }, all: { type: boolean, description: true=全量（constraints 须为空数组） }, constraints: { type: array, items: { $ref: '#/components/schemas/DataConstraint' } } }
    DataConstraint:
      type: object
      required: [ dimension, operator, values ]
      properties: { dimension: { type: string, description: 须在资源申报维度集内 }, operator: { type: string, description: 仅支持 IN（大写） }, values: { type: array, items: { type: string } } }
    AdminDashboardResponse:
      type: object
      properties:
        counts: { $ref: '#/components/schemas/DashboardGovernanceCounts' }
        stats: { $ref: '#/components/schemas/DashboardRuntimeStats' }
    DashboardGovernanceCounts:
      type: object
      properties: { user: { type: integer, format: int64 }, department: { type: integer, format: int64 }, userGroup: { type: integer, format: int64 }, role: { type: integer, format: int64 }, permission: { type: integer, format: int64 }, trustedApplication: { type: integer, format: int64 } }
    DashboardRuntimeStats:
      type: object
      properties: { activeSessions: { type: integer, format: int64, description: 在线会话数（未过期且未撤销） }, todayLoggedInUsers: { type: integer, format: int64, description: 今日登录用户数（按部署时区当日零点起算） }, lockedUsers: { type: integer, format: int64, description: 锁定中账号数 }, disabledUsers: { type: integer, format: int64, description: 禁用账号数 }, usersWithoutDepartment: { type: integer, format: int64, description: 未归属部门的用户数 } }
    AdminRecentLogin:
      type: object
      properties: { userId: { type: integer, format: int64 }, username: { type: string }, displayName: { type: string, nullable: true }, departmentName: { type: string, nullable: true }, lastLoginAt: { type: string, format: date-time } }
    AdminRecentLoginPage:
      type: object
      properties: { content: { type: array, items: { $ref: '#/components/schemas/AdminRecentLogin' } }, totalElements: { type: integer, format: int64 }, totalPages: { type: integer }, page: { type: integer, minimum: 1 }, size: { type: integer }, numberOfElements: { type: integer }, first: { type: boolean }, last: { type: boolean }, empty: { type: boolean } }
    AdminSession:
      type: object
      properties: { sessionId: { type: string }, userId: { type: integer, format: int64 }, username: { type: string }, clientId: { type: string, nullable: true, description: 关联客户端编号（Web 会话为 null） }, remoteIp: { type: string, nullable: true }, userAgent: { type: string, nullable: true }, authTime: { type: string, format: date-time }, lastActiveAt: { type: string, format: date-time, nullable: true }, expiresAt: { type: string, format: date-time } }
    ActiveSessionPage:
      type: object
      properties: { content: { type: array, items: { $ref: '#/components/schemas/AdminSession' } }, totalElements: { type: integer, format: int64 }, totalPages: { type: integer }, page: { type: integer, minimum: 1 }, size: { type: integer }, numberOfElements: { type: integer }, first: { type: boolean }, last: { type: boolean }, empty: { type: boolean } }
    SessionRevokeResult:
      type: object
      properties: { revoked: { type: integer, description: 本次撤销的活跃会话数量 } }
