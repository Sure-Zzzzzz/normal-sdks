    MessageBatchDetail: { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MessageBatchDetail' } } } }
    MessageBatchRecipientPage: { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MessageBatchRecipientPage' } } } }
    OrganizationTree: { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/OrganizationTreeNodeResponse' } } } } }
    OrganizationDepartmentWorkspace: { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationDepartmentWorkspaceResponse' } } } }
    OrganizationUserProfile: { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationUserProfileResponse' } } } }
    TrustedApplicationSummary: { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TrustedApplicationSummary' } } } }
    TrustedApplicationSummaryList: { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TrustedApplicationSummary' } } } } }
    TrustedApplicationSummaryPage: { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TrustedApplicationSummaryPage' } } } }
    TrustedApplicationDetail: { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TrustedApplicationDetail' } } } }
