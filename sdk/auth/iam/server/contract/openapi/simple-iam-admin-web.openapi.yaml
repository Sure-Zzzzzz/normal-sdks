openapi: 3.0.3
info:
  title: Simple IAM Admin API
  version: 1.0.0
  description: IAM 管理端 API。所有接口要求已认证用户具备 ROLE_iam_admin；写操作还要求当前浏览器会话的 CSRF Token。
servers:
  - url: /
security:
  - iamSession: []
paths:
  /iam/admin/organizations/tree:
    get:
      summary: 获取组织树
      operationId: getOrganizationTree
      responses: { '200': { $ref: '#/components/responses/OrganizationTree' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /iam/admin/organizations/departments/{departmentId}/workspace:
    parameters: [ { $ref: '#/components/parameters/DepartmentId' }, { $ref: '#/components/parameters/Status' }, { $ref: '#/components/parameters/Keyword' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Size' } ]
    get:
      summary: 获取部门工作台
      operationId: getOrganizationDepartmentWorkspace
      responses: { '200': { $ref: '#/components/responses/OrganizationDepartmentWorkspace' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /iam/admin/organizations/users/{userId}/profile:
    parameters: [ { $ref: '#/components/parameters/UserId' } ]
    get:
      summary: 获取用户组织关系详情
      operationId: getOrganizationUserProfile
      responses: { '200': { $ref: '#/components/responses/OrganizationUserProfile' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /iam/admin/users:
    get:
      summary: 分页查询用户
      operationId: listAdminUsers
      parameters: [ { $ref: '#/components/parameters/Status' }, { $ref: '#/components/parameters/DepartmentIdQuery' }, { $ref: '#/components/parameters/Keyword' }, { $ref: '#/components/parameters/LastLoginAfter' }, { $ref: '#/components/parameters/LockedUntilAfter' }, { $ref: '#/components/parameters/NoDepartment' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Size' } ]
      responses: { '200': { $ref: '#/components/responses/AdminUserPage' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      summary: 创建用户
      operationId: createAdminUser
      security: [ { iamSession: [], csrfToken: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateUserRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/AdminUser' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' } }
  /iam/admin/users/{userId}:
    parameters: [ { $ref: '#/components/parameters/UserId' } ]
    get:
      summary: 获取用户
      operationId: getAdminUser
      responses: { '200': { $ref: '#/components/responses/AdminUser' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
    put:
      summary: 更新用户
      operationId: updateAdminUser
      security: [ { iamSession: [], csrfToken: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateUserRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/AdminUser' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
    delete:
      summary: 删除用户
      operationId: deleteAdminUser
      security: [ { iamSession: [], csrfToken: [] } ]
      responses: { '204': { description: 已删除 }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /iam/admin/users/{userId}/enable:
    parameters: [ { $ref: '#/components/parameters/UserId' } ]
    put:
      summary: 启用用户
      operationId: enableAdminUser
      security: [ { iamSession: [], csrfToken: [] } ]
      responses: { '200': { description: 已启用 }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /iam/admin/users/{userId}/disable:
    parameters: [ { $ref: '#/components/parameters/UserId' } ]
    put:
      summary: 停用用户
      operationId: disableAdminUser
      security: [ { iamSession: [], csrfToken: [] } ]
      responses: { '200': { description: 已停用 }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /iam/admin/users/{userId}/unlock:
    parameters: [ { $ref: '#/components/parameters/UserId' } ]
    put:
      summary: 手动解锁用户
      description: 清除登录失败锁定与失败计数（DB 锁定与 Redis 失败计数双清），不等自动过期。
      operationId: unlockAdminUser
      security: [ { iamSession: [], csrfToken: [] } ]
      responses: { '200': { description: 已解锁 }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /iam/admin/users/{userId}/reset-password:
    parameters: [ { $ref: '#/components/parameters/UserId' } ]
    put:
      summary: 重置用户密码
      operationId: resetAdminUserPassword
      security: [ { iamSession: [], csrfToken: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ResetPasswordRequest' } } } }
      responses: { '200': { description: 密码已重置 }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /iam/admin/users/{userId}/application-authorizations:
    parameters: [ { $ref: '#/components/parameters/UserId' } ]
    get:
      summary: 列出用户全部应用授权摘要
      operationId: listUserApplicationAuthorizations
      responses: { '200': { $ref: '#/components/responses/ApplicationAuthorizationList' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /iam/admin/users/{userId}/application-authorizations/{applicationId}:
    parameters: [ { $ref: '#/components/parameters/UserId' }, { $ref: '#/components/parameters/ApplicationId' } ]
    get:
      summary: 获取用户应用授权详情
      operationId: getUserApplicationAuthorization
      responses: { '200': { $ref: '#/components/responses/ApplicationAuthorizationDetail' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
    put:
      summary: 全量替换用户应用授权
      description: 无则创建（201）、有则全量替换（200）；已撤销记录再次 PUT 即重激活。授权内容变更立即生效：token 发放与资源令牌验证均实时读取授权投影，旧令牌下一次验证即体现。authorizationVersion 由服务端单调递增，请求不携带。
      operationId: putUserApplicationAuthorization
      security: [ { iamSession: [], csrfToken: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PutApplicationAuthorizationRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/ApplicationAuthorizationDetail' }, '201': { $ref: '#/components/responses/ApplicationAuthorizationDetail' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
    delete:
      summary: 撤销用户应用授权
      description: 语义撤销留痕，token 发放与资源令牌验证立即失效；重复撤销幂等返回 204。
      operationId: revokeUserApplicationAuthorization
      security: [ { iamSession: [], csrfToken: [] } ]
      responses: { '204': { description: 已撤销 }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /iam/admin/users/{userId}/external-identity:
    parameters: [ { $ref: '#/components/parameters/UserId' } ]
    post:
      summary: 绑定外部身份
      description: 将本地用户与外部身份源身份（LDAP DN/uid、OIDC sub）关联；绑定后该用户可经对应外部登录方式登入。该外部身份已被其他用户绑定时返回 400。
      operationId: bindAdminUserExternalIdentity
      security: [ { iamSession: [], csrfToken: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BindExternalIdentityRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/AdminUser' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
    delete:
      summary: 解绑外部身份
      description: 解除用户的外部身份关联；解绑后该外部身份不再映射到本地用户，重复解绑幂等返回 204。
      operationId: unbindAdminUserExternalIdentity
      security: [ { iamSession: [], csrfToken: [] } ]
      responses: { '204': { description: 已解绑 }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /iam/admin/users/{userId}/roles:
    parameters: [ { $ref: '#/components/parameters/UserId' } ]
    get:
      summary: 获取用户直接角色
      operationId: listAdminUserRoles
      responses: { '200': { $ref: '#/components/responses/RoleList' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /iam/admin/users/{userId}/roles/{roleId}:
    parameters: [ { $ref: '#/components/parameters/UserId' }, { $ref: '#/components/parameters/RoleId' } ]
    post:
      summary: 为用户授予角色
      operationId: assignRoleToAdminUser
      security: [ { iamSession: [], csrfToken: [] } ]
      responses: { '200': { description: 已授予 }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
    delete:
      summary: 移除用户角色
      operationId: revokeRoleFromAdminUser
      security: [ { iamSession: [], csrfToken: [] } ]
      responses: { '204': { description: 已移除 }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /iam/admin/departments:
    get:
      summary: 获取全部部门
      operationId: listDepartments
      deprecated: true
      responses: { '200': { $ref: '#/components/responses/DepartmentList' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      summary: 创建部门
      operationId: createDepartment
      security: [ { iamSession: [], csrfToken: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateDepartmentRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/Department' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' } }
  /iam/admin/departments/page:
    get:
      summary: 分页查询部门
      operationId: listDepartmentPage
      parameters: [ { $ref: '#/components/parameters/Status' }, { $ref: '#/components/parameters/Keyword' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Size' } ]
      responses: { '200': { $ref: '#/components/responses/DepartmentPage' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /iam/admin/departments/{departmentId}:
    parameters: [ { $ref: '#/components/parameters/DepartmentId' } ]
    get:
      summary: 获取部门
      operationId: getDepartment
      responses: { '200': { $ref: '#/components/responses/Department' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
    put:
      summary: 更新部门
      operationId: updateDepartment
      security: [ { iamSession: [], csrfToken: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateDepartmentRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Department' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
    delete:
      summary: 删除部门
      operationId: deleteDepartment
      security: [ { iamSession: [], csrfToken: [] } ]
      responses: { '204': { description: 已删除 }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /iam/admin/departments/{departmentId}/roles:
    parameters: [ { $ref: '#/components/parameters/DepartmentId' } ]
    get:
      summary: 查询部门当前挂载的角色
      operationId: listDepartmentRoles
      responses: { '200': { $ref: '#/components/responses/RoleList' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /iam/admin/departments/{departmentId}/roles/{roleId}:
    parameters: [ { $ref: '#/components/parameters/DepartmentId' }, { $ref: '#/components/parameters/RoleId' } ]
    post:
      summary: 给部门挂载角色
      description: 部门下全体成员（个人直接角色之外）自动获得该角色；重复挂载幂等。departmentId 不存在返回 404；roleId 不存在返回 400（与其余角色类接口的 404 语义不一致，属已知历史遗留）。
      operationId: assignDepartmentRole
      security: [ { iamSession: [], csrfToken: [] } ]
      responses: { '200': { description: 已挂载 }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
    delete:
      summary: 撤销部门挂载的角色
      description: 撤销 iam_admin 角色受部门级最后管理员保护：撤销后若系统再无任何 active 状态的有效管理员（个人直接绑定 ∪ 其余部门挂载），返回 409。
      operationId: revokeDepartmentRole
      security: [ { iamSession: [], csrfToken: [] } ]
      responses: { '204': { description: 已撤销 }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /iam/admin/user-groups:
    get:
      summary: 获取全部协作组
      operationId: listUserGroups
      deprecated: true
      responses: { '200': { $ref: '#/components/responses/UserGroupList' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      summary: 创建协作组
      operationId: createUserGroup
      security: [ { iamSession: [], csrfToken: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateUserGroupRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/UserGroup' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' } }
  /iam/admin/user-groups/page:
    get:
      summary: 分页查询协作组
      operationId: listUserGroupPage
      parameters: [ { $ref: '#/components/parameters/Status' }, { $ref: '#/components/parameters/Keyword' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Size' } ]
      responses: { '200': { $ref: '#/components/responses/UserGroupPage' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /iam/admin/user-groups/{groupId}:
    parameters: [ { $ref: '#/components/parameters/GroupId' } ]
    get:
      summary: 获取协作组
      operationId: getUserGroup
      responses: { '200': { $ref: '#/components/responses/UserGroup' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
    put:
      summary: 更新协作组
      operationId: updateUserGroup
      security: [ { iamSession: [], csrfToken: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateUserGroupRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/UserGroup' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
    delete:
      summary: 删除协作组
      operationId: deleteUserGroup
      security: [ { iamSession: [], csrfToken: [] } ]
      responses: { '204': { description: 已删除 }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /iam/admin/user-groups/{groupId}/users:
    parameters: [ { $ref: '#/components/parameters/GroupId' } ]
    get:
      summary: 获取协作组成员
      operationId: listUserGroupUsers
      responses: { '200': { $ref: '#/components/responses/AdminUserList' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /iam/admin/user-groups/{groupId}/users/{userId}:
    parameters: [ { $ref: '#/components/parameters/GroupId' }, { $ref: '#/components/parameters/UserId' } ]
    post:
      summary: 添加协作组成员
      operationId: assignUserGroupUser
      security: [ { iamSession: [], csrfToken: [] } ]
      responses: { '200': { description: 已添加 }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
    delete:
      summary: 移除协作组成员
      operationId: revokeUserGroupUser
      security: [ { iamSession: [], csrfToken: [] } ]
      responses: { '204': { description: 已移除 }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /iam/admin/messages:
    post:
      summary: 发送站内信
      operationId: createAdminMessage
      security: [ { iamSession: [], csrfToken: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateMessageRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/MessageSend' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /iam/admin/messages/page:
    get:
      summary: 分页查询已发送批次（按 send_batch_id 聚合，时间倒序）
      operationId: listMessageBatches
      parameters: [ { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Size' } ]
      responses: { '200': { $ref: '#/components/responses/MessageBatchPage' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /iam/admin/messages/{sendBatchId}:
    parameters: [ { $ref: '#/components/parameters/SendBatchId' } ]
    get:
      summary: 查询批次详情
      operationId: getMessageBatch
      responses: { '200': { $ref: '#/components/responses/MessageBatchDetail' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /iam/admin/messages/{sendBatchId}/recipients:
    parameters: [ { $ref: '#/components/parameters/SendBatchId' } ]
    get:
      summary: 分页查询批次收件人（含已读状态）
      operationId: listMessageBatchRecipients
      parameters: [ { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Size' } ]
      responses: { '200': { $ref: '#/components/responses/MessageBatchRecipientPage' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /iam/admin/roles:
    get:
      summary: 获取全部角色
      operationId: listRoles
      deprecated: true
      responses: { '200': { $ref: '#/components/responses/RoleList' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      summary: 创建角色
      operationId: createRole
      security: [ { iamSession: [], csrfToken: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateRoleRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/Role' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' } }
  /iam/admin/roles/page:
    get:
      summary: 分页查询角色
      operationId: listRolePage
      parameters: [ { $ref: '#/components/parameters/Keyword' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Size' } ]
      responses: { '200': { $ref: '#/components/responses/RolePage' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /iam/admin/roles/{roleId}:
    parameters: [ { $ref: '#/components/parameters/RoleId' } ]
    get:
      summary: 获取角色
      operationId: getRole
      responses: { '200': { $ref: '#/components/responses/Role' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
    put:
      summary: 更新角色
      operationId: updateRole
      security: [ { iamSession: [], csrfToken: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateRoleRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Role' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
    delete:
      summary: 删除角色
      operationId: deleteRole
      security: [ { iamSession: [], csrfToken: [] } ]
      responses: { '204': { description: 已删除 }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /iam/admin/roles/{roleId}/permissions:
    parameters: [ { $ref: '#/components/parameters/RoleId' } ]
    get:
      summary: 获取角色权限
      operationId: listRolePermissions
      responses: { '200': { $ref: '#/components/responses/PermissionList' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /iam/admin/roles/{roleId}/permissions/{permissionId}:
    parameters: [ { $ref: '#/components/parameters/RoleId' }, { $ref: '#/components/parameters/PermissionId' } ]
    post:
      summary: 为角色授予权限
      operationId: assignPermissionToRole
      security: [ { iamSession: [], csrfToken: [] } ]
      responses: { '200': { description: 已授予 }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
    delete:
      summary: 移除角色权限
      operationId: revokePermissionFromRole
      security: [ { iamSession: [], csrfToken: [] } ]
      responses: { '204': { description: 已移除 }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /iam/admin/roles/{roleId}/users/page:
    parameters: [ { $ref: '#/components/parameters/RoleId' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Size' } ]
    get:
      summary: 角色成员分页
      description: 个人直接绑定该角色的用户分页（含部门继承成员的完整视图走用户维度角色来源；此处为直接绑定列表）。
      operationId: listRoleMemberPage
      responses: { '200': { $ref: '#/components/responses/AdminUserPage' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /iam/admin/roles/{roleId}/departments:
    parameters: [ { $ref: '#/components/parameters/RoleId' } ]
    get:
      summary: 反查挂载了该角色的部门
      description: 该角色的成员继承来源，只读展示，不含子部门递归。roleId 不存在返回 400（与部门挂载角色接口的已知历史遗留一致，非 404）。
      operationId: listRoleDepartments
      responses: { '200': { $ref: '#/components/responses/DepartmentList' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /iam/admin/roles/{roleId}/authorization-rules/{applicationId}:
    parameters: [ { $ref: '#/components/parameters/RoleId' }, { $ref: '#/components/parameters/ApplicationId' } ]
    get:
      summary: 获取角色对应用的应用授权规则
      description: 尚未配置规则返回 404，属合法空态，调用方按空规则呈现编辑器。
      operationId: getRoleAuthorizationRule
      responses: { '200': { $ref: '#/components/responses/RoleAuthorizationRule' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
    put:
      summary: 保存角色对应用的应用授权规则
      description: 两个数组必传（可为空数组，缺字段 400）；权限码须在应用权限清单范围内（越界 400）；保存后触发持有该角色全部用户的授权投影重算。
      operationId: putRoleAuthorizationRule
      security: [ { iamSession: [], csrfToken: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PutRoleAuthorizationRuleRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/RoleAuthorizationRule' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
    delete:
      summary: 删除角色对应用的应用授权规则
      description: 幂等，规则不存在也返回 204；删除后触发持有该角色全部用户的授权投影重算。
      operationId: deleteRoleAuthorizationRule
      security: [ { iamSession: [], csrfToken: [] } ]
      responses: { '204': { description: 已删除 }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /iam/admin/permissions:
    get:
      summary: 获取全部权限
      operationId: listPermissions
      deprecated: true
      responses: { '200': { $ref: '#/components/responses/PermissionList' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /iam/admin/permissions/page:
    get:
      summary: 分页查询权限
      operationId: listPermissionPage
      parameters: [ { $ref: '#/components/parameters/Keyword' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Size' } ]
      responses: { '200': { $ref: '#/components/responses/PermissionPage' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /iam/admin/permissions/{permissionId}:
    parameters: [ { $ref: '#/components/parameters/PermissionId' } ]
    get:
      summary: 获取权限
      operationId: getPermission
      responses: { '200': { $ref: '#/components/responses/Permission' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /iam/admin/trusted-applications:
    get:
      summary: 列出可信应用摘要
      operationId: listTrustedApplications
      deprecated: true
      responses: { '200': { $ref: '#/components/responses/TrustedApplicationSummaryList' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      summary: 创建可信应用及必需的初始 OAuth Client
      operationId: createTrustedApplication
      security: [ { iamSession: [], csrfToken: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateTrustedApplicationRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/TrustedApplicationSummary' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' } }
  /iam/admin/trusted-applications/page:
    get:
      summary: 分页查询可信应用
      operationId: listTrustedApplicationPage
      parameters: [ { $ref: '#/components/parameters/Keyword' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Size' } ]
      responses: { '200': { $ref: '#/components/responses/TrustedApplicationSummaryPage' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /iam/admin/trusted-applications/{applicationId}:
    parameters: [ { $ref: '#/components/parameters/ApplicationId' } ]
    get:
      summary: 获取可信应用详情及其全部 Client
      operationId: getTrustedApplication
      responses: { '200': { $ref: '#/components/responses/TrustedApplicationDetail' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
    put:
      summary: 更新可信应用元数据与 Portal 集成
      operationId: updateTrustedApplication
      security: [ { iamSession: [], csrfToken: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateTrustedApplicationRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/TrustedApplicationSummary' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
    delete:
      summary: 删除可信应用及其 Portal 配置、Client、授权记录（内置应用返回 409）
      operationId: deleteTrustedApplication
      security: [ { iamSession: [], csrfToken: [] } ]
      responses: { '204': { description: 已删除 }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { description: 内置应用禁止删除 } }
  /iam/admin/trusted-applications/{applicationId}/clients:
    parameters: [ { $ref: '#/components/parameters/ApplicationId' } ]
    get:
      summary: 列出应用下的 OAuth Client
      operationId: listTrustedApplicationClients
      responses: { '200': { $ref: '#/components/responses/TrustedApplicationClientList' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
    post:
      summary: 创建 OAuth Client
      operationId: createTrustedApplicationClient
      security: [ { iamSession: [], csrfToken: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateTrustedApplicationClientRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/TrustedApplicationClientSecret' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /iam/admin/trusted-applications/{applicationId}/clients/{clientId}:
    parameters: [ { $ref: '#/components/parameters/ApplicationId' }, { $ref: '#/components/parameters/ClientId' } ]
    get:
      summary: 获取 OAuth Client
      operationId: getTrustedApplicationClient
      responses: { '200': { $ref: '#/components/responses/TrustedApplicationClient' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
    put:
      summary: 更新 OAuth Client
      operationId: updateTrustedApplicationClient
      security: [ { iamSession: [], csrfToken: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateTrustedApplicationClientRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/TrustedApplicationClient' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
    delete:
      summary: 删除 OAuth Client
      operationId: deleteTrustedApplicationClient
      security: [ { iamSession: [], csrfToken: [] } ]
      responses: { '204': { description: 已删除 }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /iam/admin/trusted-applications/{applicationId}/permission-manifest:
    parameters: [ { $ref: '#/components/parameters/ApplicationId' } ]
    get:
      summary: 获取应用权限清单
      operationId: getApplicationPermissionManifest
      responses: { '200': { $ref: '#/components/responses/ApplicationPermissionManifest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
    put:
      summary: 登记或全量替换应用权限清单
      operationId: putApplicationPermissionManifest
      security: [ { iamSession: [], csrfToken: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PutApplicationPermissionManifestRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/ApplicationPermissionManifest' }, '201': { $ref: '#/components/responses/ApplicationPermissionManifest' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /iam/admin/trusted-applications/{applicationId}/resource-verification-clients:
    parameters: [ { $ref: '#/components/parameters/ApplicationId' } ]
    get:
      summary: 列出应用下的资源验证客户端
      operationId: listResourceVerificationClients
      responses: { '200': { $ref: '#/components/responses/ResourceVerificationClientList' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
    post:
      summary: 创建资源验证客户端
      description: secret 由服务端生成，仅在创建响应中返回一次。
      operationId: createResourceVerificationClient
      security: [ { iamSession: [], csrfToken: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateResourceVerificationClientRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/ResourceVerificationClientSecret' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /iam/admin/trusted-applications/{applicationId}/resource-verification-clients/{clientId}:
    parameters: [ { $ref: '#/components/parameters/ApplicationId' }, { $ref: '#/components/parameters/ClientId' } ]
    get:
      summary: 获取资源验证客户端
      operationId: getResourceVerificationClient
      responses: { '200': { $ref: '#/components/responses/ResourceVerificationClient' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
    delete:
      summary: 撤销资源验证客户端
      description: 语义撤销，认证立即失效，记录保留供审计；重复撤销幂等返回 204。
      operationId: revokeResourceVerificationClient
      security: [ { iamSession: [], csrfToken: [] } ]
      responses: { '204': { description: 已撤销 }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /iam/admin/trusted-applications/{applicationId}/resource-verification-clients/{clientId}/secret:
    parameters: [ { $ref: '#/components/parameters/ApplicationId' }, { $ref: '#/components/parameters/ClientId' } ]
    post:
      summary: 轮换资源验证客户端密钥
      description: 服务端生成新 secret 整体替换旧值，旧 secret 立即失效；新明文仅本次响应返回。
      operationId: rotateResourceVerificationClientSecret
      security: [ { iamSession: [], csrfToken: [] } ]
      responses: { '200': { $ref: '#/components/responses/ResourceVerificationClientSecret' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /iam/admin/dashboard:
    get:
      summary: 获取管理台仪表盘聚合数据
      description: 治理规模计数与运行状态统计；最近登录列表拆分为独立分页接口 /iam/admin/dashboard/recent-logins。
      operationId: getAdminDashboard
      responses: { '200': { $ref: '#/components/responses/AdminDashboard' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /iam/admin/dashboard/recent-logins:
    get:
      summary: 分页查询最近登录用户
      description: 按 lastLoginAt 倒序，仅含有登录记录的用户。
      operationId: listAdminDashboardRecentLogins
      parameters: [ { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Size' } ]
      responses: { '200': { $ref: '#/components/responses/AdminRecentLoginPage' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /iam/admin/sessions:
    get:
      summary: 分页查询活跃会话
      description: 仅含未过期且未撤销的会话，按最近活跃倒序；双实例共享会话存储时为全局视图。
      operationId: listActiveSessions
      parameters: [ { $ref: '#/components/parameters/UserIdQuery' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Size' } ]
      responses: { '200': { $ref: '#/components/responses/ActiveSessionPage' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /iam/admin/sessions/users/{userId}/revoke:
    parameters: [ { $ref: '#/components/parameters/UserId' } ]
    put:
      summary: 强制下线用户
      description: 撤销该用户全部活跃会话（全部端一并踢出），返回本次撤销数量；用户不存在返回 400。
      operationId: revokeUserSessions
      security: [ { iamSession: [], csrfToken: [] } ]
      responses: { '200': { $ref: '#/components/responses/SessionRevokeResult' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
components:
  securitySchemes:
    iamSession:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: 由 IAM Server 建立的浏览器会话 Cookie。
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-TOKEN
      description: 先调用 /iam/web/auth/csrf 获取实际 headerName 与 token。
  parameters:
    UserId: { name: userId, in: path, required: true, schema: { type: integer, format: int64 } }
    DepartmentId: { name: departmentId, in: path, required: true, schema: { type: integer, format: int64 } }
    DepartmentIdQuery: { name: departmentId, in: query, required: false, schema: { type: integer, format: int64 } }
    GroupId: { name: groupId, in: path, required: true, schema: { type: integer, format: int64 } }
    RoleId: { name: roleId, in: path, required: true, schema: { type: integer, format: int64 } }
    PermissionId: { name: permissionId, in: path, required: true, schema: { type: integer, format: int64 } }
    ApplicationId: { name: applicationId, in: path, required: true, schema: { type: integer, format: int64 } }
    ClientId: { name: clientId, in: path, required: true, schema: { type: string } }
    Status: { name: status, in: query, required: false, schema: { type: integer } }
    Keyword: { name: keyword, in: query, required: false, schema: { type: string } }
    Page: { name: page, in: query, required: false, description: 从 1 开始的页码, schema: { type: integer, minimum: 1, default: 1 } }
    Size: { name: size, in: query, required: false, description: 每页大小，最大 100, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    SendBatchId: { name: sendBatchId, in: path, required: true, schema: { type: string } }
    UserIdQuery: { name: userId, in: query, required: false, schema: { type: integer, format: int64 } }
    LastLoginAfter: { name: lastLoginAfter, in: query, required: false, description: ISO-8601 时刻，筛选最近登录不早于该时刻的用户, schema: { type: string, format: date-time } }
    LockedUntilAfter: { name: lockedUntilAfter, in: query, required: false, description: ISO-8601 时刻，筛选锁定截止晚于该时刻的用户（锁定中）, schema: { type: string, format: date-time } }
    NoDepartment: { name: noDepartment, in: query, required: false, description: 为 true 时筛选未挂部门的用户（仪表盘未挂部门下钻）, schema: { type: boolean, default: false } }
  responses:
    Unauthorized: { description: 未登录或 IAM 会话失效 }
    Forbidden: { description: 无管理员权限 }
    BadRequest: { description: 请求无效 }
    NotFound: { description: 资源不存在 }
    Conflict: { description: 资源状态或唯一约束冲突 }
    AdminUser: { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdminUserResponse' } } } }
    AdminUserList: { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AdminUserResponse' } } } } }
    AdminUserPage: { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdminUserPage' } } } }
    Department: { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DepartmentResponse' } } } }
    DepartmentList: { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/DepartmentResponse' } } } } }
    DepartmentPage: { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DepartmentPage' } } } }
    UserGroup: { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/UserGroupResponse' } } } }
    UserGroupList: { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/UserGroupResponse' } } } } }
    UserGroupPage: { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/UserGroupPage' } } } }
    Role: { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RoleResponse' } } } }
    RoleList: { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/RoleResponse' } } } } }
    RolePage: { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RolePage' } } } }
    Permission: { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PermissionResponse' } } } }
    PermissionList: { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PermissionResponse' } } } } }
    PermissionPage: { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PermissionPage' } } } }
