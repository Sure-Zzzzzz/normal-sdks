    RoleAuthorizationRule: { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RoleAuthorizationRule' } } } }
    MessageSend: { description: 已发送, content: { application/json: { schema: { $ref: '#/components/schemas/MessageSendResponse' } } } }
