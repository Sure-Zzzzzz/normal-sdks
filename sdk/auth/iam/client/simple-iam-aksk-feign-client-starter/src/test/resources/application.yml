# 测试配置：结构与非敏感值直接可跑端到端（Redis Route → smart-cache → AKSK 令牌链 → 底座
# AkskFeignRequestInterceptor → IAM feign client）；仅 AKP 凭据由 gitignored application-local.yml 覆盖。
# 与 RT 线同构，差异仅两点：无 resttemplate 子键（Feign 底座无此装配门）、宿主须 @EnableFeignClients（Runner 内带）。
spring:
  profiles:
    active: local

io:
  github:
    surezzzzzz:
      sdk:
        redis:
          route:
            enable: true
            default-source: default
            sources:
              default:
                mode: standalone
                host: 127.0.0.1
                port: 6379
                database: 0
                timeout-ms: 3000
                connect-timeout-ms: 3000
        auth:
          aksk:
            client:
              enable: true
              server-url: http://127.0.0.1:8280
              token-endpoint: /oauth2/token
              # client-id / client-secret 只从被忽略的 application-local.yml 注入
        cache:
          enabled: true
          key-prefix: sure-auth-aksk-client
          me: iam-client-e2e
          l1:
            enabled: true
          l2:
            enabled: true
        iam:
          client:
            enable: true
            base-url: http://127.0.0.1:8180

logging:
  level:
    io.github.surezzzzzz.sdk.iam: DEBUG
    io.github.surezzzzzz.sdk.auth.aksk: DEBUG
