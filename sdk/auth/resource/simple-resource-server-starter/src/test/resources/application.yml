io:
  github:
    surezzzzzz:
      sdk:
        auth:
          resource:
            server:
              security:
                protected-paths:
                  - /api/**
                permit-all-paths:
                  - /public/**
                api-permission-rules:
                  - path-pattern: /api/configured
                    method: GET
                    api-permission: read
                  - path-pattern: /api/configured
                    method: POST
                    api-permission: write
                  - path-pattern: /api/configuration-priority
                    method: GET
                    api-permission: write
