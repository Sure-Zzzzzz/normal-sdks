spring:
  application:
    name: simple-iam-aksk-collaboration-demo
  datasource:
    url: jdbc:mysql://localhost:3306/iam_aksk_resource?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${RESOURCE_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  address: 127.0.0.1
  port: 8090

io:
  github:
    surezzzzzz:
      sdk:
        auth:
          resource:
            server:
              security:
                protected-paths:
                  - /api/**
                permit-all-paths:
                  - /public/**
          iam:
            resource:
              server:
                verification-endpoint: ${IAM_RESOURCE_VERIFICATION_ENDPOINT:http://localhost:8180/iam/resource/tokens/verify}
                client-id: ${IAM_RESOURCE_CLIENT_ID:}
                client-secret: ${IAM_RESOURCE_CLIENT_SECRET:}
                connect-timeout-millis: 3000
                read-timeout-millis: 5000
          aksk:
            resource:
              server:
                introspect:
                  endpoint: ${AKSK_INTROSPECT_ENDPOINT:http://localhost:8280/oauth2/introspect}
                  client-id: ${AKSK_INTROSPECT_CLIENT_ID:}
                  client-secret: ${AKSK_INTROSPECT_CLIENT_SECRET:}
                  local-cache:
                    enabled: false
                    fallback:
                      enabled: false
