spring:
  datasource:
    url: jdbc:mysql://localhost:3306/iam_aksk_resource_demo_test?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: ${RESOURCE_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

server:
  address: 127.0.0.1
  port: 0

io:
  github:
    surezzzzzz:
      sdk:
        auth:
          resource:
            server:
              security:
                protected-paths:
                  - /api/**
                permit-all-paths:
                  - /public/**
          iam:
            resource:
              server:
                verification-endpoint: http://localhost:8180/iam/resource/tokens/verify
                client-id: demo-test-client
                client-secret: demo-test-secret
                connect-timeout-millis: 3000
                read-timeout-millis: 5000
          aksk:
            resource:
              server:
                introspect:
                  endpoint: http://localhost:8280/oauth2/introspect
                  client-id: demo-test-client
                  client-secret: demo-test-secret
                  local-cache:
                    enabled: false
                    fallback:
                      enabled: false
