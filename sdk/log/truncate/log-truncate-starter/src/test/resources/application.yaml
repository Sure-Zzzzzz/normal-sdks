io:
  github:
    surezzzzzz:
      sdk:
        log:
          truncate:
            max-total-bytes: 2048
            max-field-chars: 200
            max-depth: 5
            ellipsis: "..."
            truncated-note-template: " [truncated {dropped}]"
            depth-exceeded-placeholder: "__depth_exceeded__"

spring:
  application:
    name: log-truncate-test

logging:
  level:
    io.github.surezzzzzz.sdk.log.truncate: DEBUG
