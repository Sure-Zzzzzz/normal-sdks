spring:
  main:
    web-application-type: none
  profiles:
    active: local

io:
  github:
    surezzzzzz:
      sdk:
        mysql:
          route:
            enable: true
            clusters:
              mysql57:
                host: localhost
                port: 24357
                driver-class-name: com.mysql.cj.jdbc.Driver
                connection-properties:
                  useUnicode: true
                  characterEncoding: UTF-8
                  useSSL: false
                  serverTimezone: UTC
                  allowPublicKeyRetrieval: true
                  connectTimeout: 5000
                  socketTimeout: 5000
                datasources:
                  ops:
                    database: test_ops
                    username: mysql57_ops_route
                    password: ${TEST_MYSQL57_OPS_PASSWORD}
                  audit:
                    database: test_audit
                    username: mysql57_audit_route
                    password: ${TEST_MYSQL57_AUDIT_PASSWORD}
              mysql84:
                host: localhost
                port: 24384
                driver-class-name: com.mysql.cj.jdbc.Driver
                connection-properties:
                  useUnicode: true
                  characterEncoding: UTF-8
                  useSSL: false
                  serverTimezone: UTC
                  allowPublicKeyRetrieval: true
                  connectTimeout: 5000
                  socketTimeout: 5000
                datasources:
                  ops:
                    database: test_ops
                    username: mysql84_ops_route
                    password: ${TEST_MYSQL84_OPS_PASSWORD}
                  audit:
                    database: test_audit
                    username: mysql84_audit_route
                    password: ${TEST_MYSQL84_AUDIT_PASSWORD}
            rules:
              - pattern: test_order
                match-type: exact
                datasource-key: mysql57.ops
                priority: 100
              - pattern: test_user
                match-type: exact
                datasource-key: mysql57.audit
                priority: 100
              - pattern: test_wildcard
                match-type: exact
                datasource-key: mysql84.ops
                priority: 100
              - pattern: test_extra_field
                match-type: exact
                datasource-key: mysql84.audit
                priority: 100
