services:
  minio-2023:
    image: minio/minio:RELEASE.2023-12-02T10-51-33Z.hotfix.d45db9b16
    command:
      - "server"
      - "/data"
    ports:
      - "19000:9000"
    environment:
      MINIO_ROOT_USER: e2e-access-a
      MINIO_ROOT_PASSWORD: e2e-secret-a
    volumes:
      - minio-2023-data:/data

  minio-2025:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command:
      - "server"
      - "/data"
    ports:
      - "19001:9000"
    environment:
      MINIO_ROOT_USER: e2e-access-b
      MINIO_ROOT_PASSWORD: e2e-secret-b
    volumes:
      - minio-2025-data:/data

volumes:
  minio-2023-data:
  minio-2025-data:
