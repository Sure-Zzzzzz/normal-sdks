openapi: 3.0.3
info:
  title: Smart KMS API
  version: 2.0.2
  description: KMS 管理端与服务调用方使用的主体、密钥、策略、密码学和销毁契约。
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /api/kms/me:
    get:
      summary: 读取当前 KMS 主体与页面权限
      responses:
        '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/KmsMe' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/kms/me/keys:
    get:
      summary: 分页查询当前主体归属的密钥
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Size' }, { $ref: '#/components/parameters/Owner' } ], { $ref: '#/components/parameters/Alias' }, { $ref: '#/components/parameters/Purpose' }, { $ref: '#/components/parameters/Algorithm' }, { $ref: '#/components/parameters/State' }]
      responses: { '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/KmsKeyPage' } } } } }
  /api/kms/me/keys/{keyRef}:
    get:
      summary: 查询当前主体归属的单个密钥
      parameters: [{ $ref: '#/components/parameters/KeyRef' }]
      responses: { '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/KmsKey' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/kms/me/keys/{keyRef}/public-keys:
    get:
      tags: [self-service]
      summary: 读取本人签名密钥全部可分发公钥
      description: 要求可信 HUMAN 人员身份、kms.read-public-key 和本人归属，不要求 kms.key.read、治理 DATA 或 READ_PUBLIC_KEY 使用策略。仅 SIGN/ES256 的 ACTIVE、DISABLED 密钥及 ACTIVE、RETIRED 版本可分发，按版本升序。SERVICE 或未证明人员身份为 403，他人和不存在的 keyRef 为 404。AES、待销毁或已销毁为 409，材料缺失或持久化状态异常为 503。原公钥及密码学接口仍要求精确使用策略。
      parameters: [{ $ref: '#/components/parameters/KeyRef' }]
      responses:
        '200':
          description: 全部合法可分发版本
          headers: { Cache-Control: { schema: { type: string, enum: [no-store] }, description: 不允许缓存响应 } }
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/KmsPublicKey' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/kms/me/keys/{keyRef}/state:
    patch:
      tags: [self-service]
      summary: 启用或停用本人密钥
      description: 要求 kms.key.manage，归属固定为认证主体本人，不消费 DATA。他人 keyRef 为 404。仅 ACTIVE 与 DISABLED 可互相迁移，待销毁密钥必须走取消销毁。
      parameters: [{ $ref: '#/components/parameters/KeyRef' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MyKeyStateRequest' } } } }
      responses:
        '200': { description: 成功或保留期内幂等重放, content: { application/json: { schema: { $ref: '#/components/schemas/MyKeyWriteResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/kms/me/keys/{keyRef}/versions:
    post:
      tags: [self-service]
      summary: 轮换本人活动密钥
      description: 要求 kms.key.manage，归属固定为认证主体本人，不消费 DATA。只允许 ACTIVE 密钥轮换；响应为更新后的逻辑密钥元数据。同一端点与幂等键在保留期内重放首次响应，新旧路径作用域独立。
      parameters: [{ $ref: '#/components/parameters/KeyRef' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MyKeyVersionRequest' } } } }
      responses:
        '200': { description: 成功或保留期内幂等重放, content: { application/json: { schema: { $ref: '#/components/schemas/MyKeyWriteResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/kms/me/keys/{keyRef}/destruction:
    get:
      tags: [self-service]
      summary: 读取本人密钥销毁明细
      description: 要求 kms.key.read，归属固定为认证主体本人，不消费 DATA，无需销毁权限。未排程或取消后 items 为空。cancelEligible 只表示读取时的业务资格，不包含销毁授权；历史领取后即使释放或租约过期也为 false。任务及密钥来自同一次已提交快照；不可能组合或查询失败为 503，不能伪装成无任务。
      parameters: [{ $ref: '#/components/parameters/KeyRef' }]
      responses:
        '200':
          description: 当前排程及已完成版本的安全快照
          headers: { Cache-Control: { schema: { type: string, enum: [no-store] }, description: 不允许缓存响应 } }
          content: { application/json: { schema: { $ref: '#/components/schemas/KeyDestructionDetails' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    put:
      tags: [self-service]
      summary: 安排本人密钥延迟销毁
      description: 要求 kms.key.destroy，归属固定为认证主体本人，不消费 DATA。按本人销毁窗口政策校验未来时间，规范化为 UTC 毫秒后计算请求摘要。成功后所有未销毁版本进入待销毁；材料由后台任务最终清除。
      parameters: [{ $ref: '#/components/parameters/KeyRef' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MyKeyDestructionRequest' } } } }
      responses:
        '200': { description: 成功或保留期内幂等重放, content: { application/json: { schema: { $ref: '#/components/schemas/MyKeyWriteResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      tags: [self-service]
      summary: 取消本人密钥尚未领取的销毁
      description: 要求 kms.key.destroy，归属固定为认证主体本人，不消费 DATA。全部任务从未被领取才可取消并恢复安排前状态，历史领取过即使租约过期也返回 409。同键重试重放首次 204，空响应。
      parameters: [{ $ref: '#/components/parameters/KeyRef' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MyKeyVersionRequest' } } } }
      responses:
        '204': { description: 已取消或保留期内幂等重放，无响应体 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/kms/admin/policies:
    get:
      summary: 分页查询当前 DataPlan 范围内的跨钥策略
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Size' }, { $ref: '#/components/parameters/Alias' }, { name: principalId, in: query, schema: { type: string, maxLength: 128 } }, { name: operation, in: query, schema: { type: string, enum: [SIGN, VERIFY, ENCRYPT, DECRYPT, READ_PUBLIC_KEY] } }]
      responses: { '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/AdminPolicyPage' } } } }, '403': { $ref: '#/components/responses/Forbidden' } }
  /api/kms/admin/keys:
    get:
      summary: 分页查询当前 DataPlan 范围内的密钥
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Size' }, { $ref: '#/components/parameters/Alias' }, { $ref: '#/components/parameters/Purpose' }, { $ref: '#/components/parameters/Algorithm' }, { $ref: '#/components/parameters/State' }, { $ref: '#/components/parameters/Owner' }]
      responses: { '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/KmsKeyPage' } } } }, '403': { $ref: '#/components/responses/Forbidden' } }
  /api/kms/admin/keys/{keyRef}:
    get:
      summary: 查询当前 DataPlan 范围内的单个密钥
      parameters: [{ $ref: '#/components/parameters/KeyRef' }]
      responses: { '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/KmsKey' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/kms/admin/keys/{keyRef}/destruction:
    get:
      summary: 读取治理范围内密钥销毁明细
      description: 要求 kms.key.read 和完整 kms-key read DATA，先在授权归属范围内确定密钥再读取安全任务快照。范围外或不存在的目标统一 404，拒绝 DATA 计划为 403。取消须另行通过原治理命令检查 destroy DATA，读取资格不代替授权。快照、历史领取与故障行为同本人销毁明细。
      parameters: [{ $ref: '#/components/parameters/KeyRef' }]
      responses:
        '200':
          description: 授权目标的当前排程及已完成版本快照
          headers: { Cache-Control: { schema: { type: string, enum: [no-store] }, description: 不允许缓存响应 } }
          content: { application/json: { schema: { $ref: '#/components/schemas/KeyDestructionDetails' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/kms/keys:
    get:
      summary: 兼容查询当前主体归属的密钥
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Size' }, { $ref: '#/components/parameters/Alias' }, { $ref: '#/components/parameters/Purpose' }, { $ref: '#/components/parameters/Algorithm' }, { $ref: '#/components/parameters/State' }, { $ref: '#/components/parameters/Owner' }]
      responses: { '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/KmsKeyPage' } } } } }
    post:
      summary: 创建归属当前主体的逻辑密钥
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateKey' } } } }
      responses: { '201': { description: 已创建, content: { application/json: { schema: { $ref: '#/components/schemas/KmsKey' } } } }, '403': { $ref: '#/components/responses/Forbidden' } }
  /api/kms/keys/{keyRef}:
    get:
      summary: 兼容查询当前主体归属的单个密钥
      parameters: [{ $ref: '#/components/parameters/KeyRef' }]
      responses: { '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/KmsKey' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/kms/keys/{keyRef}/state:
    patch:
      summary: 修改治理范围内逻辑密钥启停状态
      description: 要求 kms.key.manage 及覆盖目标归属的 kms-key manage DATA；仅 ACTIVE 与 DISABLED 可互相迁移，待销毁或已销毁密钥为 409，其他目标状态为 400。
      parameters: [{ $ref: '#/components/parameters/KeyRef' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExpectedVersionState' } } } }
      responses: { '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/KmsKey' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/kms/keys/{keyRef}/versions:
    post:
      summary: 轮换逻辑密钥版本
      parameters: [{ $ref: '#/components/parameters/KeyRef' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExpectedVersion' } } } }
      responses: { '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/KmsKey' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/kms/keys/{keyRef}/destruction:
    put:
      summary: 安排延迟销毁
      parameters: [{ $ref: '#/components/parameters/KeyRef' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ScheduleDestruction' } } } }
      responses: { '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/KmsKey' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
    delete:
      summary: 取消延迟销毁
      parameters: [{ $ref: '#/components/parameters/KeyRef' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExpectedVersion' } } } }
      responses: { '204': { description: 已取消 }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/kms/keys/{keyRef}/public-key:
    get:
      summary: 读取一个可分发的 ES256 公钥
      parameters: [{ $ref: '#/components/parameters/KeyRef' }, { name: version, in: query, schema: { type: integer, minimum: 1 } }]
      responses: { '200': { description: 成功, headers: { Cache-Control: { schema: { type: string, example: no-store } } }, content: { application/json: { schema: { $ref: '#/components/schemas/KmsPublicKey' } } } } }
  /api/kms/keys/{keyRef}/public-keys:
    get:
      summary: 列出当前逻辑密钥全部可分发的 ES256 公钥
      parameters: [{ $ref: '#/components/parameters/KeyRef' }]
      responses: { '200': { description: 成功, headers: { Cache-Control: { schema: { type: string, example: no-store } } }, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/KmsPublicKey' } } } } } }
  /api/kms/keys/{keyRef}/policies:
    get:
      summary: 查询密钥的精确 allow-only 策略
      parameters: [{ $ref: '#/components/parameters/KeyRef' }]
      responses: { '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/KmsPolicyList' } } } } }
    post:
      summary: 创建精确 allow-only 策略
      parameters: [{ $ref: '#/components/parameters/KeyRef' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreatePolicy' } } } }
      responses: { '201': { description: 已创建, content: { application/json: { schema: { $ref: '#/components/schemas/KmsPolicy' } } } } }
  /api/kms/keys/{keyRef}/policies/{policyId}:
    delete:
      summary: 撤销精确策略
      parameters: [{ $ref: '#/components/parameters/KeyRef' }, { $ref: '#/components/parameters/PolicyId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExpectedVersion' } } } }
      responses: { '204': { description: 已撤销 }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/kms/crypto/signatures:
    post:
      summary: 使用 ES256 密钥签名
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SignRequest' } } } }
      responses: { '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/SignatureResult' } } } } }
  /api/kms/crypto/verifications:
    post:
      summary: 验证 ES256 签名
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VerifyRequest' } } } }
      responses: { '200': { description: 成功，签名不匹配时 valid 为 false, content: { application/json: { schema: { $ref: '#/components/schemas/VerificationResult' } } } } }
  /api/kms/crypto/envelopes:
    post:
      summary: 使用 AES-256-GCM 密钥加密
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EncryptRequest' } } } }
      responses: { '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeResult' } } } } }
  /api/kms/crypto/decryptions:
    post:
      summary: 使用 AES-256-GCM 密钥解密
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DecryptRequest' } } } }
      responses: { '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/PlaintextResult' } } } } }
  /api/kms/destruction-jobs:
    get:
      summary: 分页查询当前 DataPlan 范围内的销毁任务
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Size' }]
      responses: { '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/DestructionPage' } } } } }
  /api/kms/me/destruction-policy:
    get:
      tags: [self-service]
      summary: 读取当前 owner 的销毁窗口政策
      responses: { '200': { description: 政策快照, content: { application/json: { schema: { $ref: '#/components/schemas/OwnerDestructionPolicy' } } } } }
    put:
      tags: [self-service]
      summary: 写当前 owner 的销毁窗口政策（幂等 upsert + 审计；两侧空 = 不限制）
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/SaveOwnerDestructionPolicy' } } } }
      responses: { '200': { description: 写入后的政策快照, content: { application/json: { schema: { $ref: '#/components/schemas/OwnerDestructionPolicy' } } } } }
  /api/kms/admin/owners/{ownerPrincipalId}/destruction-policy:
    get:
      tags: [governance]
      summary: 治理面只读 DataPlan 范围内 owner 的销毁窗口政策
      parameters: [{ name: ownerPrincipalId, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: 政策快照, content: { application/json: { schema: { $ref: '#/components/schemas/OwnerDestructionPolicy' } } } } }

  /api/kms/destruction-worker/health:
    get:
      summary: 查询当前 worker 健康事实
      responses: { '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/WorkerHealth' } } } } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  responses:
    BadRequest: { description: 请求字段、类型、必填头或销毁窗口不合法, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    MethodNotAllowed: { description: 资源不支持该方法, headers: { Allow: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    UnsupportedMediaType: { description: 请求媒体类型必须为 application/json, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    ServiceUnavailable: { description: 服务或持久化暂不可用, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Unauthorized: { description: 未认证（Bearer 缺失/无效）, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Forbidden: { description: 无权限（API 码缺失、DATA 拒绝或 key policy 拒绝）, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: 资源不存在或不可见（跨 owner keyRef 一律 404）, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Conflict: { description: 资源已被并发修改或当前状态不允许操作, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  parameters:
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    Size: { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    Alias: { name: alias, in: query, schema: { type: string } }
    Purpose: { name: purpose, in: query, schema: { type: string, enum: [SIGN, ENCRYPT] } }
    Algorithm: { name: algorithm, in: query, schema: { type: string, enum: [ES256, AES_256_GCM] } }
    State: { name: state, in: query, schema: { type: string, enum: [ACTIVE, DISABLED, PENDING_DESTRUCTION, DESTROYED] } }
    Owner: { name: ownerPrincipalId, in: query, schema: { type: string, minLength: 1, maxLength: 64 }, description: 精确归属主体，仅在已验证 DataPlan 范围内收窄 }
    KeyRef: { name: keyRef, in: path, required: true, schema: { type: string } }
    PolicyId: { name: policyId, in: path, required: true, schema: { type: string } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
  schemas:
    Error: { type: object, required: [message, timestamp], properties: { message: { type: string }, timestamp: { type: string, format: date-time }, requestId: { type: string, description: 服务端安全请求标识，可用于日志关联 } } }
    KmsMe:
      type: object
      required: [principalId, subjectType, scopes, pagePermissions]
      properties:
        principalId: { type: string }
        subjectType: { type: string, enum: [HUMAN, SERVICE] }
        scopes: { type: array, items: { type: string } }
        pagePermissions: { type: array, items: { type: string } }
    KmsKey:
      type: object
      required: [keyRef, keyAlias, purpose, algorithm, state, rowVersion, createdAt, updatedAt]
      properties:
        ownerPrincipalId: { type: string, description: 仅管理员范围查询返回 }
        ownerDisplayName: { type: string, nullable: true, description: 仅管理员范围查询返回；宿主未提供目录解析时为空 }
        keyRef: { type: string }
        keyAlias: { type: string }
        purpose: { type: string, enum: [SIGN, ENCRYPT] }
        algorithm: { type: string, enum: [ES256, AES_256_GCM] }
        state: { type: string, enum: [ACTIVE, DISABLED, PENDING_DESTRUCTION, DESTROYED] }
        activeVersion: { type: integer, nullable: true }
        rowVersion: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    KmsKeyPage:
      type: object
      required: [items, page, size, total]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/KmsKey' } }, page: { type: integer }, size: { type: integer }, total: { type: integer, format: int64 } }
    MyKeyWriteResponse:
      type: object
      additionalProperties: false
      required: [keyRef, keyAlias, purpose, algorithm, state, activeVersion, rowVersion, createdAt, updatedAt]
      properties:
        keyRef: { type: string }
        keyAlias: { type: string }
        purpose: { type: string, enum: [SIGN, ENCRYPT] }
        algorithm: { type: string, enum: [ES256, AES_256_GCM] }
        state: { type: string, enum: [ACTIVE, DISABLED, PENDING_DESTRUCTION, DESTROYED] }
        activeVersion: { type: integer, minimum: 1, nullable: true }
        rowVersion: { type: integer, format: int64, minimum: 0 }
        createdAt: { type: string, format: date-time, description: UTC RFC 3339 三位毫秒字符串 }
        updatedAt: { type: string, format: date-time, description: UTC RFC 3339 三位毫秒字符串 }
    MyKeyVersionRequest:
      type: object
      additionalProperties: false
      required: [expectedRowVersion]
      properties: { expectedRowVersion: { type: integer, format: int64, minimum: 0, description: 非负整数，不接受数字字符串或小数 } }
    MyKeyStateRequest:
      type: object
      additionalProperties: false
      required: [state, expectedRowVersion]
      properties: { state: { type: string, enum: [ACTIVE, DISABLED] }, expectedRowVersion: { type: integer, format: int64, minimum: 0 } }
    MyKeyDestructionRequest:
      type: object
      additionalProperties: false
      required: [dueAt, expectedRowVersion]
      properties: { dueAt: { type: string, format: date-time, description: 带时区的未来 RFC 3339 时间，输入与 UTC 年份均为 1 至 9999，规范化为 UTC 毫秒 }, expectedRowVersion: { type: integer, format: int64, minimum: 0 } }
    CreateKey:
      type: object
      required: [keyAlias, purpose, algorithm]
      properties: { keyAlias: { type: string }, purpose: { type: string, enum: [SIGN, ENCRYPT] }, algorithm: { type: string, enum: [ES256, AES_256_GCM] } }
    ExpectedVersion: { type: object, required: [expectedRowVersion], properties: { expectedRowVersion: { type: integer, format: int64, minimum: 0 } } }
    ExpectedVersionState: { allOf: [{ $ref: '#/components/schemas/ExpectedVersion' }], type: object, required: [state], properties: { state: { type: string, enum: [ACTIVE, DISABLED] } } }
    OwnerDestructionPolicy: { type: object, required: [ownerPrincipalId, exists], properties: { ownerPrincipalId: { type: string }, exists: { type: boolean }, minScheduleAheadSeconds: { type: integer, format: int64, nullable: true }, maxScheduleAheadSeconds: { type: integer, format: int64, nullable: true }, rowVersion: { type: integer, format: int64 } } }
    SaveOwnerDestructionPolicy: { type: object, properties: { minScheduleAheadSeconds: { type: integer, format: int64, nullable: true, description: 最短提前量秒数，空=不设下限 }, maxScheduleAheadSeconds: { type: integer, format: int64, nullable: true, description: 最长提前量秒数，空=不设上限 } } }
    ScheduleDestruction: { allOf: [{ $ref: '#/components/schemas/ExpectedVersion' }], type: object, required: [dueAt], properties: { dueAt: { type: string, format: date-time } } }
    CreatePolicy:
      type: object
      required: [principalId, operation]
      properties: { principalId: { type: string }, keyVersion: { type: integer, minimum: 1, nullable: true }, operation: { type: string, enum: [SIGN, VERIFY, ENCRYPT, DECRYPT, READ_PUBLIC_KEY] }, expiresAt: { type: string, format: date-time, nullable: true } }
    AdminPolicyPage: { type: object, required: [items, page, size, total], properties: { items: { type: array, items: { $ref: '#/components/schemas/AdminPolicySummary' } }, page: { type: integer }, size: { type: integer }, total: { type: integer, format: int64 } } }
    AdminPolicySummary: { type: object, required: [policyId, keyRef, keyAlias, ownerPrincipalId, principalId, operation, rowVersion, createdAt], properties: { policyId: { type: string }, keyRef: { type: string }, keyAlias: { type: string }, ownerPrincipalId: { type: string }, ownerDisplayName: { type: string, nullable: true, description: 可选显示名，宿主未提供目录解析时为空 }, principalId: { type: string }, principalDisplayName: { type: string, nullable: true, description: 可选显示名，宿主未提供目录解析时为空 }, keyVersion: { type: integer, minimum: 1, nullable: true, description: 为空表示全部版本含后续轮换 }, operation: { type: string }, expiresAt: { type: string, format: date-time, nullable: true }, rowVersion: { type: integer, format: int64 }, createdAt: { type: string, format: date-time } } }
    KmsPolicy: { type: object, properties: { policyId: { type: string }, keyRef: { type: string }, principalId: { type: string }, principalDisplayName: { type: string, nullable: true, description: 可选显示名，宿主未提供目录解析时为空 }, keyVersion: { type: integer, nullable: true }, operation: { type: string }, expiresAt: { type: string, format: date-time, nullable: true }, rowVersion: { type: integer, format: int64 } } }
    KmsPolicyList: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/KmsPolicy' } } } }
    KmsPublicKey: { type: object, additionalProperties: false, required: [keyRef, version, algorithm, state, publicKey], properties: { keyRef: { type: string }, version: { type: integer, minimum: 1 }, algorithm: { type: string, enum: [ES256] }, state: { type: string, enum: [ACTIVE, RETIRED] }, publicKey: { type: string, description: 无填充 Base64url 编码的 X.509 SPKI DER 公钥材料 } } }
    KeyDestructionDetails:
      type: object
      additionalProperties: false
      required: [keyRef, keyState, rowVersion, cancelEligible, items]
      properties:
        keyRef: { type: string }
        keyState: { type: string, enum: [ACTIVE, DISABLED, PENDING_DESTRUCTION, DESTROYED] }
        rowVersion: { type: integer, format: int64, minimum: 0, description: 密钥修改版本，与密钥详情配对使用 }
        cancelEligible: { type: boolean, description: 读取时全部任务从未领取且可恢复的业务资格，不包含调用者的销毁授权；提交时仍会复核 }
        items: { type: array, description: 当前排程及已完成版本，按 keyVersion 升序；未排程或取消后为空，不代表历次取消审计, items: { $ref: '#/components/schemas/KeyDestructionItem' } }
    KeyDestructionItem:
      type: object
      additionalProperties: false
      required: [keyVersion, state, dueAt, completedAt]
      properties:
        keyVersion: { type: integer, minimum: 1 }
        state: { type: string, enum: [PENDING, CLAIMED, COMPLETED] }
        dueAt: { type: string, format: date-time, description: UTC 三位毫秒的最早允许开始时间，不等于实际完成时间 }
        completedAt: { type: string, format: date-time, nullable: true, description: 实际完成的 UTC 三位毫秒时间，未完成为 null }
    SignRequest: { type: object, required: [keyRef, input], properties: { keyRef: { type: string }, version: { type: integer, minimum: 1, nullable: true }, input: { type: string, description: Base64url 编码的待签名数据 } } }
    SignatureResult: { type: object, required: [keyRef, version, signature], properties: { keyRef: { type: string }, version: { type: integer }, signature: { type: string, description: Base64url 编码的 ES256 签名 } } }
    VerifyRequest: { type: object, required: [keyRef, input, signature], properties: { keyRef: { type: string }, version: { type: integer, minimum: 1, nullable: true }, input: { type: string, description: Base64url 编码的原始数据 }, signature: { type: string, description: Base64url 编码的 ES256 签名 } } }
    VerificationResult: { type: object, required: [valid], properties: { valid: { type: boolean } } }
    EncryptRequest: { type: object, required: [keyRef, plaintext], properties: { keyRef: { type: string }, plaintext: { type: string, description: Base64url 编码的明文 }, aad: { type: string, nullable: true, description: Base64url 编码的附加认证数据 } } }
    EnvelopeResult: { type: object, required: [envelope], properties: { envelope: { type: string, description: Base64url 编码的 AES-GCM 密文封装 } } }
    DecryptRequest: { type: object, required: [envelope], properties: { envelope: { type: string, description: Base64url 编码的 AES-GCM 密文封装 }, aad: { type: string, nullable: true, description: Base64url 编码的附加认证数据 } } }
    PlaintextResult: { type: object, required: [plaintext], properties: { plaintext: { type: string, description: Base64url 编码的明文 } } }
    DestructionJob: { type: object, properties: { ownerPrincipalId: { type: string }, ownerDisplayName: { type: string, nullable: true, description: 可选显示名，宿主未提供目录解析时为空 }, keyRef: { type: string }, keyVersion: { type: integer }, state: { type: string, enum: [PENDING, CLAIMED, COMPLETED] }, dueAt: { type: string, format: date-time }, claimUntil: { type: string, format: date-time, nullable: true }, attemptCount: { type: integer }, completedAt: { type: string, format: date-time, nullable: true } } }
    DestructionPage: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/DestructionJob' } }, page: { type: integer }, size: { type: integer }, total: { type: integer, format: int64 } } }
    WorkerHealth: { type: object, properties: { running: { type: boolean }, instanceId: { type: string, nullable: true }, claimable: { type: boolean }, lastSuccessfulScanAt: { type: string, format: date-time, nullable: true }, consecutiveFailureCount: { type: integer }, oldestOverdueDelayMillis: { type: integer, format: int64, nullable: true } } }
