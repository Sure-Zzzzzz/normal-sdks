dependencies {
    // AKSK 令牌链适配（可选装配：宿主引入 aksk client starter 且存在 TokenManager 时生效）
    // 联调期源码引用（aksk client 新版未发布、jakarta 线在途；收口时切精确坐标并对齐已发版本）
    compileOnly project(':sdk:auth:aksk:client:simple-aksk-client-core')
    testImplementation project(':sdk:auth:aksk:client:simple-aksk-client-core')
    compileOnly 'org.springframework.boot:spring-boot-autoconfigure'
    compileOnly 'org.springframework.boot:spring-boot-configuration-processor'
    compileOnly 'org.springframework.boot:spring-boot-starter-web'
    compileOnly 'org.apache.httpcomponents:httpclient'
    compileOnly 'com.fasterxml.jackson.core:jackson-databind'
    compileOnly 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.apache.httpcomponents:httpclient:4.5.13'
    testImplementation 'org.springframework.boot:spring-boot-starter-log4j2'
}

// gitignored 本地凭据文件不得进入测试资源产物
sourceSets {
    test {
        resources.exclude 'application-local.yml'
    }
}
