dependencies {
    api 'io.github.sure-zzzzzz:smart-kms-core:2.0.0'
    // 聚散原则：主源码只编译依赖协议层 core（认证桥翻译的上下文类型、三权注解与模型）；
    // 协作装配件（resource/iam/aksk 三 starter）由宿主按需自引——
    // 引即全链协作，不引则自备 KmsPrincipalResolver（桥 @ConditionalOnClass 自动让位）。
    // 两条协议依赖即最小集：mvc-starter 的 api 链顺带导出 data-permission-core 与
    // resource-server-core（认证桥的上下文类型），authorization-core 的 api 链亦带 data-permission-core
    implementation 'io.github.sure-zzzzzz:simple-application-authorization-core:1.0.1'
    implementation 'io.github.sure-zzzzzz:simple-data-permission-spring-mvc-starter:1.0.1'
    // 数据源路由为部署契约（配置即 simple.mysql.route 形态，平台约定），随 starter 发布
    implementation 'io.github.sure-zzzzzz:simple-mysql-route-starter:1.1.1'

    compileOnly 'org.springframework.boot:spring-boot-autoconfigure'
    compileOnly 'org.springframework.boot:spring-boot-starter-web'
    compileOnly 'org.springframework.boot:spring-boot-starter-jdbc'
    compileOnly 'org.springframework.boot:spring-boot-starter-security'
    compileOnly 'org.springframework.boot:spring-boot-configuration-processor'
    compileOnly 'org.springframework.boot:spring-boot-starter-validation'

    runtimeOnly 'mysql:mysql-connector-java:8.0.33'

    testImplementation 'org.apache.logging.log4j:log4j-core'
    testImplementation 'org.apache.httpcomponents:httpclient'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework.boot:spring-boot-starter-jdbc'
    testImplementation 'org.springframework.boot:spring-boot-starter-security'
    testImplementation 'org.springframework.boot:spring-boot-starter-log4j2'
    testImplementation 'org.springframework.security:spring-security-test'
    // 走查宿主（walkthrough 包）组合 AKSK 适配器需要 oauth2-resource-server
    // （适配器 compileOnly 口径，宿主自备——与部署方引入 starter 时的义务一致）
    testImplementation 'org.springframework.security:spring-security-oauth2-resource-server'
    // 走查宿主与集成测试的组合装配件（协作全链 + 数据源路由；不随 POM 发布）
    testImplementation 'io.github.sure-zzzzzz:simple-resource-server-starter:1.1.1'
    testImplementation 'io.github.sure-zzzzzz:simple-iam-resource-server-starter:1.0.0'
    testImplementation 'io.github.sure-zzzzzz:simple-aksk-resource-server-starter:3.1.0'
}

// 日常 test 恒排除协作验收（外部三终端）；协作起服与验收任务由本地 init 脚本提供，故意不入库。
// 本机凭据在 gitignored 的 src/test/resources/application-local.yml（存在即生效），
// 无该文件的机器经 SMART_KMS_TEST_JDBC_PASSWORD 环境变量注入。
tasks.test {
    useJUnitPlatform {
        excludeTags 'collaboration'
    }
}
