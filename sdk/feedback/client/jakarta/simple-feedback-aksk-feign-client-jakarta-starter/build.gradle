def jakartaCloudVersion = rootProject.findProperty('jakartaCloudVersion') ?: '2024.0.0'
def jakartaOpenFeignVersion = rootProject.findProperty('jakartaOpenFeignVersion') ?: '4.2.0'

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${jakartaCloudVersion}"
    }
}

configurations.configureEach {
    resolutionStrategy.force "org.springframework.cloud:spring-cloud-starter-openfeign:${jakartaOpenFeignVersion}"
}

dependencies {
    api 'io.github.sure-zzzzzz:simple-feedback-client-core:1.0.1'
    implementation 'io.github.sure-zzzzzz:simple-aksk-feign-redis-client-jakarta-starter:1.0.0'
    compileOnly 'org.springframework.cloud:spring-cloud-starter-openfeign'
    compileOnly 'org.springframework.boot:spring-boot-autoconfigure'
    compileOnly 'org.springframework.boot:spring-boot-configuration-processor'
    compileOnly 'org.springframework.boot:spring-boot-starter-web'
    compileOnly 'com.fasterxml.jackson.core:jackson-databind'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework.boot:spring-boot-starter-aop'
    testImplementation 'org.springframework.boot:spring-boot-starter-log4j2'
    testImplementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    testImplementation 'io.github.openfeign:feign-hc5:13.5'
    testImplementation 'io.github.openfeign:feign-jackson:13.5'
    testImplementation 'io.github.sure-zzzzzz:simple-aksk-client-core-jakarta:1.0.0'
    testRuntimeOnly 'org.apache.commons:commons-pool2'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
