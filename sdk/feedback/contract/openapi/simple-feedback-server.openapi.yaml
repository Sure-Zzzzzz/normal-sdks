openapi: 3.0.3
info:
  title: Simple Feedback Server API
  version: 1.0.0
  description: |
    通用产品反馈服务公开契约（人员通道，Bearer PKCE 人员令牌）。
    认证：全部端点要求 `Authorization: Bearer <人员令牌>`；受保护路径 /api/feedback/**。
    时间：ISO-8601 带 offset；枚举：稳定 code（submitted/resolved/dismissed、bug/feature/experience/other、proactive/intercepted）。
    错误体：`{"message","timestamp","correlationId"}`，状态码即语义（401/403 由资源层，400 校验，404 安全不存在，409 状态与幂等冲突，413/415 附件，429 频控，503 依赖故障）。
servers:
  - url: '{apiBase}'
    variables:
      apiBase:
        default: /api/feedback
paths:
  /submissions:
    post:
      summary: 提交反馈（multipart）
      description: '必需头：Idempotency-Key（表单会话级；失败重试复用同键，成功才轮换）。摘要覆盖主体字段+contextPath+附件元数据清单；并发同键由唯一键收敛为重放或 409。首成功响应快照随行持久化，重放返回与首成功完全一致。'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [submission]
              properties:
                submission:
                  type: object
                  required: [applicationCode, kind, type, score, content]
                  properties:
                    applicationCode: { type: string, example: vuln-scanner }
                    kind: { type: string, enum: [proactive, intercepted] }
                    type: { type: string, enum: [bug, feature, experience, other] }
                    score: { type: integer, minimum: 1, maximum: 10 }
                    content: { type: string, maxLength: 2000 }
                    contactEmail: { type: string, maxLength: 254, nullable: true }
                    contextPath: { type: string, maxLength: 500, nullable: true }
                    environment: { type: string, nullable: true, description: 'JSON 原文；键白名单 ua/viewport/theme/locale，多余键服务端丢弃' }
                attachments:
                  type: array
                  maxItems: 3
                  description: 'jpg/png/webp；单件与总量上限、开关均取服务端运行配置'
                  items: { type: string, format: binary }
      responses:
        '201': { description: 创建成功（重放同键返回同一 id 与首成功快照；Location 指向 /submissions/{id}） }
        '400': { description: 校验失败/目标应用未登记或停用/附件未开放 }
        '413': { description: 附件大小或请求体超限 }
        '415': { description: 附件媒体类型不支持 }
        '429': { description: 提交频控（同 owner 双档计数窗） }
    get:
      summary: 管理列表（筛选+分页）
      description: DATA application 范围进 SQL；受限空集返回空列表而非 403；page.maxSize 生效（超限截断）。
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: application, schema: { type: string } }
        - { in: query, name: status, schema: { type: string, enum: [submitted, resolved, dismissed] } }
        - { in: query, name: type, schema: { type: string, enum: [bug, feature, experience, other] } }
        - { in: query, name: kind, schema: { type: string, enum: [proactive, intercepted] } }
        - { in: query, name: score, schema: { type: integer } }
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: size, schema: { type: integer, default: 20 } }
      responses:
        '200': { description: 分页结果（固定排序 createdTime DESC） }
  /submissions/{id}:
    get:
      summary: 管理详情（DATA 范围外=安全 404）
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      responses:
        '200': { description: 管理形态（含处理留痕与提交人快照） }
        '404': { description: 不存在或范围外 }
  /submissions/{id}/handling:
    put:
      summary: 处理反馈（状态迁移+覆盖式留痕）
      description: '行版本 CAS：expectedRowVersion 不匹配=409。合法迁移：submitted→resolved/dismissed、resolved/dismissed→submitted（重开）；终态间直迁与自迁移 409。reply 非空时记录答复人与时间。DATA 范围条件进 UPDATE。'
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetStatus, expectedRowVersion]
              properties:
                targetStatus: { type: string, enum: [submitted, resolved, dismissed] }
                handlerNote: { type: string, maxLength: 1000, nullable: true, description: 内部备注（整体覆盖，提交人不可见） }
                reply: { type: string, maxLength: 1000, nullable: true, description: 给提交人的答复 }
                expectedRowVersion: { type: integer }
      responses:
        '200': { description: 处理后详情（行版本+1） }
        '404': { description: 不存在或范围外 }
        '409': { description: 版本冲突或非法迁移 }
  /submissions/{id}/attachments/{attachmentId}:
    get:
      summary: 管理附件下载（服务端代理流）
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: attachmentId, required: true, schema: { type: string } }
      responses:
        '200': { description: 附件流（Content-Disposition 原名） }
        '404': { description: 主体或附件不存在/范围外 }
  /my-submissions:
    get:
      summary: 我的反馈列表（owner 等值，无 DATA 投影）
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: size, schema: { type: integer, default: 20 } }
      responses:
        '200': { description: 分页（mine 形态：不含处理人与内部备注） }
  /my-submissions/{id}:
    get:
      summary: 我的反馈详情（含 reply；非本人=404）
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      responses:
        '200': { description: mine 形态详情 }
        '404': { description: 不存在或非本人 }
  /my-submissions/{id}/attachments/{attachmentId}:
    get:
      summary: 我的附件下载（owner 等值）
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: attachmentId, required: true, schema: { type: string } }
      responses:
        '200': { description: 附件流 }
        '404': { description: 不存在或非本人 }
  /submission-hints:
    get:
      summary: 提交提示（交集后应用详情清单+邮箱预填）
      description: 便利性过滤非安全边界；交集为空/取数点降级均回退注册表启用项全量。
        应用展示名来源（修正㉓）：聚形态命中路径取 IAM 页面准入详情（与门户侧边栏同源），
        降级/回退路径取注册表展示名；编码为唯一稳定锚。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 提示
          content:
            application/json:
              schema:
                type: object
                properties:
                  applications:
                    type: array
                    items:
                      type: object
                      properties:
                        applicationCode: { type: string }
                        displayName: { type: string, nullable: true }
                        description: { type: string, nullable: true }
                  contactEmail: { type: string, nullable: true }
  /selectable-applications:
    get:
      summary: 可选应用列表（启用中注册项全量）
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: '精简列表：applicationCode/displayName/description' }
  /applications:
    get:
      summary: 注册表列表（管理；DATA 进 SQL；修正㉔行级 source 数据来源）
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: '全量（受限范围外不出现）；行含 source：IAM=与 IAM 可信应用同编码（展示名 IAM 承担）/MANUAL=本表登记/UNKNOWN=目录不可核对（散形态或出站失败，全字段可编辑）' }
    post:
      summary: 登记应用（受限范围外目标编码=403；唯一键天然幂等；编码命中 IAM 目录时展示名自动抄录 IAM 官方名=修正㉔）
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [applicationCode, displayName]
              properties:
                applicationCode: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}[a-z0-9]$', description: 创建后不可变 }
                displayName: { type: string, maxLength: 64 }
                description: { type: string, maxLength: 200, nullable: true }
                enabled: { type: boolean, default: true }
                ownerGroup: { type: string, maxLength: 64, nullable: true }
      responses:
        '201': { description: '创建成功（同源行 displayName 为抄录后的 IAM 官方名）' }
        '403': { description: 无 DATA 授权或目标编码在受限范围外 }
        '409': { description: 编码已登记 }
  /applications/{applicationCode}:
    put:
      summary: 更新注册项（行版本 CAS；编码不可变；同源行展示名锁定=修正㉔）
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: applicationCode, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRowVersion]
              properties:
                displayName: { type: string, maxLength: 64 }
                description: { type: string, maxLength: 200, nullable: true }
                enabled: { type: boolean }
                ownerGroup: { type: string, maxLength: 64, nullable: true }
                expectedRowVersion: { type: integer }
                syncFromIam: { type: boolean, description: '显式从 IAM 目录重同步展示名（仅同源行生效；目录不可核对时忽略）' }
      responses:
        '200': { description: 更新后注册项 }
        '404': { description: 不存在或范围外 }
        '409': { description: '版本冲突；或 SOURCE_001（同源行展示名改写被拒，同步请传 syncFromIam=true）' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
