dependencies {
    // core 1.0.0 已上 Central（10-13），固定坐标形态（规范 §13.1）
    api 'io.github.sure-zzzzzz:simple-feedback-server-core:1.0.0'
    // SPI 实现消费 IAM 现成客户端（仓内已发布；「只引不改传输」）；IamUser 等类型不进本模块公开签名
    implementation 'io.github.sure-zzzzzz:simple-iam-client-core:1.0.3'
    implementation 'io.github.sure-zzzzzz:simple-iam-aksk-resttemplate-client-starter:1.0.2'

    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'
    compileOnly 'org.springframework.boot:spring-boot-autoconfigure'
    compileOnly 'org.springframework.boot:spring-boot-configuration-processor'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-aop'
    testImplementation 'org.springframework.boot:spring-boot-starter-log4j2'
}

tasks.test {
    useJUnitPlatform {
        excludeTags 'collaboration'
    }
}
