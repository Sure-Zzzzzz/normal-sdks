openapi: 3.0.3
info:
  title: Simple License Admin API
  version: 2.0.0
  description: >
    License 管理端 API（2.0 新领域模型，基路径 /api/license/v1）。认证走身份协作底座
    （IAM 人员 Bearer 由 PKCE 链取得 / AKSK SERVICE Bearer），请求不得同时携带 Cookie 等其他凭据。
    API 为接口操作权限，DATA 为资源和动作的数据范围，PAGE 为人员页面入口权限；
    页面可见不代替后端 API 与 DATA 校验。机器调用不要求 PAGE，但仍执行应用准入及后端授权。
    本契约列出实际提供的接口。Idempotency-Key（幂等请求标识）和 expectedRowVersion
    （当前对象行版本）仅在相应操作声明时携带；存在幂等请求头不代表每个创建接口均实现请求重放。
    请求体最大 262144 UTF-8 字节，未知顶层字段拒绝。业务身份、期限和权益不能由调用方扩展字段覆盖。
    时间字段区分 UTC Epoch 秒与 ISO 8601 文本。签名原文仅在独立交付接口返回且禁止缓存。
servers:
  - url: /
security:
  - bearerToken: []
paths:
  /api/license/v1/me:
    get:
      summary: 当前主体最小视图（PAGE/API 摘要，不含原始 DATA）
      operationId: getMe
      x-api-permission: license.me.read
      responses: { '200': { description: 主体视图 }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /api/license/v1/issuers:
    get:
      summary: 分页签发方列表
      operationId: listIssuers
      x-api-permission: license.issuer.read
      x-data-permission: { resource: license-issuer, action: read, dimension: issuerId }
      parameters: [ { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Size' } ]
      responses: { '200': { description: 签发方分页 }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      summary: 创建签发方（编码须唯一，重复返回409）
      operationId: createIssuer
      x-api-permission: license.issuer.manage
      x-data-permission: { resource: license-issuer, action: manage, all: true }
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/IssuerInput' } } } }
      responses: { '201': { description: 签发方 }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/license/v1/issuers/{issuerId}:
    get:
      summary: 签发方详情
      operationId: getIssuer
      x-api-permission: license.issuer.read
      x-data-permission: { resource: license-issuer, action: read, dimension: issuerId }
      parameters: [ { $ref: '#/components/parameters/IssuerId' } ]
      responses: { '200': { description: 签发方 }, '404': { $ref: '#/components/responses/NotFound' } }
    patch:
      summary: 更新签发方展示资料（行版本围栏）
      operationId: patchIssuer
      x-api-permission: license.issuer.manage
      x-data-permission: { resource: license-issuer, action: manage, dimension: issuerId }
      parameters: [ { $ref: '#/components/parameters/IssuerId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/IssuerPatchInput' } } } }
      responses: { '200': { description: 签发方 }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/license/v1/customers:
    get:
      summary: 分页客户列表
      operationId: listCustomers
      x-api-permission: license.customer.read
      x-data-permission: { resource: license-customer, action: read, dimension: customerId }
      parameters: [ { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Size' } ]
      responses: { '200': { description: 客户分页 }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      summary: 创建客户（编码须唯一，重复返回409）
      operationId: createCustomer
      x-api-permission: license.customer.manage
      x-data-permission: { resource: license-customer, action: manage, all: true }
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerInput' } } } }
      responses: { '201': { description: 客户 }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/license/v1/customers/{customerId}:
    get:
      summary: 客户详情
      operationId: getCustomer
      x-api-permission: license.customer.read
      x-data-permission: { resource: license-customer, action: read, dimension: customerId }
      parameters: [ { $ref: '#/components/parameters/CustomerId' } ]
      responses: { '200': { description: 客户 }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/license/v1/products:
    get:
      summary: 分页产品列表
      operationId: listProducts
      x-api-permission: license.product.read
      x-data-permission: { resource: license-product, action: read, dimension: productId }
      parameters: [ { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Size' }, { name: issuerId, in: query, schema: { type: string } } ]
      responses: { '200': { description: 产品分页 }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      summary: 创建产品（声明动作总集）
      operationId: createProduct
      x-api-permission: license.product.manage
      x-data-permission: { resource: license-product, action: manage, all: true }
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProductInput' } } } }
      responses: { '201': { description: 产品 }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/license/v1/products/{productId}:
    get:
      summary: 产品详情
      operationId: getProduct
      x-api-permission: license.product.read
      x-data-permission: { resource: license-product, action: read, dimension: productId }
      parameters: [ { $ref: '#/components/parameters/ProductId' } ]
      responses: { '200': { description: 产品 }, '404': { $ref: '#/components/responses/NotFound' } }
    patch:
      summary: 扩展产品能力清单（行版本围栏；已有能力不可移除）
      operationId: patchProductCapabilities
      x-api-permission: license.product.manage
      x-data-permission: { resource: license-product, action: manage, dimension: productId }
      parameters: [ { $ref: '#/components/parameters/ProductId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProductCapabilitiesPatchInput' } } } }
      responses: { '200': { description: 更新后的产品 }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/license/v1/models:
    get:
      summary: 模型版本列表（按产品过滤）
      operationId: listModels
      x-api-permission: license.model.read
      x-data-permission: { resource: license-product, action: read, dimension: productId }
      parameters: [ { name: productId, in: query, schema: { type: string } } ]
      responses: { '200': { description: 完整模型版本列表，以单页结构返回，不支持page/size参数 }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      summary: 创建模型（草稿；快照经发布级校验）
      operationId: createModel
      x-api-permission: license.model.manage
      x-data-permission: { resource: license-product, action: manage, all: true }
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ModelInput' } } } }
      responses: { '201': { description: 模型版本（DRAFT） }, '422': { description: 快照未通过结构校验 } }
  /api/license/v1/model-versions/{modelVersionId}:
    get:
      summary: 模型版本详情（附快照原文——草稿编辑回填源）
      operationId: getModelVersion
      x-api-permission: license.model.read
      x-data-permission: { resource: license-product, action: read, dimension: productId }
      parameters: [ { $ref: '#/components/parameters/ModelVersionId' } ]
      responses: { '200': { description: 模型版本详情 }, '404': { $ref: '#/components/responses/NotFound' } }
    patch:
      summary: 编辑草稿快照（行版本围栏；已发布不可变）
      operationId: patchModelDraft
      x-api-permission: license.model.manage
      x-data-permission: { resource: license-product, action: manage, dimension: productId }
      parameters: [ { $ref: '#/components/parameters/ModelVersionId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ModelPatchInput' } } } }
      responses: { '200': { description: 模型版本 }, '409': { $ref: '#/components/responses/Conflict' }, '422': { description: 快照未通过结构校验 } }
  /api/license/v1/model-versions/{modelVersionId}/publication:
    put:
      summary: 发布模型（快照固化不可变）
      operationId: publishModelVersion
      x-api-permission: license.model.publish
      x-data-permission: { resource: license-product, action: publish, dimension: productId }
      parameters: [ { $ref: '#/components/parameters/ModelVersionId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RowVersionInput' } } } }
      responses: { '200': { description: 已发布模型版本 }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/license/v1/model-versions/{modelVersionId}/state:
    patch:
      summary: 退役模型（PUBLISHED→RETIRED；禁止新引用）
      operationId: retireModelVersion
      x-api-permission: license.model.publish
      x-data-permission: { resource: license-product, action: publish, dimension: productId }
      parameters: [ { $ref: '#/components/parameters/ModelVersionId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RetireInput' } } } }
      responses: { '200': { description: 已退役模型版本 }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/license/v1/model-versions/{modelVersionId}/evaluations:
    post:
      summary: 受限试算（假设权益/事实；只判定不签发）
      operationId: evaluateModelAction
      x-api-permission: license.model.read
      x-data-permission: { resource: license-product, action: read, dimension: productId }
      parameters: [ { $ref: '#/components/parameters/ModelVersionId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EvaluationInput' } } } }
      responses: { '200': { description: 'declared 结论' }, '422': { description: 快照不可求值 } }
  /api/license/v1/plans:
    get:
      summary: 方案版本列表（按产品过滤）
      operationId: listPlans
      x-api-permission: license.plan.read
      x-data-permission: { resource: license-product, action: read, dimension: productId }
      parameters: [ { name: productId, in: query, schema: { type: string } } ]
      responses: { '200': { description: 完整方案版本列表，以单页结构返回，不支持page/size参数 } }
    post:
      summary: 创建方案（只可引用已发布模型；预填键集须为模型 rights 声明子集）
      operationId: createPlan
      x-api-permission: license.plan.manage
      x-data-permission: { resource: license-product, action: manage, all: true }
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PlanInput' } } } }
      responses: { '201': { description: 方案版本（DRAFT） }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/license/v1/plan-versions/{planVersionId}:
    get:
      summary: 方案版本详情（附预填）
      operationId: getPlanVersion
      x-api-permission: license.plan.read
      x-data-permission: { resource: license-product, action: read, dimension: productId }
      parameters: [ { $ref: '#/components/parameters/PlanVersionId' } ]
      responses: { '200': { description: 方案版本详情 }, '404': { $ref: '#/components/responses/NotFound' } }
    patch:
      summary: 编辑草稿预填（行版本围栏；已发布不可变）
      operationId: patchPlanDraft
      x-api-permission: license.plan.manage
      x-data-permission: { resource: license-product, action: manage, dimension: productId }
      parameters: [ { $ref: '#/components/parameters/PlanVersionId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PlanPatchInput' } } } }
      responses: { '200': { description: 方案版本 }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/license/v1/plan-versions/{planVersionId}/publication:
    put:
      summary: 发布方案（预填固化）
      operationId: publishPlanVersion
      x-api-permission: license.plan.manage
      x-data-permission: { resource: license-product, action: manage, dimension: productId }
      parameters: [ { $ref: '#/components/parameters/PlanVersionId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RowVersionInput' } } } }
      responses: { '200': { description: 已发布方案版本 }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/license/v1/grants:
    get:
      summary: 分页客户授权列表（客户、产品与DATA范围求交）
      operationId: listGrants
      x-api-permission: license.grant.read
      x-data-permission: { resource: license-grant, action: read, dimension: grantId }
      parameters: [ { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Size' }, { name: customerId, in: query, schema: { type: string } }, { name: productId, in: query, schema: { type: string } } ]
      responses: { '200': { description: 授权分页 }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      summary: 创建客户授权（必须关联已发布模型；权益键集须为模型 rights 声明子集）
      operationId: createGrant
      x-api-permission: license.grant.manage
      x-data-permission: { resource: license-grant, action: manage, all: true }
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GrantInput' } } } }
      responses: { '201': { description: 授权 }, '422': { description: 对象/模式/权益校验未通过 } }
  /api/license/v1/grants/{grantId}:
    get:
      summary: 授权详情（含模型关联与权益快照）
      operationId: getGrant
      x-api-permission: license.grant.read
      x-data-permission: { resource: license-grant, action: read, dimension: grantId }
      parameters: [ { $ref: '#/components/parameters/GrantId' } ]
      responses: { '200': { description: 授权 }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/license/v1/grants/{grantId}/state:
    patch:
      summary: 管理状态（ENABLED/SUSPENDED；REVOKED 只经吊销）
      operationId: patchGrantState
      x-api-permission: license.grant.manage
      x-data-permission: { resource: license-grant, action: manage, dimension: grantId }
      parameters: [ { $ref: '#/components/parameters/GrantId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GrantStateInput' } } } }
      responses: { '200': { description: 授权 }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/license/v1/grants/{grantId}/credentials:
    post:
      summary: 创建 OFFLINE 签发任务（201/202 仅返回元数据）
      description: 只允许 OFFLINE 授权；ONLINE/HYBRID 返回422，已有任务也不能绕过当前模式校验。凭据原文通过独立交付接口取得。
      operationId: requestCredential
      x-api-permission: license.grant.issue
      x-data-permission: { resource: license-grant, action: issue, dimension: grantId }
      parameters: [ { $ref: '#/components/parameters/GrantId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CredentialRequestInput' } } } }
      responses:
        '201': { description: 新建签发任务元数据（不含 compact JWS）, content: { application/json: { schema: { $ref: '#/components/schemas/CredentialMetadataView' } } } }
        '202': { description: 幂等命中或处理中任务元数据（不含 compact JWS）, content: { application/json: { schema: { $ref: '#/components/schemas/CredentialMetadataView' } } } }
        '422': { description: 预算预检或对象校验拒绝 }
  /api/license/v1/credentials:
    get:
      summary: 凭据元数据列表（不含原文；DATA、授权、激活筛选求交后分页）
      operationId: listCredentials
      x-api-permission: license.grant.read
      x-data-permission: { resource: license-grant, action: read, dimension: grantId }
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - { name: grantId, in: query, schema: { type: string }, description: 可选授权编号，受 DATA 范围约束 }
        - { name: activationId, in: query, schema: { type: string }, description: 可选部署激活编号，人员与服务凭据不匹配 }
      responses: { '200': { description: 凭据分页 } }
  /api/license/v1/credentials/{credentialId}:
    get:
      summary: 凭据元数据（不含原文）
      operationId: getCredential
      x-api-permission: license.grant.read
      x-data-permission: { resource: license-grant, action: read, dimension: grantId }
      parameters: [ { $ref: '#/components/parameters/CredentialId' } ]
      responses: { '200': { description: 凭据 }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/license/v1/credentials/{credentialId}/content:
    get:
      summary: 交付凭据签名文本（no-store；仅 READY）
      operationId: deliverCredentialContent
      x-api-permission: license.grant.deliver
      x-data-permission: { resource: license-grant, action: deliver, dimension: grantId }
      parameters: [ { $ref: '#/components/parameters/CredentialId' } ]
      responses: { '200': { description: JSON交付对象（包含compactJws；no-store）, headers: { Cache-Control: { schema: { type: string }, description: 固定为 no-store } }, content: { application/json: { schema: { $ref: '#/components/schemas/CredentialContentView' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/license/v1/grants/{grantId}/subject-assignments:
    get:
      summary: 固定资格名单（按授权）
      operationId: listSubjectAssignments
      x-api-permission: license.subject-assignment.read
      x-data-permission: { resource: license-grant, action: read, dimension: grantId }
      parameters: [ { $ref: '#/components/parameters/GrantId' } ]
      responses: { '200': { description: 完整资格名单，以单页结构返回；不接受分页参数 } }
    post:
      summary: 分配资格（PERSON/SERVICE；缺省记录当前授权修订）
      operationId: createSubjectAssignment
      x-api-permission: license.subject-assignment.manage
      x-data-permission: { resource: license-grant, action: manage, dimension: grantId }
      parameters: [ { $ref: '#/components/parameters/GrantId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AssignmentInput' } } } }
      responses: { '201': { description: 资格 }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/license/v1/subject-assignments/{assignmentId}:
    get:
      summary: 资格详情
      operationId: getSubjectAssignment
      x-api-permission: license.subject-assignment.read
      x-data-permission: { resource: license-grant, action: read, dimension: grantId }
      parameters: [ { $ref: '#/components/parameters/AssignmentId' } ]
      responses: { '200': { description: 资格 }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/license/v1/subject-assignments/{assignmentId}/state:
    patch:
      summary: 资格状态（ACTIVE/SUSPENDED；暂停仍占席）
      operationId: patchAssignmentState
      x-api-permission: license.subject-assignment.manage
      x-data-permission: { resource: license-grant, action: manage, dimension: grantId }
      parameters: [ { $ref: '#/components/parameters/AssignmentId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SubjectStateInput' } } } }
      responses: { '200': { description: 资格 }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/license/v1/subject-assignments/{assignmentId}/named-seat-allocations:
    post:
      summary: 追加实名指标（重复指标返回409；已替换或已吊销资格禁止修改）
      operationId: appendNamedSeats
      x-api-permission: license.subject-assignment.manage
      x-data-permission: { resource: license-grant, action: manage, dimension: grantId }
      parameters: [ { $ref: '#/components/parameters/AssignmentId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NamedSeatInput' } } } }
      responses: { '200': { description: 资格 }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/license/v1/grants/{grantId}/activations:
    get:
      summary: 部署激活列表（按授权）
      operationId: listActivations
      x-api-permission: license.activation.read
      x-data-permission: { resource: license-grant, action: read, dimension: grantId }
      parameters: [ { $ref: '#/components/parameters/GrantId' } ]
      responses: { '200': { description: 完整激活列表，以单页结构返回；不接受分页参数 } }
    post:
      summary: 创建激活申请（调用者绑定；设备政策固定为NONE；LOCAL额度随激活固化）
      operationId: createActivation
      x-api-permission: license.activation.manage
      x-data-permission: { resource: license-grant, action: manage, dimension: grantId }
      parameters: [ { $ref: '#/components/parameters/GrantId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ActivationInput' } } } }
      responses: { '201': { description: 激活, content: { application/json: { schema: { $ref: '#/components/schemas/ActivationView' } } } }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/license/v1/activations/{activationId}/state:
    patch:
      summary: 激活状态（停止新签发；旧离线凭据不即时失效）
      operationId: patchActivationState
      x-api-permission: license.activation.manage
