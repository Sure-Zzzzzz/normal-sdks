  /api/license/v1/integration-commands/{commandId}/attempts:
    post:
      summary: 刷新人工清单或显式执行自动联动
      description: >-
        省略请求体、空对象或 executionMode=MANUAL 只刷新清单；仅显式 AUTO 通过受委托接口
        执行角色规则与部门挂载，并逐次回读远端修订。响应状态必须逐项检查，HTTP 200 不代表已 VERIFIED。
        结果不明为 UNCERTAIN，漂移为 DRIFTED；412/409 不触发盲重发。重试保留原幂等键与原输入。
      operationId: attemptIntegrationCommand
      x-api-permission: license.integration.manage
      x-data-permission: { resource: license-integration, action: manage, all: true }
      parameters: [ { $ref: '#/components/parameters/IntegrationCommandId' }, { $ref: '#/components/parameters/ProjectionIdempotencyKey' } ]
      requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/IntegrationAttemptInput' } } } }
      responses:
        '200': { $ref: '#/components/responses/RoleProjectionPlan' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/license/v1/integration-commands/{commandId}/reconciliations:
    post:
      summary: 核对未知或漂移的联动结果
      description: 治理者须明确确认原调用已终止，回读实际远端事实，并匹配当前期望及组织绑定；不靠再次执行掩盖未知结果。
      operationId: reconcileIntegrationCommand
      x-api-permission: license.integration.manage
      x-data-permission: { resource: license-integration, action: manage, all: true }
      parameters: [ { $ref: '#/components/parameters/IntegrationCommandId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectionReconciliationInput' } } } }
      responses:
        '200': { $ref: '#/components/responses/RoleProjectionPlan' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/license/v1/products/{productId}/role-projection-reconfirmations:
    post:
      summary: 重新确认组织环境与角色投影
      description: 已知环境清库、恢复或重绑后明确核对当前绑定，并确认旧调用已终止；重新建立外部关联，不自动续用旧角色编号。
      operationId: reconfirmRoleProjectionEnvironment
      x-api-permission: license.integration.manage
      x-data-permission: { resource: license-integration, action: manage, all: true }
      parameters: [ { $ref: '#/components/parameters/ProductId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectionEnvironmentInput' } } } }
      responses:
        '201': { $ref: '#/components/responses/RoleProjectionPlan' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/license/v1/operations:
    get:
      summary: 分页读取签发任务元数据
      description: DATA 与可选 grantId 筛选先在数据库求交；不返回冻结输入或签名原文。
      operationId: listSigningOperations
      x-api-permission: license.operation.read
      x-data-permission: { resource: license-grant, action: read, dimension: grantId }
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - { name: grantId, in: query, schema: { type: string } }
      responses:
        '200': { description: 签发任务分页, content: { application/json: { schema: { $ref: '#/components/schemas/SigningOperationPage' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/license/v1/operations/{operationId}:
    get:
      summary: 读取签发任务元数据
      operationId: getSigningOperation
      x-api-permission: license.operation.read
      x-data-permission: { resource: license-grant, action: read, dimension: grantId }
      parameters: [ { $ref: '#/components/parameters/OperationId' } ]
      responses:
        '200': { $ref: '#/components/responses/SigningOperation' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/license/v1/operations/{operationId}/recoveries:
    post:
      summary: 受控恢复原冻结签发任务
      description: >-
        UNCERTAIN 沿用原任务号和冻结输入，条件更新执行代数后同步签名。
        接管 SIGNING 还须携带原执行代数及理由，并超过宿主显式配置的失联窗口；
        未配置窗口时禁止接管。READY 与终态不能借恢复重新执行。
        503 后先回读任务，不假设签名一定未发生。
      operationId: recoverSigningOperation
      x-api-permission: license.operation.recover
      x-data-permission: { resource: license-grant, action: manage, dimension: grantId }
      parameters: [ { $ref: '#/components/parameters/OperationId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SigningRecoveryInput' } } } }
      responses:
        '200': { $ref: '#/components/responses/SigningOperation' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/license/v1/operations/{operationId}/abandonments:
    post:
      summary: 安全放弃未完成签发任务
      description: 按当前行版本与执行代数执行条件更新；READY 与终态拒绝放弃，不回收已交付文件的历史占用。
      operationId: abandonSigningOperation
      x-api-permission: license.operation.recover
      x-data-permission: { resource: license-grant, action: manage, dimension: grantId }
      parameters: [ { $ref: '#/components/parameters/OperationId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SigningAbandonmentInput' } } } }
      responses:
        '200': { $ref: '#/components/responses/SigningOperation' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/license/v1/fulfillment-integration/synchronization:
    post:
      summary: 执行一轮履约同步
      description: >-
        需要授权资源 manage/all。消费官方机器履约清单，保存自己的履约去重事实并回报结果；
        新建草稿属于 awaitingConfiguration，启用且完成回报确认才计入 completed。
        reportPending 或 failures 表示对应项未确认，不因 HTTP 200 声称全部履约成功。
      operationId: synchronizeFulfillments
      x-api-permission: license.grant.manage
      x-data-permission: { resource: license-grant, action: manage, all: true }
      requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/FulfillmentSynchronizationInput' } } } }
      responses:
        '200': { description: 本轮同步统计, content: { application/json: { schema: { $ref: '#/components/schemas/FulfillmentSynchronizationView' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/license/v1/signing-profiles/{profileId}/key-disposal-advice:
    get:
      summary: 读取退役签名档案的钥销毁保护建议
      description: >-
        只接受 RETIRED 档案。永久或无法确认截止的历史凭据按无截止保留；
        SAFE_TO_SCHEDULE_DESTRUCTION 仅表示该档案没有仍在保留窗口内的 READY 引用，
        仍须核对相同钥版本在其他档案和系统的引用。此接口不执行钥销毁。
      operationId: getKeyDisposalAdvice
      x-api-permission: license.signing-profile.read
      x-data-permission: { resource: license-signing-profile, action: read, dimension: profileId }
      parameters: [ { $ref: '#/components/parameters/ProfileId' } ]
      responses:
        '200': { description: 销毁保护建议, content: { application/json: { schema: { $ref: '#/components/schemas/KeyDisposalAdviceView' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/license/v1/subject-assignments/{assignmentId}/replacements:
    post:
      summary: 以新主体替换固定资格
      description: 同事务把原资格标为REPLACED并建立新assignmentId；新编号的代数独立从1开始。已替换或已吊销资格不可再替换、追加指标或恢复ACTIVE。
      operationId: replaceSubjectAssignment
      x-api-permission: license.subject-assignment.manage
      x-data-permission: { resource: license-grant, action: manage, dimension: grantId }
      parameters: [ { $ref: '#/components/parameters/AssignmentId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AssignmentReplacementInput' } } } }
      responses:
        '201': { description: 新资格, content: { application/json: { schema: { $ref: '#/components/schemas/AssignmentView' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/license/v1/activations/{activationId}/replacements:
    post:
      summary: 以新激活替换部署对象
      description: >-
        同事务把原激活标记为 REPLACED，新记录保留 deploymentCode 并提高 activationGeneration。
        callerBinding 省略时继承原登记值；显式提供对象须包含完整来源与主体编号。
        OFFLINE 可显式传 null 清除绑定，ONLINE/HYBRID 必须保留非空绑定。
        当前设备政策仅NONE；已替换或已吊销激活不可再次替换或恢复ACTIVE。
      operationId: replaceActivation
      x-api-permission: license.activation.manage
      x-data-permission: { resource: license-grant, action: manage, dimension: grantId }
      parameters: [ { $ref: '#/components/parameters/ActivationId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ActivationReplacementInput' } } } }
      responses:
        '201': { description: 新激活, content: { application/json: { schema: { $ref: '#/components/schemas/ActivationView' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/license/v1/products/{productId}/revocation-packages:
    post:
      summary: 生成并发布产品完整吊销包
      description: >-
        按产品完整范围导出五类吊销目标，按协议字节预算分片并使用 REVOCATION 签名档案签名。
        序号失败后不复用；幂等重放返回原包。不得传客户或 DATA 子集筛选条件。
      operationId: createRevocationPackage
      x-api-permission: license.revocation.deliver
      x-data-permission: { resource: license-product, action: manage, dimension: productId }
      parameters: [ { $ref: '#/components/parameters/ProductId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '201': { description: 已生成 READY 包, content: { application/json: { schema: { $ref: '#/components/schemas/RevocationPackageView' } } } }
        '202': { description: 已受理包, content: { application/json: { schema: { $ref: '#/components/schemas/RevocationPackageView' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/license/v1/revocation-packages/{packageId}:
    get:
      summary: 吊销包元数据
      operationId: getRevocationPackage
      x-api-permission: license.revocation.deliver
      x-data-permission: { resource: license-product, action: read, dimension: productId }
      parameters: [ { $ref: '#/components/parameters/PackageId' } ]
      responses:
        '200': { description: 吊销包元数据, content: { application/json: { schema: { $ref: '#/components/schemas/RevocationPackageView' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/license/v1/revocation-packages/{packageId}/content:
    get:
      summary: 吊销包签名内容
      operationId: getRevocationPackageContent
      x-api-permission: license.revocation.deliver
      x-data-permission: { resource: license-product, action: read, dimension: productId }
      parameters: [ { $ref: '#/components/parameters/PackageId' } ]
      responses:
        '200': { description: 原始 manifest 与分片内容, content: { application/json: { schema: { $ref: '#/components/schemas/RevocationPackageContentView' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/license/v1/products/{productId}/trust-material:
    get:
      summary: 获取产品信任资料快照
      operationId: getTrustMaterial
      x-api-permission: license.product.read
      x-data-permission: { resource: license-product, action: read, dimension: productId }
      parameters:
        - { $ref: '#/components/parameters/ProductId' }
        - { name: knownSequence, in: query, description: 调用方已安装的吊销资料序号；当前服务端保留该兼容参数但始终返回最新完整快照，调用方须自行验签并按序号只增安装, schema: { type: integer, format: int64, minimum: 0, default: 0 } }
      responses:
        '200': { description: 吊销包与已登记公钥资料, content: { application/json: { schema: { $ref: '#/components/schemas/TrustMaterialView' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    bearerToken: { type: http, scheme: bearer, description: 接受官方认证链取得的人员或服务 Bearer，不限定令牌为 JWT }
  parameters:
    Page: { name: page, in: query, schema: { type: integer, default: 1, minimum: 1 } }
    Size: { name: size, in: query, schema: { type: integer, default: 20, maximum: 100 } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, description: 本次请求的稳定标识；是否重放及长度约束依具体操作执行，不强制UUID格式, schema: { type: string } }
    IssuerId: { name: issuerId, in: path, required: true, schema: { type: string } }
    CustomerId: { name: customerId, in: path, required: true, schema: { type: string } }
    ProductId: { name: productId, in: path, required: true, schema: { type: string } }
    ModelVersionId: { name: modelVersionId, in: path, required: true, schema: { type: string } }
    PlanVersionId: { name: planVersionId, in: path, required: true, schema: { type: string } }
    GrantId: { name: grantId, in: path, required: true, schema: { type: string } }
    CredentialId: { name: credentialId, in: path, required: true, schema: { type: string } }
    AssignmentId: { name: assignmentId, in: path, required: true, schema: { type: string } }
    ActivationId: { name: activationId, in: path, required: true, schema: { type: string } }
    RevocationId: { name: revocationId, in: path, required: true, schema: { type: string } }
    PackageId: { name: packageId, in: path, required: true, schema: { type: string } }
    ProfileId: { name: profileId, in: path, required: true, schema: { type: string } }
    OperationId: { name: operationId, in: path, required: true, schema: { type: string } }
    ProjectionPlanId: { name: planId, in: path, required: true, schema: { type: string } }
    IntegrationCommandId: { name: commandId, in: path, required: true, schema: { type: string } }
    IntegrationSize: { name: size, in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 200 } }
    ProjectionIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 当前主体和准确目标内的稳定请求标识；重试保留同键和原输入，同键异输入返回409
      schema: { type: string, minLength: 1, maxLength: 256 }
  responses:
    Unauthorized: { description: 未认证（WWW-Authenticate 质询） }
    Forbidden: { description: 无权限码或 DATA 维度越界 }
    NotFound: { description: 资源不存在或不属于当前 DATA 范围 }
    Conflict: { description: 行版本冲突/状态迁移非法/幂等冲突 }
    ValidationError: { description: 请求体校验未通过 }
    BadRequest: { description: 请求体不是合法JSON对象或分页参数非法 }
    PayloadTooLarge: { description: 请求体或字段集合超过服务端允许的大小上限 }
    DependencyUnavailable: { description: 依赖未装配、不可用或执行结果未确认；先回读当前业务状态 }
    RoleProjectionPlan:
      description: 角色联动清单与命令状态，HTTP成功不等于远端执行成功
      content: { application/json: { schema: { $ref: '#/components/schemas/RoleProjectionPlanView' } } }
    SigningOperation:
      description: 当前签发任务元数据，不含冻结输入或签名文本
      content: { application/json: { schema: { $ref: '#/components/schemas/SigningOperationView' } } }
  schemas:
    IssuerInput: { type: object, additionalProperties: false, required: [code, displayName], properties: { code: { type: string, maxLength: 64 }, displayName: { type: string, maxLength: 128 } } }
    IssuerPatchInput:
      type: object
      additionalProperties: false
      required: [expectedRowVersion]
      properties:
        displayName: { type: string }
        status: { type: integer, enum: [0, 1] }
        expectedRowVersion: { type: integer, format: int64 }
    CustomerInput: { type: object, additionalProperties: false, required: [code, displayName], properties: { code: { type: string, maxLength: 64 }, displayName: { type: string, maxLength: 128 } } }
    ProductInput:
      type: object
      additionalProperties: false
      required: [issuerId, code, displayName, declaredActions, supportedCapabilities]
      properties:
        issuerId: { type: string }
        code: { type: string }
        displayName: { type: string }
        declaredActions:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 128, pattern: '^[\x21-\x7E]+$' }
        supportedCapabilities:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 128, pattern: '^[\x21-\x7E]+$' }
    ProductCapabilitiesPatchInput:
      type: object
      additionalProperties: false
      required: [supportedCapabilities, expectedRowVersion]
      properties:
        supportedCapabilities:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 128, pattern: '^[\x21-\x7E]+$' }
          description: 新清单必须包含当前全部能力，只能追加能力。
        expectedRowVersion: { type: integer, format: int64, minimum: 0 }
    ModelInput:
      type: object
      additionalProperties: false
      required: [productId, snapshot]
      properties:
        productId: { type: string }
        snapshot:
          type: object
          description: 条件模型快照——fields（rights/facts 声明）+actions（动作→条件树，节点恰一键 all/any/not/bool/compare/member）+可选 quota（[{metric,limitRight,kind,enforcement}]）
    ModelPatchInput: { type: object, additionalProperties: false, required: [snapshot, expectedRowVersion], properties: { snapshot: { type: object }, expectedRowVersion: { type: integer, format: int64 } } }
    PlanInput:
      type: object
      additionalProperties: false
      required: [productId, modelVersionId]
      properties:
        productId: { type: string }
        modelVersionId: { type: string, description: 只可引用同产品已发布模型版本 }
        prefillRights:
          allOf: [ { $ref: '#/components/schemas/TypedFieldValues' } ]
          description: 键集须为模型 rights 声明子集，每个值匹配声明的类型与约束
    PlanPatchInput: { type: object, additionalProperties: false, required: [prefillRights, expectedRowVersion], properties: { prefillRights: { $ref: '#/components/schemas/TypedFieldValues' }, expectedRowVersion: { type: integer, format: int64 } } }
    RowVersionInput: { type: object, additionalProperties: false, required: [expectedRowVersion], properties: { expectedRowVersion: { type: integer, format: int64 } } }
    RetireInput: { type: object, additionalProperties: false, required: [state, expectedRowVersion], properties: { state: { type: string, enum: [RETIRED] }, expectedRowVersion: { type: integer, format: int64 } } }
    EvaluationInput:
      type: object
      additionalProperties: false
      required: [action]
      properties: { action: { type: string }, rights: { $ref: '#/components/schemas/TypedFieldValues' }, facts: { $ref: '#/components/schemas/TypedFieldValues' } }
    TypedFieldValues:
      type: object
      description: 键和值须符合相应模型声明；支持INTEGER、BOOLEAN、STRING、STRING_SET，禁止将业务身份或期限混入权益
      additionalProperties:
        oneOf:
          - { type: integer, format: int64 }
          - { type: boolean }
          - { type: string }
          - { type: array, items: { type: string } }
    GrantInput:
      type: object
      additionalProperties: false
      required: [customerId, productId, modelVersionId, subjectKind, mode]
      properties:
        customerId: { type: string }
        productId: { type: string }
        subjectKind: { type: string, enum: [DEPLOYMENT, PERSON, SERVICE] }
        eligibilityKind: { type: string, enum: [ALLOCATED_DEPLOYMENTS, CUSTOMER_MEMBERS, ASSIGNED_SUBJECTS] }
        offlineProofProfile: { type: string }
        mode: { type: string, enum: [OFFLINE, ONLINE, HYBRID] }
        businessOrderRef: { type: string, description: 与 CRM 对账钩子 }
        modelVersionId: { type: string, description: 只可引用同产品已发布模型版本 }
        rights:
          allOf: [ { $ref: '#/components/schemas/TypedFieldValues' } ]
          description: 随模型提交；键集须为声明子集且通过模型范围校验
        validity:
          allOf: [ { $ref: '#/components/schemas/ValidityInput' } ]
          nullable: true
          description: 可省略或null，由创建时一次固化默认期限；读取、判定和签发不会顺延
        limiterPolicies:
          type: array
          maxItems: 64
          description: 客户 OpenAPI 限频授权；namespace 由 limiter Management 的服务声明返回，调用方不得提交
          items: { $ref: '#/components/schemas/LimiterPolicyInput' }
    LimiterPolicyInput:
      type: object
      additionalProperties: false
      required: [serviceCode, resourceCode, limits]
      properties:
        serviceCode:
          allOf: [{ $ref: '#/components/schemas/StableCode' }]
          description: Management 服务编码
        resourceCode:
          allOf: [{ $ref: '#/components/schemas/StableCode' }]
          description: Management 资源编码
        limits:
          type: array
          minItems: 1
          maxItems: 8
          items: { $ref: '#/components/schemas/LimiterPolicyLimit' }
    LimiterPolicyLimit:
      type: object
      additionalProperties: false
      required: [count, window, unit]
      properties:
        count: { type: integer, format: int64, minimum: 1 }
        window: { type: integer, format: int64, minimum: 1 }
        unit: { type: string, enum: [SECONDS, MINUTES, HOURS, DAYS] }
    StableCode:
      type: string
      pattern: '^[\x00-\x20]*[A-Za-z0-9][A-Za-z0-9._-]{0,127}[\x00-\x20]*$'
      description: 与 Limiter Management 一致的稳定编码规则；服务端先去除首尾 U+0000..U+0020，再验证规范化值，长度为1..128
    ValidityInput:
      type: object
      additionalProperties: false
      required: [startsAt]
      description: FIXED须提交全部三个时刻并满足startsAt<serviceUntil≤commercialGraceUntil；PERPETUAL截止须省略或null
      properties:
        kind: { type: string, enum: [FIXED, PERPETUAL], default: FIXED }
        startsAt: { type: integer, format: int64, minimum: 1, description: UTC Epoch秒 }
        serviceUntil: { type: integer, format: int64, nullable: true, description: UTC Epoch秒；FIXED必填 }
        commercialGraceUntil: { type: integer, format: int64, nullable: true, description: UTC Epoch秒；FIXED必填 }
    GrantStateInput: { type: object, additionalProperties: false, required: [state, expectedRowVersion], properties: { state: { type: string, enum: [ENABLED, SUSPENDED] }, expectedRowVersion: { type: integer, format: int64 } } }
    SubjectStateInput:
      type: object
      additionalProperties: false
      required: [state, expectedRowVersion]
      description: 仅切换ACTIVE/SUSPENDED；已替换或已吊销终态不可恢复
      properties: { state: { type: string, enum: [ACTIVE, SUSPENDED] }, expectedRowVersion: { type: integer, format: int64 } }
    CredentialMetadataView:
      type: object
      required: [operationId, credentialId, grantId, state, rowVersion, status, executionGeneration]
      properties:
        operationId: { type: string }
        credentialId: { type: string }
        grantId: { type: string }
        activationId: { type: string, nullable: true }
        state: { type: string, enum: [PENDING_SIGN, SIGNING, READY, UNCERTAIN, REJECTED, ABANDONED] }
        status: { type: string }
        rowVersion: { type: integer, format: int64 }
        executionGeneration: { type: integer, format: int64 }
        reasonCategory: { type: string, nullable: true }
        resultResource: { type: string, nullable: true, description: READY 时的独立 deliver 地址；此响应不携带 JWS }
        lastKmsCallAt: { type: integer, format: int64, nullable: true }
    CredentialContentView:
      type: object
      required: [credentialId, compactJws]
      properties:
        credentialId: { type: string }
        compactJws: { type: string, description: 完整 compact JWS；仅在独立 deliver 响应返回 }
    CredentialRequestInput:
      type: object
      additionalProperties: false
      required: [subjectRef, kid]
      properties:
        subjectRef: { oneOf: [{ type: object }, { type: string }], description: 已登记的激活或资格引用；字符串形态为同一对象的 JSON 文本 }
        kid: { type: string, description: 精确选择当前产品的 ACTIVE 签名档案 }
    AssignmentInput:
      type: object
      additionalProperties: false
      required: [subjectKind, sourceId, subjectId]
      properties: { subjectKind: { type: string, enum: [PERSON, SERVICE] }, sourceId: { type: string }, subjectId: { type: string }, grantRevision: { type: integer, format: int64, minimum: 1, description: 缺省取当前授权修订；显式提交必须等于当前修订，过旧或未来修订返回409 }, requestedNamedMetrics: { type: array, items: { type: string } } }
    NamedSeatInput:
      type: object
      additionalProperties: false
      required: [expectedRowVersion, requestedNamedMetrics]
      properties:
        expectedRowVersion: { type: integer, format: int64 }
        grantRevision: { type: integer, format: int64, minimum: 1, description: 缺省取当前授权修订；显式提交须等于当前修订，否则409，非正整型422 }
        requestedNamedMetrics: { type: array, minItems: 1, uniqueItems: true, items: { type: string }, description: 只能追加未登记指标；与既有集合重复返回409 }
    ActivationInput:
      type: object
      additionalProperties: false
      required: [deploymentCode]
      properties:
        deploymentCode: { type: string }
        grantRevision: { type: integer, format: int64, minimum: 1, description: 缺省取当前授权修订；显式提交必须等于当前修订，否则409 }
        callerBinding:
          allOf: [ { $ref: '#/components/schemas/CallerBinding' } ]
          nullable: true
          description: ONLINE/HYBRID 必须登记；OFFLINE 可省略或为 null
        componentDigests: { type: object, nullable: true, maxProperties: 0, description: 兼容字段；设备政策为NONE时必须省略、为空对象或null }
        requestedAllocations:
          type: array
          maxItems: 128
          description: >-
            部署激活的LOCAL额度分配。服务端按已发布模型校验指标、数量与授权限额，
            生成allocationId、grantRevision和固定窗口锚；调用方不得提交这些服务端事实。
          items: { $ref: '#/components/schemas/ActivationQuotaAllocationInput' }
    ActivationView:
      type: object
      required: [activationId, grantId, deploymentCode, activationGeneration, deviceBindingMode, state, requestedAllocations, rowVersion]
      properties:
        activationId: { type: string }
        grantId: { type: string }
        deploymentCode: { type: string }
        activationGeneration: { type: integer, format: int64 }
        callerBinding:
          allOf: [ { $ref: '#/components/schemas/CallerBinding' } ]
          nullable: true
        deviceBindingMode: { type: string, enum: [NONE], readOnly: true, description: 服务端固定返回的设备政策 }
        state: { type: string, enum: [ACTIVE, SUSPENDED, REPLACED, REVOKED] }
        requestedAllocations: { type: array, items: { $ref: '#/components/schemas/ActivationQuotaAllocationView' }, description: 服务端持久化的LOCAL额度分配快照 }
        rowVersion: { type: integer, format: int64 }
    ActivationQuotaAllocationInput:
      type: object
      additionalProperties: false
      required: [metric, quantity, retention]
      properties:
        metric: { type: string, minLength: 1, maxLength: 128 }
        quantity: { type: integer, format: int64, minimum: 1 }
        retention: { type: string, enum: [FIXED, PERPETUAL] }
        retainUntil: { type: integer, format: int64, minimum: 1, nullable: true, description: FIXED时必填；PERPETUAL禁止提交 }
    ActivationQuotaAllocationView:
      type: object
      required: [allocationId, metric, quantity, grantRevision, retention, windowAnchorAt]
      properties:
        allocationId: { type: string }
        metric: { type: string }
        quantity: { type: integer, format: int64, minimum: 1 }
        grantRevision: { type: integer, format: int64, minimum: 1 }
        retention: { type: string, enum: [FIXED, PERPETUAL] }
        retainUntil: { type: integer, format: int64, minimum: 1, nullable: true }
        windowAnchorAt: { type: integer, format: int64, minimum: 1, nullable: true, description: FIXED_WINDOW指标的授权级窗口锚 }
    CallerBinding:
      type: object
      additionalProperties: false
      required: [sourceId, subjectId]
      properties: { sourceId: { type: string, minLength: 1, maxLength: 128 }, subjectId: { type: string, minLength: 1, maxLength: 128 } }
    CallerBindingPatch:
      type: object
      additionalProperties: false
      required: [expectedRowVersion, callerBinding]
      properties: { expectedRowVersion: { type: integer, format: int64 }, callerBinding: { $ref: '#/components/schemas/CallerBinding' } }
    RevocationInput:
      type: object
      additionalProperties: false
      required: [targetKind, targetId, reasonCategory]
      properties:
        targetKind: { type: string, enum: [CREDENTIAL, GRANT, ACTIVATION, ASSIGNMENT, SIGNING_KEY] }
        targetId: { type: string }
        reasonCategory: { type: string, description: 必填的治理原因分类 }
    SigningProfileInput:
      type: object
      additionalProperties: false
      required: [productId, purpose, kid, keyRef, keyVersion]
      properties:
        productId: { type: string }
        purpose: { type: string, enum: [CREDENTIAL, REVOCATION, STATE_RECOVERY] }
        kid: { type: string }
        keyRef: { type: string, writeOnly: true, description: KMS钥引用，只用于登记，不在响应回传 }
        keyVersion: { type: integer, minimum: 1, writeOnly: true }
        expectedProfileId: { type: string, nullable: true, description: 轮换时必须与当前ACTIVE档案编号一致 }
        expectedRowVersion: { type: integer, format: int64, nullable: true, description: 轮换时须同时与当前ACTIVE档案行版本一致 }
    ProfileSelectionInput:
      type: object
      additionalProperties: false
      required: [kid, keyRef, keyVersion]
      properties:
        kid: { type: string }
        keyRef: { type: string, writeOnly: true }
        keyVersion: { type: integer, minimum: 1, writeOnly: true }
        expectedProfileId: { type: string, nullable: true }
        expectedRowVersion: { type: integer, format: int64, nullable: true }
    SigningProfileRetirementInput:
      type: object
      additionalProperties: false
      required: [status, expectedRowVersion]
      properties:
        status: { type: string, enum: [RETIRED] }
        expectedRowVersion: { type: integer, format: int32 }
    SigningProfileView:
      type: object
      required: [profileId, productId, purpose, kid, status, rowVersion, publicKeyFingerprint, createdAt, retiredAt]
      description: 公共视图不包含KMS钥引用、钥版本或公钥全文；rotatedFrom仅在登记或轮换响应出现
      properties:
        profileId: { type: string }
        productId: { type: string }
        purpose: { type: string, enum: [CREDENTIAL, REVOCATION, STATE_RECOVERY] }
        kid: { type: string }
        status: { type: string, enum: [ACTIVE, RETIRED] }
        rowVersion: { type: integer, format: int64 }
        publicKeyFingerprint: { type: string, description: SHA-256公钥指纹的前8字节十六进制摘要 }
        createdAt: { type: string, format: date-time, nullable: true }
        retiredAt: { type: string, format: date-time, nullable: true }
        rotatedFrom: { type: string, nullable: true }
    SigningProfilePage:
      type: object
      required: [data, total, page, size, totalPages]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/SigningProfileView' } }
        total: { type: integer }
        page: { type: integer, enum: [1] }
        size: { type: integer, minimum: 1 }
        totalPages: { type: integer, enum: [1] }
    QuotaReservationInput:
      type: object
      additionalProperties: false
      required: [productId, grantId, subjectKind, action, metric, quantity, kind, businessOperationId, expectedGrantRevision]
      properties:
        productId: { type: string, minLength: 1, maxLength: 128 }
        grantId: { type: string, minLength: 1, maxLength: 128 }
        subjectKind: { type: string, enum: [PERSON, SERVICE, DEPLOYMENT] }
        action: { type: string, minLength: 1, maxLength: 128, description: 必须是模型quotaConstraints确实要求metric的动作 }
        metric: { type: string, minLength: 1, maxLength: 128 }
        quantity: { type: integer, format: int64, minimum: 1 }
        kind: { type: string, enum: [CONCURRENT, CONSUMPTION], description: 须与ONLINE指标定义一致；NAMED_SEAT由固定资格治理 }
        businessOperationId: { type: string, minLength: 1, maxLength: 160 }
        expectedGrantRevision: { type: integer, format: int64, minimum: 1 }
        assignmentId: { type: string, minLength: 1, maxLength: 128, description: 固定资格索引，仍核当前认证主体；部署禁止 }
        activationId: { type: string, minLength: 1, maxLength: 128, description: DEPLOYMENT必填，PERSON/SERVICE禁止 }
    QuotaRenewalInput:
      type: object
      additionalProperties: false
      required: [expectedFence]
      properties:
        expectedFence: { type: integer, format: int64, minimum: 0 }
    QuotaReservationView:
      type: object
      required: [reservationId, grantId, metric, quantity, kind, action, grantRevision, businessOperationId, fence, validUntil, state]
      properties:
        reservationId: { type: string }
        grantId: { type: string }
        metric: { type: string }
        quantity: { type: integer, format: int64, minimum: 1 }
        kind: { type: string, enum: [CONCURRENT, CONSUMPTION] }
        action: { type: string }
        grantRevision: { type: integer, format: int64, minimum: 1 }
        businessOperationId: { type: string }
        fence: { type: integer, format: int64, minimum: 0, description: 持久单调序号，续期必须携当前值 }
        validUntil: { type: integer, format: int64, description: 服务器确定的UTC秒截止；不授权跨请求缓存，永久TOTAL用最大long值表示无期限界限 }
        state: { type: string, enum: [ACTIVE, RELEASED, EXPIRED] }
    QuotaReservationPage:
      type: object
      required: [data, total, page, size, totalPages]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/QuotaReservationView' } }
        total: { type: integer, format: int64, minimum: 0 }
        page: { type: integer, minimum: 1 }
        size: { type: integer, minimum: 1, maximum: 100 }
        totalPages: { type: integer, format: int64, minimum: 0 }
    GrantSelectionInput:
      type: object
      additionalProperties: false
      required: [productId, subjectKind, action]
      properties:
        productId: { type: string, minLength: 1 }
        subjectKind: { type: string, enum: [DEPLOYMENT, PERSON, SERVICE] }
        action: { type: string, minLength: 1 }
        activationId: { type: string, description: 仅DEPLOYMENT必填，核当前服务与真实激活绑定 }
        page: { type: integer, minimum: 1, maximum: 2147483647, default: 1 }
        size: { type: integer, minimum: 1, maximum: 100, default: 20 }
    GrantSelectionPage:
      type: object
      required: [items, total, page, size, totalPages]
      properties:
        items:
          type: array
          items:
            type: object
            required: [grantId, mode, modelVersion, commercialPhase]
            properties:
              grantId: { type: string }
              mode: { type: string, enum: [ONLINE, OFFLINE, HYBRID] }
              modelVersion: { type: integer, format: int64, minimum: 1 }
              commercialPhase: { type: string, enum: [ACTIVE, COMMERCIAL_GRACE] }
        total: { type: integer, format: int64, minimum: 0 }
        page: { type: integer, minimum: 1 }
        size: { type: integer, minimum: 1, maximum: 100 }
        totalPages: { type: integer, format: int64, minimum: 0 }
    DecisionInput:
      type: object
      additionalProperties: false
      required: [productId, grantId, subjectKind, action]
      description: >-
        只能判定当前官方认证的本人或服务；部署还须匹配激活callerBinding。
        subjectId/sourceId可省略，由认证结论解析；显式提供必须与当前调用者一致。
        不支持服务仅凭裸subjectId代理人员，不包含额度消费成功证明。
      properties:
        productId: { type: string }
        grantId: { type: string }
        subjectKind: { type: string, enum: [DEPLOYMENT, PERSON, SERVICE] }
        sourceId: { type: string }
        subjectId: { type: string }
        action: { type: string }
        activationId: { type: string, description: DEPLOYMENT必填，PERSON/SERVICE禁止 }
        assignmentId: { type: string, description: 固定资格索引；部署禁止，仍核当前实际主体 }
        businessOperationId: { type: string, description: 本次业务操作编号；当前判定不执行额度扣减 }
        reservationReferences: { type: array, maxItems: 256, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 128 }, description: 模型动作所需的本人并发预占或累计消费编号；消费必须匹配本次businessOperationId }
        facts:
          allOf: [ { $ref: '#/components/schemas/TypedFieldValues' } ]
          description: 与已声明模型类型一致的本次运行事实；不作为身份或资格证明
    DecisionView:
      type: object
      description: >-
        allowed=true 时 productId、grantId、subjectBinding、grantRevision、grantStateVersion
        五项授权关联元数据必须成组出现，客户端必须将其与本次请求绑定后再执行；已识别授权的
        DENY 也可带这五项，未知授权或尚未识别授权的 DENY 可全部省略，禁止只返回部分元数据。
      required: [allowed, action, modelVersion, commercialPhase, evaluatedAt, recheckAt, reasonCategory, requestId, reservationFenceReferences]
      oneOf:
        - required: [productId, grantId, subjectBinding, grantRevision, grantStateVersion]
        - not:
            anyOf:
              - required: [productId]
              - required: [grantId]
              - required: [subjectBinding]
              - required: [grantRevision]
              - required: [grantStateVersion]
      properties:
        allowed: { type: boolean }
        action: { type: string }
        modelVersion: { type: integer, format: int64, minimum: 0, description: 实际执行的模型版本；未执行模型或无模型为0，不是商业授权修订 }
        commercialPhase: { type: string, nullable: true, enum: [NOT_STARTED, ACTIVE, COMMERCIAL_GRACE, ENDED], description: 无法确认授权阶段的DENY返回null }
        connectivityPhase: { type: string, description: 当前在线判定按NOT_APPLICABLE返回；无适用值时可省略 }
        evaluatedAt: { type: integer, format: int64, description: 判定时UTC Epoch秒 }
        recheckAt: { type: integer, format: int64, nullable: true, description: 有界ALLOW的商业截止UTC秒；无界或拒绝为null，不是跨请求缓存或断网许可 }
        reasonCategory: { type: string, description: ALLOW为ENTITLED；DENY为业务拒绝分类 }
        requestId: { type: string }
        reservationFenceReferences:
          type: array
          uniqueItems: true
          maxItems: 256
          items: { type: string, minLength: 1, maxLength: 128 }
          description: 本次判定实际核验并回传的额度预占围栏引用；无引用时为空数组
        productId: { type: string, description: 已识别授权时回显的产品编号；未知授权的通用DENY省略 }
        grantId: { type: string, description: 已识别授权时回显的授权编号；未知授权的通用DENY省略 }
        subjectBinding:
          $ref: '#/components/schemas/DecisionSubjectBinding'
        grantRevision: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991, description: 已识别授权的商业修订版本；必须为JSON安全整数 }
        grantStateVersion: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991, description: 已识别授权的管理状态版本；必须为JSON安全整数 }
    DecisionSubjectBinding:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, activationId, activationGeneration]
          properties:
            kind: { type: string, enum: [DEPLOYMENT] }
            activationId: { type: string, minLength: 1, maxLength: 128 }
            activationGeneration: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991 }
        - type: object
          additionalProperties: false
          required: [kind, subjectRef]
          properties:
            kind: { type: string, enum: [PERSON, SERVICE] }
            subjectRef:
              type: object
              additionalProperties: false
              required: [kind, sourceId, subjectId]
              properties:
                kind: { type: string, enum: [PERSON, SERVICE] }
                sourceId: { type: string, minLength: 1, maxLength: 128 }
                subjectId: { type: string, minLength: 1, maxLength: 128 }
            assignmentId: { type: string, minLength: 1, maxLength: 128 }
            assignmentGeneration: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991, description: assignmentId存在时必须同时存在 }
    OrganizationBindingInput:
      type: object
      additionalProperties: false
      required: [organizationInstanceId, rootDepartmentId]
      properties:
        organizationInstanceId: { type: string, minLength: 1, maxLength: 128, description: 治理者确认的当前组织实例引用 }
        rootDepartmentId: { type: integer, format: int64, minimum: 1 }
    OrganizationBindingView:
      type: object
      required: [customerId, organizationInstanceId, rootDepartmentId, bindingGeneration]
      properties:
        customerId: { type: string }
        organizationInstanceId: { type: string, nullable: true }
        rootDepartmentId: { type: integer, format: int64, nullable: true }
        bindingGeneration: { type: integer, nullable: true }
        rowVersion: { type: integer, format: int64, description: 已登记绑定返回；未绑定视图不含此字段 }
    ApplicationBindingItem:
      type: object
      required: [applicationId, basePermissionSnapshotVersion]
      description: 绑定引用与已批准快照；未提供快照时，联动清单创建必须显式提交desiredRules。
      properties:
        applicationId: { type: integer, format: int64 }
        basePermissionSnapshotVersion: { type: integer, format: int64 }
        basePermissionSnapshot: { $ref: '#/components/schemas/ProjectionRules' }
    ApplicationBindingsInput:
      type: object
      additionalProperties: false
      required: [items, expectedRowVersion]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ApplicationBindingItem' } }
        expectedRowVersion: { type: integer, format: int64 }
    ApplicationBindingsView:
      type: object
      required: [items, rowVersion]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ApplicationBindingItem' } }
        rowVersion: { type: integer, format: int64 }
    ProjectionRules:
      type: object
      additionalProperties: false
      required: [pagePermissions, apiPermissions]
      properties:
        pagePermissions: { type: array, items: { type: string }, description: 当前应用清单内精确PAGE码 }
        apiPermissions: { type: array, items: { type: string }, description: 当前应用清单内精确API码 }
        dataGrantTemplate:
          type: object
          nullable: true
          description: 官方simple-data-permission/1.0格式的完整DATA文档；无DATA模板为null，空对象非法
          required: [protocol, version, grants]
          properties:
            protocol: { type: string, enum: [simple-data-permission] }
            version: { type: string, enum: ['1.0'] }
            grants:
              type: array
              items:
                type: object
                required: [resource, actions, all, constraints]
                properties:
                  resource: { type: string }
                  actions: { type: array, items: { type: string } }
                  all: { type: boolean }
                  constraints: { type: array, items: { type: object }, description: 由官方DATA契约校验的约束，不扩展为业务自定义表达式 }
    RoleProjectionPlanInput:
      type: object
      additionalProperties: false
      required: [customerId, applicationId]
      properties:
        customerId: { type: string }
        applicationId: { type: string, pattern: '^[1-9][0-9]*$', description: 正整数编号的文本形态 }
        desiredRules: { $ref: '#/components/schemas/ProjectionRules' }
    ProjectionConfirmationInput:
      type: object
      additionalProperties: false
      required: [expectedRevision, organizationInstanceId, bindingGeneration]
      properties:
        expectedRevision: { type: integer, format: int64 }
        organizationInstanceId: { type: string }
        bindingGeneration: { type: integer }
        openRoleId: { type: string, description: 当前远端角色编号；已建立关联时须与回读目标一致 }
    IntegrationAttemptInput:
      type: object
      additionalProperties: false
      properties:
        executionMode: { type: string, enum: [MANUAL, AUTO], default: MANUAL }
    ProjectionReconciliationInput:
      type: object
      additionalProperties: false
      required: [expectedRevision, organizationInstanceId, bindingGeneration, priorCallTerminated]
      properties:
        expectedRevision: { type: integer, format: int64 }
        organizationInstanceId: { type: string }
        bindingGeneration: { type: integer }
        openRoleId: { type: string }
        priorCallTerminated: { type: boolean, enum: [true], description: 治理者明确确认旧外部调用已终止 }
    ProjectionEnvironmentInput:
      type: object
      additionalProperties: false
      required: [customerId, applicationId, organizationInstanceId, bindingGeneration, priorCallTerminated]
      properties:
        customerId: { type: string }
        applicationId: { type: string, pattern: '^[1-9][0-9]*$' }
        organizationInstanceId: { type: string }
        bindingGeneration: { type: integer }
        desiredRules: { $ref: '#/components/schemas/ProjectionRules' }
        priorCallTerminated: { type: boolean, enum: [true] }
    RoleProjectionPlanView:
      type: object
      required: [planId, commandId, customerId, productId, applicationId, desiredRevision, state, executionMode, validUntil, planValidUntil, confirmedRevision, failureReason, desiredRules, departmentDiff, rowVersion]
      properties:
        planId: { type: string }
        commandId: { type: string }
        customerId: { type: string }
        productId: { type: string }
        applicationId: { type: string, description: 应用编号以文本形态回显 }
        desiredRevision: { type: integer, format: int64 }
        state: { type: string, enum: [PENDING_EXECUTION, MANUALLY_CONFIRMED, SUPERSEDED, VERIFIED, DRIFTED, UNCERTAIN, ENVIRONMENT_RECONFIRM_REQUIRED] }
        executionMode: { type: string, enum: [MANUAL, AUTO] }
        validUntil: { type: integer, format: int64, description: 清单有效截止UTC Epoch秒 }
        planValidUntil: { type: integer, format: int64, description: 与validUntil相同 }
        confirmedRevision: { type: integer, format: int64, nullable: true }
        failureReason: { type: string, nullable: true, description: 固定错误分类或执行中提示，不返回外部调用令牌 }
        rowVersion: { type: integer, format: int64 }
        projectionId: { type: string }
        externalId: { type: string, description: License维护的稳定外部关联标识，不是远端roleCode }
        organizationInstanceId: { type: string }
        bindingGeneration: { type: integer }
        rootDepartmentId: { type: integer, format: int64 }
        manifestVersion: { type: integer, format: int64, description: 当前应用权限清单版本 }
        manifestDigest: { type: string, description: 当前应用权限清单摘要 }
        contributionPresent: { type: boolean, description: 是否存在有效人员商业授权贡献 }
        contributions:
          type: array
          items:
            type: object
            required: [grantId, grantRevision, grantStateVersion]
            properties: { grantId: { type: string }, grantRevision: { type: integer, format: int64 }, grantStateVersion: { type: integer, format: int64 } }
        approvedRules: { $ref: '#/components/schemas/ProjectionRules' }
        desiredRules: { $ref: '#/components/schemas/ProjectionRules' }
        targetDepartmentIds: { type: array, items: { type: integer, format: int64 } }
        departmentDiff:
          type: object
          required: [toMount, toUnmount]
          properties:
            toMount: { type: array, items: { type: integer, format: int64 } }
            toUnmount: { type: array, items: { type: integer, format: int64 } }
        openRoleId: { type: string, description: 已存在远端关联时返回 }
        remoteRevision: { type: integer, format: int64, description: 已回读远端角色时返回 }
    IntegrationCommandPage:
      type: object
      required: [data, total, page, size, totalPages]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/RoleProjectionPlanView' } }
        total: { type: integer, format: int64 }
        page: { type: integer, minimum: 1 }
        size: { type: integer, minimum: 1, maximum: 200 }
        totalPages: { type: integer, format: int64 }
    SigningOperationView:
      type: object
      required: [operationId, credentialId, grantId, state, executionGeneration, rowVersion, lastKmsCallAt, reasonCategory, resultResource]
      properties:
        operationId: { type: string }
        credentialId: { type: string }
        grantId: { type: string }
        state: { type: string, enum: [PENDING_SIGN, SIGNING, READY, UNCERTAIN, REJECTED, ABANDONED] }
        executionGeneration: { type: integer, format: int64, minimum: 1 }
        rowVersion: { type: integer, format: int64, minimum: 0 }
        lastKmsCallAt: { type: string, format: date-time, nullable: true, description: 最近一次签名调用时刻，ISO 8601 UTC文本 }
        reasonCategory: { type: string, nullable: true }
        resultResource: { type: string, nullable: true, description: READY时指向独立deliver接口；访问仍核当前权限与业务状态 }
    SigningOperationPage:
      type: object
      required: [data, total, page, size, totalPages]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/SigningOperationView' } }
        total: { type: integer, format: int64 }
        page: { type: integer, minimum: 1 }
        size: { type: integer, minimum: 1, maximum: 100 }
        totalPages: { type: integer, format: int64 }
    SigningRecoveryInput:
      type: object
      additionalProperties: false
      required: [expectedRowVersion]
      properties:
        expectedRowVersion: { type: integer, format: int64, minimum: 0 }
        expectedExecutionGeneration: { type: integer, format: int64, minimum: 1, description: 接管SIGNING必填，UNCERTAIN可省略 }
        reasonCategory: { type: string, minLength: 1, maxLength: 64, description: 接管SIGNING必填 }
    SigningAbandonmentInput:
      type: object
      additionalProperties: false
      required: [expectedRowVersion]
      properties:
        expectedRowVersion: { type: integer, format: int64, minimum: 0 }
        reasonCategory: { type: string, minLength: 1, maxLength: 64 }
    FulfillmentSynchronizationInput:
      type: object
      additionalProperties: false
      properties:
        batchSize: { type: integer, default: 50, minimum: 1, maximum: 100 }
    FulfillmentSynchronizationView:
      type: object
      required: [pulled, created, skippedExisting, completed, awaitingConfiguration, reportPending, failed]
      properties:
        pulled: { type: integer, minimum: 0 }
        created: { type: integer, minimum: 0, description: 新建自有授权草稿数，不等于完成履约数 }
        skippedExisting: { type: integer, minimum: 0 }
        completed: { type: integer, minimum: 0, description: 授权启用且完成回报已确认的项数 }
        awaitingConfiguration: { type: integer, minimum: 0 }
        reportPending: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        failures: { type: object, additionalProperties: { type: string }, description: 存在失败或未确认项时返回，键为履约编号 }
    KeyDisposalAdviceView:
      type: object
      required: [profileId, kid, status, retiredAt, referencingLiveCredentials, retainIndefinitely, retainUntilEpoch, retainUntilIso, advice]
      properties:
        profileId: { type: string }
        kid: { type: string }
        status: { type: string, enum: [RETIRED] }
        retiredAt: { type: string, format: date-time, nullable: true }
        referencingLiveCredentials: { type: integer, minimum: 0 }
        retainIndefinitely: { type: boolean, description: 永久或坏载荷无法确认截止时为true，不伪造日期 }
        retainUntilEpoch: { type: integer, format: int64, nullable: true }
        retainUntilIso: { type: string, format: date-time, nullable: true }
        advice: { type: string, enum: [RETAIN_UNTIL_WINDOW_PASSED, SAFE_TO_SCHEDULE_DESTRUCTION] }
    AssignmentReplacementInput:
      type: object
      additionalProperties: false
      required: [sourceId, subjectId, expectedRowVersion]
      properties:
        sourceId: { type: string, minLength: 1, maxLength: 128 }
        subjectId: { type: string, minLength: 1, maxLength: 128 }
        expectedRowVersion: { type: integer, format: int64 }
    AssignmentView:
      type: object
      required: [assignmentId, grantId, subjectRef, assignmentGeneration, state, metrics, rowVersion]
      properties:
        assignmentId: { type: string }
        grantId: { type: string }
        subjectRef:
          type: object
          required: [kind, sourceId, subjectId]
          properties: { kind: { type: string, enum: [PERSON, SERVICE] }, sourceId: { type: string }, subjectId: { type: string } }
        assignmentGeneration: { type: integer, format: int64, minimum: 1 }
        state: { type: string, enum: [ACTIVE, SUSPENDED, REPLACED, REVOKED] }
        metrics: { type: array, items: { type: string } }
        rowVersion: { type: integer, format: int64 }
    ActivationReplacementInput:
      type: object
      additionalProperties: false
      required: [expectedRowVersion]
      properties:
        expectedRowVersion: { type: integer, format: int64, minimum: 0 }
        callerBinding:
          allOf: [ { $ref: '#/components/schemas/CallerBinding' } ]
          nullable: true
          description: 省略继承旧绑定；OFFLINE显式null清除，其他模式须为完整对象
        componentDigests: { type: object, nullable: true, maxProperties: 0, description: 当前NONE政策要求省略、null或空对象 }
        reasonCategory: { type: string }
    RevocationPackageView:
      type: object
      required: [packageId, operationId, productId, sequence, snapshotId, state, partCount, resultResource]
      properties:
        packageId: { type: string }
        operationId: { type: string }
        productId: { type: string }
        sequence: { type: integer, format: int64, minimum: 1 }
        snapshotId: { type: string }
        state: { type: string, enum: [PENDING, SIGNING, READY, FAILED, UNCERTAIN] }
        partCount: { type: integer, minimum: 0, maximum: 256 }
        resultResource: { type: string }
    RevocationPackageContentView:
      type: object
      required: [packageId, productId, sequence, snapshotId, manifestJws, revocationPartJws]
      properties:
        packageId: { type: string }
        productId: { type: string }
        sequence: { type: integer, format: int64, minimum: 1 }
        snapshotId: { type: string }
        manifestJws: { type: string }
        revocationPartJws: { type: array, minItems: 1, maxItems: 256, items: { type: string } }
    TrustMaterialView:
      type: object
      required: [issuerId, productId, sequence, issuedAt, snapshotId, manifestJws, revocationPartJws, trustedPublicKeysJson]
      properties:
        issuerId: { type: string }
        productId: { type: string }
        sequence: { type: integer, format: int64, minimum: 1 }
        issuedAt: { type: integer, format: int64 }
        snapshotId: { type: string }
        manifestJws: { type: string }
        revocationPartJws: { type: array, minItems: 1, maxItems: 256, items: { type: string } }
        trustedPublicKeysJson: { type: array, items: { type: string } }
