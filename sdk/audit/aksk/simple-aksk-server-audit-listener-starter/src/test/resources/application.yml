spring:
  # 模块测试默认叠加 local-test（开发测试库，物理隔离联调库）；与本仓 Server Starter 测试配置同范式
  profiles:
    active: local-test,local
  # MySQL 连接由 simple-mysql-route-starter 接管；连接契约在下方 mysql.route 配置
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  # Redis 连接由 simple-redis-route-starter 接管（limiter/cache 走 RedisRouteTemplate）
io:
  github:
    surezzzzzz:
      sdk:
        mysql:
          route:
            enable: true
            primary-datasource: default
            datasources:
              default:
                url: jdbc:mysql://localhost:3306/sure_auth_aksk?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
                username: root
                password: # 请在 application-local.yml 中配置真实密码
                driver-class-name: com.mysql.cj.jdbc.Driver
        redis:
          route:
            enable: true
            sources:
              default:
                host: localhost
                port: 6379
                database: 1
                timeout-ms: 3000
                pool:
                  enabled: true
                  max-active: 8
                  max-idle: 8
                  min-idle: 2

        auth:
          aksk:
            server:
              jwt:
                key-id: test-key-2026
                public-key: classpath:keys/public.pem
                private-key: classpath:keys/private.pem
                expires-in: 3600
              redis:
                token:
                  me: "audit-test-app"
              admin:
                enabled: false
        limiter:
          redis:
            smart:
              enable: true
              me: ${io.github.surezzzzzz.sdk.auth.aksk.server.redis.token.me:audit-test-app}
              mode: annotation
        cache:
          key-prefix: sure-auth-aksk
          me: ${io.github.surezzzzzz.sdk.auth.aksk.server.redis.token.me:audit-test-app}
          l1:
            enabled: true
            expire-seconds: 10
            max-size: 10000
          l2:
            enabled: true
            expire-seconds: ${io.github.surezzzzzz.sdk.auth.aksk.server.jwt.expires-in:3600}
            key-format: "{keyPrefix}:{me}:{cacheName}::{key}"
          consistency:
            mode: strong

logging:
  level:
    io.github.surezzzzzz.sdk.audit.aksk.server: DEBUG
    io.github.surezzzzzz.sdk.auth.aksk.server: DEBUG
