spring:
  profiles:
    active: local
io.github.surezzzzzz.sdk.elasticsearch:
  route:
    enable: true
    default-source: primary
    version-detect:
      fail-fast-on-detect-error: true
    sources:
      primary:
        urls: http://localhost:19217
        server-version: 7.17.16
      secondary:
        urls: http://localhost:19280
        server-version: 8.17.0
    rules:
      - pattern: "test-jpa7-*"
        datasource: primary
        type: wildcard
      - pattern: "test-jpa8-*"
        datasource: secondary
        type: wildcard
  persistence:
    enable: true
io.github.surezzzzzz.sdk.audit.persistence.elasticsearch.listener:
  enable: true
logging:
  level:
    io.github.surezzzzzz.sdk.audit.persistence.elasticsearch: DEBUG
    io.github.surezzzzzz.sdk.elasticsearch.persistence: DEBUG
