io:
  github:
    surezzzzzz:
      sdk:
        kafka:
          route:
            enable: true
            default-source: v37
            sources:
              v110:
                bootstrap-servers:
                  - localhost:18091
                client-id: kafka-consumer-e2e-v110
                producer:
                  client-id: kafka-consumer-e2e-v110-producer
                  acks: all
                consumer:
                  client-id: kafka-consumer-e2e-v110-consumer
                  group-id: kafka-consumer-e2e-v110-default
                  auto-offset-reset: earliest
                  enable-auto-commit: false
              v28:
                bootstrap-servers:
                  - localhost:18092
                client-id: kafka-consumer-e2e-v28
                producer:
                  client-id: kafka-consumer-e2e-v28-producer
                  acks: all
                consumer:
                  client-id: kafka-consumer-e2e-v28-consumer
                  group-id: kafka-consumer-e2e-v28-default
                  auto-offset-reset: earliest
                  enable-auto-commit: false
              v37:
                bootstrap-servers:
                  - localhost:18094
                client-id: kafka-consumer-e2e-v37
                producer:
                  client-id: kafka-consumer-e2e-v37-producer
                  acks: all
                consumer:
                  client-id: kafka-consumer-e2e-v37-consumer
                  group-id: kafka-consumer-e2e-v37-default
                  auto-offset-reset: earliest
                  enable-auto-commit: false
              cluster:
                bootstrap-servers:
                  - localhost:19192
                  - localhost:19193
                  - localhost:19194
                client-id: kafka-consumer-e2e-cluster
                producer:
                  client-id: kafka-consumer-e2e-cluster-producer
                  acks: all
                consumer:
                  client-id: kafka-consumer-e2e-cluster-consumer
                  group-id: kafka-consumer-e2e-cluster-default
                  auto-offset-reset: earliest
                  enable-auto-commit: false
            diagnostics:
              enable: true
              startup-check: true
              fail-fast: true
              timeout-ms: 5000
        redis:
          route:
            enable: true
            default-source: e2e
            sources:
              e2e:
                mode: standalone
                host: localhost
                port: 16381
                timeout-ms: 3000
                connect-timeout-ms: 3000
        messaging:
          kafka:
            consumer:
              enable: true
              idempotency:
                enable: true
                ttl-ms: 60000
                lease-ms: 2000
                redis-route-key: e2e
              error:
                max-attempts: 3
                initial-interval-ms: 25
                multiplier: 1.0
                max-interval-ms: 25
                jitter-factor: 0.0
                dead-letter:
                  enable: true
                  suffix: .DLT
              container:
                auto-offset-reset: earliest
                enable-auto-commit: false
                max-poll-records: 10
                concurrency: 1
                shutdown-await-ms: 10000
