<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Outbox 管理台登录</title>
    <link rel="stylesheet" th:href="@{${bootstrapCssUrl}}">
    <link rel="stylesheet" th:href="@{${managementUiCssUrl}}">
</head>
<body class="login-page d-flex align-items-center justify-content-center p-3">
<main class="card login-card">
    <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
            <img alt="Sure-Zzzzzz" class="brand-icon mb-3" height="56" th:src="@{${brandIconUrl}}" width="56">
            <h1 class="h3 management-brand mb-2">Outbox 管理台</h1>
            <p class="text-muted mb-0">仅用于人工排障与 POISON 记录重置</p>
        </div>
        <div class="alert alert-danger" role="alert" th:if="${param.error}">用户名或密码错误，请重新输入。</div>
        <div class="alert alert-success" role="alert" th:if="${param.logout}">您已安全退出登录。</div>
        <form method="post" th:action="${loginUrl}">
            <div class="mb-3">
                <label class="form-label" for="username">用户名</label>
                <input autocomplete="username" autofocus class="form-control form-control-lg" id="username"
                       name="username" required type="text">
            </div>
            <div class="mb-4">
                <label class="form-label" for="password">密码</label>
                <input autocomplete="current-password" class="form-control form-control-lg" id="password"
                       name="password"
                       required type="password">
            </div>
            <input th:name="${_csrf.parameterName}" th:value="${_csrf.token}" type="hidden">
            <div class="d-grid">
                <button class="btn btn-primary btn-lg" type="submit">登录管理台</button>
            </div>
        </form>
    </div>
</main>
</body>
</html>
